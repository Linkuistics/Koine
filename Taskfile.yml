version: '3'

tasks:
  fixture:ax-routing-detail:
    desc: Build AppKit callback and top-level attestation inspectors (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-routing-detail
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/ax-top-level-routing/receiver-callbacks.m -framework Cocoa -framework ApplicationServices -o .build/ax-routing-detail/receiver-callbacks
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/ax-top-level-routing/attest.m -framework Cocoa -framework ApplicationServices -o .build/ax-routing-detail/attest
      - /usr/bin/ditto -c -k .build/ax-routing-detail .build/ax-routing-detail.zip

  fixture:ax-routing:
    desc: Build and sign the AX top-level routing diagnostic (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-routing/K68Routing.app/Contents/MacOS
      - sed 's/K54Binding/K68Routing/g; s/k54-binding/k68-routing/g' docs/verification/retained-ax-binding/Info.plist > .build/ax-routing/K68Routing.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/ax-top-level-routing/routing-probe.m -framework Cocoa -framework ApplicationServices -lbsm -o .build/ax-routing/K68Routing.app/Contents/MacOS/K68Routing
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/ax-top-level-routing/handler-inspect.m -framework Cocoa -framework ApplicationServices -o .build/ax-routing/handler-inspect
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-routing/K68Routing.app
      - codesign --verify --strict --verbose=2 .build/ax-routing/K68Routing.app
      - /usr/bin/ditto -c -k .build/ax-routing .build/ax-routing.zip

  fixture:ax-role-read:
    desc: Build and sign the one-read AX contact control (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-restoration-role
      - xcrun clang -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/ax-automatic-restoration/role-read.c -framework ApplicationServices -o .build/ax-restoration-role/role-read
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-restoration-role/role-read
      - codesign --verify --strict --verbose=2 .build/ax-restoration-role/role-read

  fixture:ax-restoration:
    desc: Build and sign the AX client-lifetime restoration diagnostic (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-restoration-holder/K69Restoration.app/Contents/MacOS
      - sed 's/K54Binding/K69Restoration/g; s/k54-binding/k69-restoration/g' docs/verification/retained-ax-binding/Info.plist > .build/ax-restoration-holder/K69Restoration.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/ax-automatic-restoration/restoration-probe.m -framework Cocoa -framework ApplicationServices -lbsm -o .build/ax-restoration-holder/K69Restoration.app/Contents/MacOS/K69Restoration
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-restoration-holder/K69Restoration.app
      - codesign --verify --strict --verbose=2 .build/ax-restoration-holder/K69Restoration.app
      - /usr/bin/ditto -c -k .build/ax-restoration-holder .build/ax-restoration-holder.zip

  fixture:ax-restoration-target:
    desc: Build the automatic-termination fixture with a minimizable window (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-restoration/K65AutoTerm.app/Contents/MacOS
      - sed 's/K51AutoTerm/K65AutoTerm/g; s/k51.autoterm/k65.autoterm/g' docs/verification/process-serial-lifetime/Info.plist > .build/ax-restoration/K65AutoTerm.app/Contents/Info.plist
      - sed 's/NSWindowStyleMaskClosable/NSWindowStyleMaskClosable|NSWindowStyleMaskMiniaturizable/' docs/verification/process-serial-lifetime/AutoTerm.m > .build/ax-restoration/AutoTerm.m
      - xcrun clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations .build/ax-restoration/AutoTerm.m -framework Cocoa -framework ApplicationServices -framework IOKit -o .build/ax-restoration/K65AutoTerm.app/Contents/MacOS/K65AutoTerm
      - /usr/bin/ditto -c -k .build/ax-restoration .build/ax-restoration.zip

  fixture:ax-transitions:
    desc: Build and sign the admitted AX exec/restoration diagnostic (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-transitions/K65Transitions.app/Contents/MacOS
      - sed 's/K54Binding/K65Transitions/g; s/k54-binding/k65-transitions/g' docs/verification/retained-ax-binding/Info.plist > .build/ax-transitions/K65Transitions.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/transition-probe.m -framework Cocoa -framework ApplicationServices -lbsm -o .build/ax-transitions/K65Transitions.app/Contents/MacOS/K65Transitions
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-transitions/K65Transitions.app
      - codesign --verify --strict --verbose=2 .build/ax-transitions/K65Transitions.app
      - /usr/bin/ditto -c -k .build/ax-transitions .build/ax-transitions.zip

  fixture:ax-receiver-inspector:
    desc: Build the receiver and resolved-import inspector (execute only in TestAnyware)
    cmds:
      - mkdir -p .build
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/receiver-inspect.m -framework Cocoa -framework ApplicationServices -o .build/receiver-inspect

  fixture:ax-admission:
    desc: Build and sign the audited read and direct-effect diagnostic (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-admission/K63Admission.app/Contents/MacOS
      - sed 's/K54Binding/K63Admission/g; s/k54-binding/k63-admission/g' docs/verification/retained-ax-binding/Info.plist > .build/ax-admission/K63Admission.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/admission-probe.m -framework Cocoa -framework ApplicationServices -lbsm -o .build/ax-admission/K63Admission.app/Contents/MacOS/K63Admission
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-admission/K63Admission.app
      - codesign --verify --strict --verbose=2 .build/ax-admission/K63Admission.app
      - /usr/bin/ditto -c -k .build/ax-admission .build/ax-admission.zip

  fixture:ax-effects:
    desc: Build and sign the build-specific direct AX effect diagnostic (execute only in TestAnyware)
    cmds:
      - mkdir -p .build/ax-effects/K61Effects.app/Contents/MacOS
      - sed 's/K54Binding/K61Effects/g; s/k54-binding/k61-effects/g' docs/verification/retained-ax-binding/Info.plist > .build/ax-effects/K61Effects.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/effects-probe.m -framework Cocoa -framework ApplicationServices -lbsm -o .build/ax-effects/K61Effects.app/Contents/MacOS/K61Effects
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-effects/K61Effects.app
      - codesign --verify --strict --verbose=2 .build/ax-effects/K61Effects.app
      - /usr/bin/ditto -c -k .build/ax-effects .build/ax-effects.zip

  fixture:ax-inspector:
    desc: Build the loaded-code AX inspector (execute only in a TestAnyware VM)
    cmds:
      - mkdir -p .build
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/inspect-endpoint.m -framework Cocoa -framework ApplicationServices -o .build/inspect-endpoint

  fixture:ax-challenge:
    desc: Build and sign the AX audit-reply diagnostic (execute only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/ax-challenge/K59Challenge.app/Contents/MacOS
      - sed 's/K54Binding/K59Challenge/g; s/k54-binding/k59-challenge/g' docs/verification/retained-ax-binding/Info.plist > .build/ax-challenge/K59Challenge.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/endpoint-challenge.m -framework Cocoa -framework ApplicationServices -lbsm -o .build/ax-challenge/K59Challenge.app/Contents/MacOS/K59Challenge
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-challenge/K59Challenge.app
      - codesign --verify --strict --verbose=2 .build/ax-challenge/K59Challenge.app
      - /usr/bin/ditto -c -k .build/ax-challenge .build/ax-challenge.zip

  fixture:ax-endpoint:
    desc: Build and sign the direct AX endpoint diagnostic (execute only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/ax-endpoint/K59Endpoint.app/Contents/MacOS
      - sed 's/K54Binding/K59Endpoint/g; s/k54-binding/k59-endpoint/g' docs/verification/retained-ax-binding/Info.plist > .build/ax-endpoint/K59Endpoint.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/endpoint-probe.m -framework Cocoa -framework ApplicationServices -o .build/ax-endpoint/K59Endpoint.app/Contents/MacOS/K59Endpoint
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/ax-endpoint/K59Endpoint.app
      - codesign --verify --strict --verbose=2 .build/ax-endpoint/K59Endpoint.app
      - /usr/bin/ditto -c -k .build/ax-endpoint .build/ax-endpoint.zip

  fixture:private-ax:
    desc: Build and sign the private AX PID-recycling diagnostic (execute only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/private-ax/K56PrivateBinding.app/Contents/MacOS
      - sed 's/K54Binding/K56PrivateBinding/g; s/k54-binding/k56-private-binding/g' docs/verification/retained-ax-binding/Info.plist > .build/private-ax/K56PrivateBinding.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/private-probe.m -framework Cocoa -framework ApplicationServices -o .build/private-ax/K56PrivateBinding.app/Contents/MacOS/K56PrivateBinding
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/private-ax/K56PrivateBinding.app
      - codesign --verify --strict --verbose=2 .build/private-ax/K56PrivateBinding.app
      - /usr/bin/ditto -c -k .build/private-ax .build/private-ax.zip

  fixture:retained-ax:
    desc: Build the retained-AX PID-recycling diagnostic without launching it (run only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/retained-ax/K54Binding.app/Contents/MacOS
      - cp docs/verification/retained-ax-binding/Info.plist .build/retained-ax/K54Binding.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/probe.m -framework Cocoa -framework ApplicationServices -o .build/retained-ax/K54Binding.app/Contents/MacOS/K54Binding
      - /usr/bin/ditto -c -k .build/retained-ax .build/retained-ax.zip

  design:render-process-identity:
    desc: Render the editable process-identity discussion as SVG and PNG
    dir: docs/design/architecture
    cmds:
      - plantuml --svg --check-before-run --no-error-image process-capture.puml process-serial.puml process-binding.puml process-endpoint.puml process-effects.puml process-admission.puml process-receiver.puml process-restoration.puml process-routing.puml process-adoption.puml
      - plantuml --png --check-before-run --no-error-image -o ../../../.build/design-identity process-capture.puml process-serial.puml process-binding.puml process-endpoint.puml process-effects.puml process-admission.puml process-receiver.puml process-restoration.puml process-routing.puml process-adoption.puml

  fixture:process-serial:
    desc: Build and package the diagnostic process-serial probes without launching them (run only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/process-serial/K51AutoTerm.app/Contents/MacOS
      - cp docs/verification/process-serial-lifetime/Info.plist .build/process-serial/K51AutoTerm.app/Contents/Info.plist
      - xcrun clang -Wall -Wextra -Wno-deprecated-declarations docs/verification/process-serial-lifetime/lookup.c -framework ApplicationServices -lbsm -o .build/process-serial/koine-k51-psn-probe
      - xcrun clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations docs/verification/process-serial-lifetime/AutoTerm.m -framework Cocoa -framework ApplicationServices -framework IOKit -o .build/process-serial/K51AutoTerm.app/Contents/MacOS/K51AutoTerm
      - /usr/bin/ditto -c -k .build/process-serial .build/process-serial.zip

  default:
    desc: Build and test
    cmds:
      - task: build
      - task: test

  build:
    desc: Build all targets
    cmds:
      - swift build
      - scripts/stage-provider-framework.sh debug

  test:
    desc: Run the public-seam and native-seam suites over real loopback HTTP
    cmds:
      - swift build --build-tests
      - task: fixture:variants
      - task: desktop-provider
      - swift test --skip-build

  fixture:
    desc: Stage KoineProviderAPI.framework, build the fixture provider against it outside the package, sign and approve it
    cmds:
      - |
        FRAMEWORK="$(scripts/stage-provider-framework.sh debug)"
        Fixtures/FixtureProvider/build.sh "$(dirname "${FRAMEWORK}")" "$(dirname "${FRAMEWORK}")/../FixtureProviders"

  fixture:variants:
    desc: Build, sign and approve the deliberately bad (and the few good) fixture bundles the native loader tests refuse or load
    deps: [fixture]
    cmds:
      - |
        PRODUCTS="$(swift build --show-bin-path)"
        Fixtures/FixtureProvider/build-variants.sh "${PRODUCTS}/PackageFrameworks" "${PRODUCTS}/FixtureProviders" "${PRODUCTS}/FixtureVariants"

  desktop-provider:
    desc: Build the desktop provider by its own build definition against the staged framework, then sign and approve it as an installed provider for the loader tests
    cmds:
      - |
        FRAMEWORK="$(scripts/stage-provider-framework.sh debug)"
        BUNDLE="$(Providers/DesktopProvider/build.sh "$(dirname "${FRAMEWORK}")" "$(dirname "${FRAMEWORK}")/../DesktopProviders")"
        Fixtures/FixtureProvider/seal.sh "${BUNDLE}"

  app:
    desc: Assemble and sign .build/app/Koine.app (Developer ID; KOINE_SIGNING_IDENTITY overrides)
    cmds:
      - scripts/build-app.sh

  app:notarize:
    desc: Submit the built bundle to Apple's notary service, wait, staple the ticket and zip the release artifact (KOINE_NOTARY_PROFILE names the stored credential; default koine-notary)
    cmds:
      - scripts/notarize-app.sh

  app:verify:
    desc: Verify the bundle's version, signature, hardened runtime, designated requirement and stapled notarization ticket, and that Gatekeeper accepts it as a notarized Developer ID build
    cmds:
      - scripts/verify-app.sh

  check:minimum-os:
    desc: Check that every place stating Koine's macOS floor - Package.swift, the desktop provider's manifest, the spec, the README and the assembled bundle's Info.plist and Mach-O minos - agrees with App/Info.plist's LSMinimumSystemVersion
    cmds:
      - scripts/check-minimum-os.sh

  version:
    desc: Print the one version the bundle, the release tag, the release artifact and the cask all take from App/Info.plist
    cmds:
      - |
        source scripts/signing-env.sh
        printf 'version %s\ntag     %s\nartifact %s\n' "${MARKETING_VERSION}" "${RELEASE_TAG}" "${RELEASE_ARTIFACT}"

  fixture:notarized:
    desc: Make a notarized copy of the fixture provider (secure timestamp, hardened runtime, submitted and Accepted; not stapleable, as no provider bundle is), approved in a root of its own, for the Gatekeeper check to accept
    deps: [fixture]
    cmds:
      - |
        PRODUCTS="$(swift build --show-bin-path)"
        Fixtures/FixtureProvider/notarize.sh "${PRODUCTS}/FixtureProviders" "${PRODUCTS}/NotarizedFixtureProviders"

  app:vm-verify-notarized:
    desc: Verify on a Gatekeeper-ENFORCING TestAnyware macOS clone that a quarantined copy of the notarized, stapled bundle launches at first run with no right-click-Open, is assessed as source=Notarized Developer ID, names Koine in the Accessibility consent dialog, loads its bundled desktop provider, refuses a quarantined un-notarized per-user provider before dlopen with no system dialog, and loads a quarantined notarized one
    deps: [fixture:variants, fixture:notarized]
    cmds:
      - scripts/vm-verify-notarized.sh

  app:vm-verify-release:
    desc: Release acceptance, platform half, in ONE Gatekeeper-ENFORCING TestAnyware macOS session on the notarized, stapled, quarantined bundle - the hardened runtime with the empty entitlements file read in the guest, Accessibility consent absent, requested twice in one run of Koine and again in a later one, given and revoked with the prompt and the System Settings entry naming Koine, the os-permission error at the original response path told apart from a missing capability with no dialog raised by a read, same-titled windows under distinct stable references, a live PID claimed at another start instant, window closure and what a Koine restart does to each kind of reference, the management window closed with the listener and the provider still serving, and login launch across a VM restart with no client installed
    cmds:
      - scripts/vm-verify-release.sh

  app:vm-verify-grant-workflows:
    desc: Release acceptance, grant-workflow half, in ONE Gatekeeper-ENFORCING TestAnyware macOS session on the notarized, stapled, quarantined bundle - a grant created in the window and handed to a script, a client enrolled and approved in the window with nothing typed, pasted or shown, a pending requester that reads its own request and neither approves itself nor enumerates nor reaches a provider operation, an already-decided refusal composed into the window's own sentence with both lists re-read, sixteen requests pending together with the window scrolled to reach and deny one, HTTP 429 with Retry-After past the enrollment rate limit and pending-request-limit past the pending cap, and an enrolled grant revoked in the window whose credential is then refused 401 on the very connection it was served on and again after a restart
    cmds:
      - scripts/vm-verify-grant-workflows.sh

  app:vm-verify:
    desc: Verify the signed bundle in a clean TestAnyware macOS VM (install, login launch, grant, revoke, quit)
    cmds:
      - scripts/vm-verify.sh

  app:vm-verify-providers:
    desc: Verify in a clean TestAnyware macOS VM that the signed, hardened bundle loads an approved same-team fixture provider and refuses an ad-hoc signed or incompatible one
    deps: [fixture:variants]
    cmds:
      - scripts/vm-verify-providers.sh

  app:vm-verify-desktop:
    desc: Verify in a clean TestAnyware macOS VM that the signed bundle's desktop provider is ACTIVE, resolves a real application by pid and startedAt, lists same-titled windows under distinct references, refuses a grant without desktop:read, reports stale, wrong-kind and malformed references as unavailable, and reports absent or revoked Accessibility consent as an os-permission error without a consent dialog
    cmds:
      - scripts/vm-verify-desktop.sh

  app:vm-verify-desktop-focus:
    desc: Verify in a clean TestAnyware macOS VM that the signed bundle's desktopFocusWindow, under desktop:control alone, focuses exactly the chosen one of two same-titled windows, a background application's, a minimised and an other-Space window, as an independent native witness sees it, and that a closed, quit, restarted or unresolvable target and revoked consent are errors that move no focus
    cmds:
      - scripts/vm-verify-desktop-focus.sh

  app:vm-verify-desktop-remembered:
    desc: Verify in a clean TestAnyware macOS VM that the signed bundle's desktop provider lists a window left on another Space as REMEMBERED under the reference it had while CURRENT, revalidates and focuses it on selection, drops a closed window and a terminated application, as an independent native witness sees the destruction reported, and keeps observing with the management window closed
    cmds:
      - scripts/vm-verify-desktop-remembered.sh

  app:vm-verify-latency:
    desc: Measure, in a clean TestAnyware macOS VM on the signed bundle, warm query-to-choices and selection-to-focus latency in the keyboard workflow - a rotation of switches between two same-titled Finder windows and a TextEdit document, each starting from an asserted window and following real keystrokes in it - and print the observed distribution as a report, never a target
    cmds:
      - scripts/vm-verify-latency.sh

  app:vm-verify-accessibility:
    desc: Verify in a clean TestAnyware macOS VM that the signed bundle's window shows Accessibility guidance, provider and service status, that koineManagement.osPermissions reports the same consent to koine:manage alone without prompting, that the window's request makes macOS name Koine in its dialog and in System Settings, and that both follow consent given and removed without a restart
    cmds:
      - scripts/vm-verify-accessibility.sh

  app:vm-verify-enrollment:
    desc: Verify in a clean TestAnyware macOS VM that a guest client with a secret of its own requests koine:manage and the desktop capabilities, that the signed bundle's window shows its label, code, exact capability set and the koine:manage warning, that a subset approved there deliberately makes the unchanged secret the first manager's, which approves a second client over GraphQL, that a third is denied in the window, and that grants and decisions survive a restart, with no credential typed, pasted or shown
    cmds:
      - scripts/vm-verify-enrollment.sh

  client:
    desc: Generate the contract-only client's TypeScript from the introspection response it was captured against, validating the five operations of docs/design/desktop-operations.graphql against that schema, then typecheck, bundle to one dependency-free file and run its adapter checks
    dir: clients/contract-only
    cmds:
      - npm ci
      - npm run build

  app:vm-verify-contract-client:
    desc: Verify in a clean TestAnyware macOS VM that a client written from the documented contract alone obtains a grant through the window, introspects the schema it was generated against, resolves a running application, lists its windows and focuses a chosen one with the reference returned unchanged, telling a capability denial, an OS-permission refusal, an absent process, a gone window and a stopped service apart
    cmds:
      - scripts/vm-verify-contract-client.sh

  conformance:
    desc: Check the schema the notarized Koine.app serves in a TestAnyware VM, composed with its bundled desktop provider, against docs/design/desktop-schema.graphql by type, field, argument, nullability, default, deprecation and description, and its digest against the one Koine served; the run first proves the check red against four mutated copies of the contract
    cmds:
      - scripts/vm-verify-conformance.sh

  compat:
    desc: Build and run the binary compatibility pairs (independently built old/new hosts and providers)
    cmds:
      - task: compat:build
      - task: compat:verify

  compat:build:
    desc: Build the baseline and newer-minor revisions in separate trees under .build/compat, and the later fixtures (CONFIGURATION=debug|release)
    cmds:
      - scripts/build-compat-pairs.sh {{.CONFIGURATION | default "debug"}}

  compat:verify:
    desc: Pair each revision's provider with the other revision's headless host and check every case over loopback HTTP
    cmds:
      - scripts/verify-compat-pairs.py {{.CONFIGURATION | default "debug"}}
