version: '3'

tasks:
  fixture:local-url-naming:
    desc: Build/sign k161 local-only helper; execute only in the authorized disposable guest
    cmds:
      - bash scripts/build-local-url-name-probe.sh

  fixture:local-url-naming-vm:
    desc: One approved k161 eight-case collection; requires live terminal supervision, never repeat without new permission
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-local-url-name.py --output {{.OUTPUT | shellQuote}}

  fixture:local-url-naming-check:
    desc: Check k161 instrumentation and local input/disposal guards without allocating a guest
    cmds:
      - ruff check --select E,F,I --line-length 100 scripts/vm-probe-local-url-name.py docs/verification/local-url-naming/test_supervisor.py
      - python3 -m py_compile scripts/vm-probe-local-url-name.py
      - shellcheck -x scripts/build-local-url-name-probe.sh
      - shfmt -d -i 2 -ci scripts/build-local-url-name-probe.sh
      - pytest -q docs/verification/local-url-naming/test_supervisor.py

  fixture:separated-local-url-naming:
    desc: Build/sign k164 separated-control local-only helper; execute only in the authorized disposable guest
    cmds:
      - bash scripts/build-separated-local-url-name-probe.sh

  fixture:separated-local-url-naming-vm:
    desc: One authorized k164 separated eight-case collection; requires live terminal supervision, never repeat without new permission
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-separated-local-url-name.py --output {{.OUTPUT | shellQuote}}

  fixture:separated-local-url-naming-check:
    desc: Check k164 instrumentation and local input/disposal guards without allocating a guest
    cmds:
      - ruff check --select E,F,I --line-length 100 scripts/vm-probe-separated-local-url-name.py docs/verification/separated-local-url-naming/test_supervisor.py
      - python3 -m py_compile scripts/vm-probe-separated-local-url-name.py
      - shellcheck -x scripts/build-separated-local-url-name-probe.sh
      - shfmt -d -i 2 -ci scripts/build-separated-local-url-name-probe.sh
      - pytest -q docs/verification/separated-local-url-naming/test_supervisor.py

  fixture:search-evidence:
    desc: Build signed Koine with diagnostic workspace startup instrumentation; run only in an isolated VM
    deps: [app]
    cmds:
      - bash scripts/build-search-evidence.sh

  fixture:search-evidence-vm:
    desc: Measure discovery and its permission/index limits in a prepared disposable VM; exit zero is not acceptance
    requires:
      vars: [VM, OUTPUT]
    cmds:
      - python3 scripts/vm-probe-search.py --vm {{.VM | shellQuote}} --output {{.OUTPUT | shellQuote}}

  fixture:protected-path-metadata:
    desc: Build and sign the disposable path-metadata probe (launch only in an isolated TestAnyware VM)
    cmds:
      - scripts/build-protected-path-probe.sh

  fixture:protected-path-metadata-vm:
    desc: Measure individual path calls in an already prepared disposable VM; exit 0 is not a prompt-free verdict
    requires:
      vars: [VM, OUTPUT]
    cmds:
      - python3 scripts/vm-probe-protected-path.py --vm {{.VM | shellQuote}} --output {{.OUTPUT | shellQuote}}

  fixture:descriptor-walk-prompt:
    desc: Build and sign the disposable k174 descriptor-walk prompt probe (launch only in an isolated TestAnyware VM)
    cmds:
      - bash scripts/build-descriptor-walk-probe.sh

  fixture:descriptor-walk-prompt-vm:
    desc: Measure the walk's calls on first-use Desktop, Documents and Downloads in a prepared disposable VM; exit 0 is not a prompt-free verdict
    requires:
      vars: [VM, OUTPUT]
    cmds:
      - python3 scripts/vm-probe-descriptor-walk.py --vm {{.VM | shellQuote}} --output {{.OUTPUT | shellQuote}}

  fixture:descriptor-walk-prompt-check:
    desc: Check the k174 probe driver and build script without allocating a guest
    cmds:
      - ruff check --select E,F,I --line-length 100 scripts/vm-probe-descriptor-walk.py
      - python3 -m py_compile scripts/vm-probe-descriptor-walk.py
      - shellcheck -x scripts/build-descriptor-walk-probe.sh
      - shfmt -d -i 2 -ci scripts/build-descriptor-walk-probe.sh

  check:location-walk:
    desc: Build the signed providers and verify location resolution, target planners and linear-cost regressions
    cmds:
      - swift build --build-tests
      - task: bundled-providers
      - swift test --skip-build --filter 'LocationWalkTests|RevealLocationTests|OpenLocationTests|WorkspaceLongLocationTests'

  check:location-walk-mutations:
    desc: Show the location-walk, planner and signed-bundle tests go red against one deliberately broken decision of the walk at a time, in a copy of the tree under .build/location-walk-mutations (first run builds the copy; later runs are incremental)
    cmds:
      - python3 scripts/check-location-walk-mutations.py {{.CLI_ARGS}}

  fixture:long-action-route:
    desc: Build and sign the disposable long-location prototype bundles (k134; launch only in an isolated TestAnyware VM)
    cmds:
      - scripts/build-long-action-probe.sh

  fixture:long-action-route-vm:
    desc: Run the long-location prototype phases in an already prepared clone of the launchers image; exit 0 means phases finished, never that a route passed
    requires:
      vars: [VM, OUTPUT]
    cmds:
      - python3 scripts/vm-probe-long-action.py --vm {{.VM | shellQuote}} --output {{.OUTPUT | shellQuote}} install fixtures acquire register thresholds submit_docs launch reveal prompts

  fixture:native-reference-acquisition:
    desc: Build and sign the disposable native-reference acquisition helper (k143; launch only in an isolated TestAnyware VM)
    cmds:
      - scripts/build-native-reference-probe.sh

  fixture:native-reference-acquisition-vm:
    desc: Run the k143 diagnostic in a fresh clone; OUTPUT is a new directory; exit 0 means the run finished, never that a route passed
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-native-reference.py --output {{.OUTPUT | shellQuote}}

  fixture:item-array-submission:
    desc: Build and sign the disposable item-array helper and short recording app (k146; launch only in an isolated TestAnyware VM)
    cmds:
      - scripts/build-item-array-probe.sh

  fixture:item-array-submission-vm:
    desc: Run the k146 diagnostic in a fresh clone; OUTPUT is a new directory; exit 0 means the run finished, never that delivery passed
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-item-array.py --output {{.OUTPUT | shellQuote}}

  fixture:file-reference-url-acquisition:
    desc: Build and sign the k149 throwaway URL helper; execute only in the authorized isolated VM
    cmds:
      - scripts/build-file-reference-url-probe.sh

  fixture:file-reference-url-acquisition-vm:
    desc: Run the fixed k149 eight-case diagnostic in one fresh clone; completion is not route acceptance
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-file-reference-url.py --output {{.OUTPUT | shellQuote}}

  fixture:same-object-namespace:
    desc: Build/sign the authorized k152 throwaway helper; execute only in its disposable guest
    cmds:
      - scripts/build-same-object-probe.sh

  fixture:same-object-namespace-vm:
    desc: Run the one k152 collection; incomplete outcomes are evidence, never route acceptance
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-same-object.py --output {{.OUTPUT | shellQuote}}

  fixture:focused-zed-receiver:
    desc: Build/sign k155 throwaway helper; its finite authorization is not repeat permission
    cmds:
      - bash scripts/build-focused-zed-probe.sh

  fixture:focused-zed-receiver-vm:
    desc: One supervised k155 two-request collection; never rerun after its allowance is spent
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-focused-zed.py --output {{.OUTPUT | shellQuote}}

  fixture:bookmark-name-resolution:
    desc: Build/sign k158 throwaway Foundation helper; execute only in its authorized disposable guest
    cmds:
      - bash scripts/build-bookmark-name-probe.sh

  fixture:bookmark-name-resolution-vm:
    desc: One supervised k158 four-case collection; finite authorization is not repeat permission
    requires:
      vars: [OUTPUT]
    cmds:
      - python3 scripts/vm-probe-bookmark-name.py --output {{.OUTPUT | shellQuote}}

  fixture:private-ax:
    desc: Build and sign the private AX PID-recycling diagnostic (execute only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/private-ax/K56PrivateBinding.app/Contents/MacOS
      - sed 's/K54Binding/K56PrivateBinding/g; s/k54-binding/k56-private-binding/g' docs/verification/retained-ax-binding/Info.plist > .build/private-ax/K56PrivateBinding.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/private-probe.m -framework Cocoa -framework ApplicationServices -o .build/private-ax/K56PrivateBinding.app/Contents/MacOS/K56PrivateBinding
      - >-
        codesign --force --options runtime --timestamp --sign 'Developer ID Application: Antony Blakey (TA43A4RUP3)' .build/private-ax/K56PrivateBinding.app
      - codesign --verify --strict --verbose=2 .build/private-ax/K56PrivateBinding.app
      - /usr/bin/ditto -c -k .build/private-ax .build/private-ax.zip

  fixture:retained-ax:
    desc: Build the retained-AX PID-recycling diagnostic without launching it (run only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/retained-ax/K54Binding.app/Contents/MacOS
      - cp docs/verification/retained-ax-binding/Info.plist .build/retained-ax/K54Binding.app/Contents/Info.plist
      - xcrun clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=26.0 docs/verification/retained-ax-binding/probe.m -framework Cocoa -framework ApplicationServices -o .build/retained-ax/K54Binding.app/Contents/MacOS/K54Binding
      - /usr/bin/ditto -c -k .build/retained-ax .build/retained-ax.zip

  fixture:receive-budget:
    desc: Build the bounded local receive diagnostic (run only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/native-observation
      - xcrun clang -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=26.0 docs/verification/native-observation/receive-budget.c -o .build/native-observation/receive-budget

  fixture:process-serial:
    desc: Build and package the diagnostic process-serial probes without launching them (run only in a TestAnyware VM)
    cmds:
      - mkdir -p .build/process-serial/K51AutoTerm.app/Contents/MacOS
      - cp docs/verification/process-serial-lifetime/Info.plist .build/process-serial/K51AutoTerm.app/Contents/Info.plist
      - xcrun clang -Wall -Wextra -Wno-deprecated-declarations docs/verification/process-serial-lifetime/lookup.c -framework ApplicationServices -lbsm -o .build/process-serial/koine-k51-psn-probe
      - xcrun clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations docs/verification/process-serial-lifetime/AutoTerm.m -framework Cocoa -framework ApplicationServices -framework IOKit -o .build/process-serial/K51AutoTerm.app/Contents/MacOS/K51AutoTerm
      - /usr/bin/ditto -c -k .build/process-serial .build/process-serial.zip

  default:
    desc: Build and test
    cmds:
      - task: build
      - task: test

  build:
    desc: Build all targets
    cmds:
      - swift build
      - scripts/stage-provider-framework.sh debug

  test:
    desc: Run the public-seam and native-seam suites over real loopback HTTP
    cmds:
      - swift build --build-tests
      - task: fixture:variants
      - task: fixture:selection
      - task: bundled-providers
      - task: fixture:receipt-identity-probe
      - swift test --skip-build

  fixture:
    desc: Stage KoineProviderAPI.framework, build the fixture provider against it outside the package, sign and approve it
    cmds:
      - |
        FRAMEWORK="$(scripts/stage-provider-framework.sh debug)"
        Fixtures/FixtureProvider/build.sh "$(dirname "${FRAMEWORK}")" "$(dirname "${FRAMEWORK}")/../FixtureProviders"

  fixture:variants:
    desc: Build, sign and approve the deliberately bad (and the few good) fixture bundles the native loader tests refuse or load
    deps: [fixture]
    cmds:
      - |
        PRODUCTS="$(swift build --show-bin-path)"
        Fixtures/FixtureProvider/build-variants.sh "${PRODUCTS}/PackageFrameworks" "${PRODUCTS}/FixtureProviders" "${PRODUCTS}/FixtureVariants"

  fixture:selection:
    desc: Build, sign and keep apart the bundles the first-party selection tests choose between (decision cases, and an independently compiled baseline and update for the one real load)
    deps: [fixture]
    cmds:
      - |
        PRODUCTS="$(swift build --show-bin-path)"
        Fixtures/FixtureProvider/build-selection.sh "${PRODUCTS}/PackageFrameworks" "${PRODUCTS}/FixtureSelection"

  bundled-providers:
    desc: Build the bundled providers (desktop, workspace) by their own build definitions against the staged framework into one root, as Contents/PlugIns holds them, then sign each and approve it as an installed provider for the loader tests
    cmds:
      - |
        FRAMEWORK="$(scripts/stage-provider-framework.sh debug)"
        ROOT="$(dirname "${FRAMEWORK}")/../BundledProviders"
        for provider in DesktopProvider WorkspaceProvider; do
          BUNDLE="$(Providers/${provider}/build.sh "$(dirname "${FRAMEWORK}")" "${ROOT}")"
          Fixtures/FixtureProvider/seal.sh "${BUNDLE}"
        done

  fixture:receipt-identity-probe:
    desc: Build the receipt-identity probe - the workspace provider's own Logic and Sources compiled as its build definition compiles them, with a small entry point, so `task test` can run the shipped adapter's two executable identities (the live process's and the retained object's) against the real kernel and a process the test starts, with no launch on the host
    cmds:
      - |
        FRAMEWORK="$(scripts/stage-provider-framework.sh debug)"
        Fixtures/ReceiptIdentityProbe/build.sh "$(dirname "${FRAMEWORK}")" "$(dirname "${FRAMEWORK}")/../ReceiptIdentityProbe"

  app:
    desc: Assemble and sign .build/app/Koine.app (Developer ID; KOINE_SIGNING_IDENTITY overrides)
    cmds:
      - scripts/build-app.sh

  app:notarize:
    desc: Submit the built bundle to Apple's notary service, wait, staple the ticket and zip the release artifact (KOINE_NOTARY_PROFILE names the stored credential; default koine-notary)
    cmds:
      - scripts/notarize-app.sh

  app:verify:
    desc: Verify the bundle's version, signature, hardened runtime, designated requirement and stapled notarization ticket, and that Gatekeeper accepts it as a notarized Developer ID build
    cmds:
      - scripts/verify-app.sh

  check:minimum-os:
    desc: Check that every place stating Koine's macOS floor - Package.swift, the desktop provider's manifest, the spec, the README and the assembled bundle's Info.plist and Mach-O minos - agrees with App/Info.plist's LSMinimumSystemVersion
    cmds:
      - scripts/check-minimum-os.sh

  check:provider-catalogue:
    desc: Compare the sealed provider catalogue (App/ProviderCatalogue.json) with the SIGNED packaged bundles it designates - each enabled entry's signing identifier read from the bundle's signature, its release and schema from its manifest, nothing else in Contents/PlugIns, no reserved-only claim - with a self-test that each mutation is seen to fail. Run `task app` first
    cmds:
      - scripts/check-provider-catalogue.py --self-test {{.CLI_ARGS}}

  check:docs:
    desc: Check every relative link and #anchor in the documentation outside .grove/ resolves (--unlinked lists evidence documents nothing living cites)
    cmds:
      - scripts/check-doc-links.py {{.CLI_ARGS}}

  design:workflow-render:
    desc: Render the workflow provider architecture views (D2 0.9.0 and PlantUML 1.2026.8)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/workflow-providers.d2 docs/design/architecture/workflow-providers.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/workflow-authority.d2 docs/design/architecture/workflow-authority.svg
      - plantuml -tsvg docs/design/architecture/workflow-targets.puml

  design:search-render:
    desc: Render the v1 ownership sketch and eight prior raw-search comparison views (D2 0.9.0; existing layouts; no native acceptance)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/search-discovery.d2 docs/design/architecture/search-discovery.svg
      - d2 --layout=elk --theme=0 --dark-theme=200 docs/design/architecture/search-preopen.d2 docs/design/architecture/search-preopen.svg
      - d2 --layout=elk --theme=0 --dark-theme=200 docs/design/architecture/search-canonical.d2 docs/design/architecture/search-canonical.svg
      - d2 --layout=elk --theme=0 --dark-theme=200 docs/design/architecture/search-resources.d2 docs/design/architecture/search-resources.svg
      - d2 --layout=elk --theme=0 --dark-theme=200 docs/design/architecture/search-inspection.d2 docs/design/architecture/search-inspection.svg
      - d2 --layout=elk --theme=0 --dark-theme=200 docs/design/architecture/search-serviceability.d2 docs/design/architecture/search-serviceability.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/search-traversal.d2 docs/design/architecture/search-traversal.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/search-coverage.d2 docs/design/architecture/search-coverage.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/search-handoff.d2 docs/design/architecture/search-handoff.svg

  design:native-discovery-render:
    desc: Render native sources, authority/ownership, settings effects and true-retirement contract (D2 0.9.0; native acceptance pending)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/native-discovery-sources.d2 docs/design/architecture/native-discovery-sources.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/native-application-population.d2 docs/design/architecture/native-application-population.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/native-long-applications.d2 docs/design/architecture/native-long-applications.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/native-settings-decision.d2 docs/design/architecture/native-settings-decision.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/native-discovery-contract.d2 docs/design/architecture/native-discovery-contract.svg
      - d2 --layout=elk --theme=0 --dark-theme=200 docs/design/architecture/native-settings-flow.d2 docs/design/architecture/native-settings-flow.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/native-settings-readiness.d2 docs/design/architecture/native-settings-readiness.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/architecture/native-discovery-lifecycle.d2 docs/design/architecture/native-discovery-lifecycle.svg

  design:search-compose:
    desc: Generate the complete native discovery design SDL from the retained repair host schema plus the native extension; no runtime/native acceptance
    dir: clients/contract-only
    cmds:
      - npm ci --ignore-scripts --no-audit --no-fund
      - |
        node --input-type=module <<'JS'
        import { readFileSync, writeFileSync } from 'node:fs';
        import { buildSchema, extendSchema, parse, printSchema } from 'graphql';
        const root = '../../docs/design/';
        const complete = extendSchema(buildSchema(readFileSync(root + 'desktop-workspace-repair-schema-extension-host.graphql', 'utf8')),
          parse(readFileSync(root + 'workspace-search-schema.graphql', 'utf8')));
        writeFileSync(root + 'desktop-workspace-native-schema-extension-host.graphql', printSchema(complete) + '\n');
        console.log('Composed native design SDL; no served-schema or binary claim.');
        JS

  design:search-check:
    desc: Validate native discovery SDL/examples, complete composition/profiles and retained action examples; meaningful schema controls, no runtime/native acceptance
    dir: clients/contract-only
    cmds:
      - npm ci --ignore-scripts --no-audit --no-fund
      - |
        node --input-type=module <<'JS'
        import { readFileSync } from 'node:fs';
        import { buildSchema, extendSchema, getNamedType, isObjectType, parse, printSchema, validate, validateSchema } from 'graphql';
        const read = name => readFileSync(`../../docs/design/${name}`, 'utf8');
        const native = parse(read('workspace-search-schema.graphql'));
        const independent = extendSchema(buildSchema('type Query { placeholder: Boolean } type Mutation { placeholder: Boolean }'), native);
        const actions = buildSchema(read('desktop-workspace-repair-schema-extension-host.graphql'));
        const complete = extendSchema(actions, native);
        const examples = parse(read('workspace-search-operations.graphql'));
        const population = JSON.parse(read('application-population.json'));
        const verifyPopulation = subject => {
          const l = subject.limits, r = subject.recipe, s = subject.shallowCertificate, p = subject.populousVM;
          for (const values of [l, s]) for (const value of Object.values(values)) {
            if (!Number.isSafeInteger(value) || value <= 0) throw new Error('Invalid population certificate integer');
          }
          if (l.identifierGroups < l.distinctSpellings + 2 || l.retainedChoices < l.distinctSpellings ||
            l.indexedTypeValues !== 8 * l.rawURLObservations || r.attemptsPerURLObservation !== 16 ||
            r.metadataAttemptsPerSpelling !== 10 || s.indexedFactRecordBytes !== 64 || s.ownedIndexedPayloadCopies !== 2 ||
            r.walksPerSpelling !== 2 || r.recursiveIdentifierExpansion !== false ||
            r.providerFiltersAgentsOrHelpers !== false || r.overflowPublication !== 'FAILED_NULL_ITEMS') {
            throw new Error('Population admission, identifier coverage or shared-work contract changed');
          }
          if (r.diagnosticOverflowPublication !== 'CONTINUE_WITH_BOUNDED_GUIDANCE' ||
            r.coverageIndependentOfDiagnosticDetails !== true || r.publishSaturationReasonSummary !== true ||
            r.saturationSummaryRendering !== 'ONCE_AT_FREEZE' ||
            l.diagnostics !== 64 || s.coverageSummaryBytes !== 128) {
            throw new Error('Diagnostic saturation must preserve independently classified population outcomes');
          }
          const calls = r.fixedAttempts + r.attemptsPerURLObservation * l.rawURLObservations +
            r.attemptsPerRunningObject * l.runningObjects + r.attemptsPerIdentifier * l.identifierGroups +
            r.metadataAttemptsPerSpelling * l.distinctSpellings + r.walksPerSpelling * l.distinctSpellings *
            (r.attemptsPerWalkVisit * s.componentVisitsPerWalk + r.fixedAttemptsPerWalk);
          const copies = (s.spellingRecordBytes + s.choiceRecordBytes + s.indexedFactRecordBytes) * l.distinctSpellings +
            s.observationRecordBytes * l.rawURLObservations + s.identifierRecordBytes * l.identifierGroups +
            s.runningRecordBytes * l.runningObjects + s.ownedPathCopies * l.distinctSpellings * s.pathBytes +
            s.ownedNameIdentifierCopies * l.distinctSpellings * (s.nameBytes + s.identifierBytes) +
            s.ownedIndexedPayloadCopies * l.distinctSpellings * (s.nameBytes + s.identifierBytes) +
            l.diagnostics * s.diagnosticRecordAndPayloadBytes + s.coverageSummaryBytes + s.walkScratchBytes;
          const wire = l.retainedChoices * (s.wireEscapingMultiplier *
            (s.pathBytes + s.nameBytes + s.identifierBytes) + s.wireChoiceFixedBytes) +
            l.diagnostics * s.wireDiagnosticBytes + s.wireRootAndCoverageBytes;
          if (calls > l.nativeAttempts || copies > l.ownedCopyBytes || wire > l.responseBytes ||
            l.ownedCopyBytes !== 8388608 || l.responseBytes !== 8388608) {
            throw new Error('Population certificate exceeds its owned/host gates');
          }
          if (p.usefulDistinctIdentifiers <= 256 || p.controlledAdditionalUsefulApps +
            p.configuredAndSystemWitnessesIncluded !== p.usefulDistinctIdentifiers ||
            p.usefulDistinctIdentifiers + p.controlledAgentBackgroundHelperCopies + p.controlledAliasSpellings +
            p.baselineDistinctSpellingAllowance > l.distinctSpellings ||
            !p.requireActualAllUsefulChoices || !p.requireIndependentManifestAndObservers || p.nativeVerdict !== 'PENDING') {
            throw new Error('Populous subject lost its useful/baseline/independent pending obligation');
          }
          return { calls, copies, wire };
        };
        const certificate = verifyPopulation(population);
        for (const [label, mutate] of [
          ['old 256-ID quota', p => { p.limits.identifierGroups = 256; }],
          ['old 16384-call ceiling', p => { p.limits.nativeAttempts = 16384; }],
          ['native-order partial prefix', p => { p.recipe.overflowPublication = 'PARTIAL_PREFIX'; }],
          ['catalogue discarded on diagnostic saturation', p => { p.recipe.diagnosticOverflowPublication = 'FAILED_NULL_ITEMS'; }],
          ['status inferred from truncated detail records', p => { p.recipe.coverageIndependentOfDiagnosticDetails = false; }],
          ['failure reason hidden after saturation', p => { p.recipe.publishSaturationReasonSummary = false; }],
          ['repeated unbudgeted summary copies', p => { p.recipe.saturationSummaryRendering = 'PER_OBSERVATION'; }],
          ['omitted fixed coverage summary charge', p => { p.shallowCertificate.coverageSummaryBytes = 0; }],
          ['per-choice registration re-walk', p => { p.recipe.walksPerSpelling = p.limits.retainedChoices; }],
          ['omitted indexed projection calls', p => { p.recipe.attemptsPerURLObservation = 2; }],
          ['omitted indexed payload charges', p => { p.shallowCertificate.ownedIndexedPayloadCopies = 0; }],
          ['broken owned-copy certificate', p => { p.shallowCertificate.walkScratchBytes = p.limits.ownedCopyBytes; }],
          ['broken response certificate', p => { p.shallowCertificate.pathBytes = 8192; }],
          ['agent/helper suppression', p => { p.recipe.providerFiltersAgentsOrHelpers = true; }],
          ['sparse native subject', p => { p.populousVM.usefulDistinctIdentifiers = 14; }],
        ]) {
          const broken = structuredClone(population); mutate(broken);
          let rejected = false;
          try { verifyPopulation(broken); } catch { rejected = true; }
          if (!rejected) throw new Error(`Control did not reject ${label}`);
        }
        console.log('Application design certificates and deliberate broken controls:', certificate, '; native qualification PENDING.');
        const reasonNames = complete.getType('WorkspaceDiscoveryReason').getValues().map(value => value.name);
        const saturationGuidance = 'Additional details omitted. ' + ['INDEXED_APPS', 'RUNNING_APPS', 'REGISTRATION']
          .map(source => `${source}:${reasonNames.join(',')}`).join(';');
        const checkGuidance = capacity => {
          if (Buffer.byteLength(saturationGuidance) > capacity) throw new Error('Saturation reason projection exceeds guidance capacity');
        };
        checkGuidance(1024);
        let smallGuidanceRefused = false;
        try { checkGuidance(Buffer.byteLength(saturationGuidance) - 1); } catch { smallGuidanceRefused = true; }
        if (!smallGuidanceRefused) throw new Error('Control accepted undersized reason-summary guidance');
        console.log('All source/reason tokens remain visible after saturation; maximum guidance bytes:', Buffer.byteLength(saturationGuidance));
        const errors = [...validateSchema(independent), ...validateSchema(complete),
          ...validate(independent, examples), ...validate(complete, examples),
          ...validate(complete, parse(read('workspace-operations.graphql')))];
        if (errors.length) throw new Error(errors.map(error => error.message).join('\n'));
        const missingFacts = buildSchema(printSchema(complete).replace('uiElement: Boolean', 'removedUIFact: Boolean'));
        if (!validate(missingFacts, examples).some(error => error.message.includes('uiElement'))) {
          throw new Error('Control did not reject missing application presentation fact');
        }
        const missingProvenance = buildSchema(printSchema(complete).replace('metadataSource: WorkspaceApplicationMetadataSource!', 'removedMetadataSource: WorkspaceApplicationMetadataSource!'));
        if (!validate(missingProvenance, examples).some(error => error.message.includes('metadataSource'))) {
          throw new Error('Control did not reject missing indexed metadata provenance');
        }
        if (read('desktop-workspace-native-schema-extension-host.graphql') !== printSchema(complete) + '\n') {
          throw new Error('Complete native SDL is stale; run task design:search-compose before freezing checks');
        }
        const removed = { ...native, definitions: native.definitions.map(definition =>
          definition.kind === 'ObjectTypeExtension' ? { ...definition,
            fields: definition.fields.filter(field => field.name.value !== 'workspaceApplications') } : definition) };
        if (!validate(extendSchema(actions, removed), examples).some(error => error.message.includes('workspaceApplications'))) {
          throw new Error('Control did not reject removed application catalogue');
        }
        const invalid = parse('query { workspaceSpecialLocations(requests: "wrong") { impossibleField } }');
        if (validate(complete, invalid).length < 2) throw new Error('Controls did not reject wrong input and unknown output');
        let refused = false;
        try { extendSchema(independent, parse('extend type Query { workspaceWrong: DesktopApplication }')); }
        catch (error) { refused = error.message.includes('DesktopApplication'); }
        if (!refused) throw new Error('Control did not reject foreign provider type');
        for (const name of ['WorkspaceSpecialLocationsResult', 'WorkspaceApplicationsResult', 'WorkspaceSettingsResult']) {
          if (String(complete.getType(name).getFields().items.type).endsWith('!')) throw new Error('Diagnostic items must be nullable');
        }
        const authorityGroups = [
          [complete.getQueryType(), ['workspaceSpecialLocations', 'workspaceApplications', 'workspaceSettings']],
          [complete.getMutationType(), ['workspacePrepareSettings']],
          [complete.getMutationType(), ['workspaceRevealSetting', 'workspaceLaunchApplication', 'workspaceOpenURL', 'workspaceOpenPath', 'workspaceRevealPath']],
        ];
        const objectNames = (schema, root, names) => {
          const seen = new Set();
          const pending = names.map(name => getNamedType(root.getFields()[name].type));
          while (pending.length) {
            const type = pending.pop();
            if (!isObjectType(type) || seen.has(type.name)) continue;
            seen.add(type.name);
            pending.push(...Object.values(type.getFields()).map(field => getNamedType(field.type)));
          }
          return seen;
        };
        const assertAuthorityObjects = schema => {
          const groups = authorityGroups.map(([root, names]) => objectNames(schema,
            root.name === 'Query' ? schema.getQueryType() : schema.getMutationType(), names));
          for (let i = 0; i < groups.length; i++) for (let j = i + 1; j < groups.length; j++) {
            for (const name of groups[i]) if (groups[j].has(name)) throw new Error(`Authority groups share object ${name}`);
          }
        };
        assertAuthorityObjects(complete);
        const sharedProcess = buildSchema(printSchema(complete).replace(
          'process: WorkspaceSettingsRevealProcess', 'process: WorkspaceSettingsPreparationProcess'));
        let authorityRefused = false;
        try { assertAuthorityObjects(sharedProcess); } catch (error) { authorityRefused = error.message.includes('WorkspaceSettingsPreparationProcess'); }
        if (!authorityRefused) throw new Error('Control did not reject shared objects across authority sets');
        if (complete.getType('WorkspaceSettingsAutomationResult') || complete.getType('WorkspaceSettingsAutomationOutcome')) {
          throw new Error('Local consent outcomes leaked into the public schema');
        }
        const remoteSetup = parse('mutation { workspaceRequestSettingsAutomation(event: READ) { outcome requestMade } }');
        if (!validate(complete, remoteSetup).some(error => error.message.includes('workspaceRequestSettingsAutomation'))) {
          throw new Error('Control did not reject remote consent initiation');
        }
        const nativeFeatures = ['additional-capabilities-v1', 'first-party-selection-v1', 'workspace-native-disclosures-v1'];
        const sameFeatures = (actual, expected) => Array.isArray(actual) &&
          actual.length === expected.length && new Set(actual).size === expected.length &&
          expected.every(feature => actual.includes(feature));
        const assertNativeFeatures = profile => {
          if (!sameFeatures(profile.nativeRequiredFeatures, nativeFeatures) ||
            !sameFeatures(profile.hostFeatures, nativeFeatures)) throw new Error('Native disclosure feature gate missing');
        };
        for (const name of ['core-desktop-workspace-native-extension-host.json', 'core-desktop-workspace-native-update-extension-host.json']) {
          const profile = JSON.parse(read(`profiles/${name}`));
          assertNativeFeatures(profile);
          if (profile.design !== '../desktop-workspace-native-schema-extension-host.graphql') throw new Error('Wrong complete profile SDL');
          const selected = profile.providers.find(row => row.provider === 'workspace' && row.selection === 'SELECTED');
          if (selected.schemaVersion !== '1.1.0' || selected.version !== (name.includes('update') ? '1.3.0' : '1.2.0')) {
            throw new Error('Native profile reused an action-only identity');
          }
        }
        const refusal = JSON.parse(read('profiles/core-desktop-workspace-native-update-refused-extension-host.json'));
        const bad = refusal.providers.find(row => row.origin === 'PER_USER');
        const fallback = refusal.providers.find(row => row.provider === 'workspace' && row.selection === 'SELECTED');
        if (refusal.design !== '../desktop-workspace-repair-schema-extension-host.graphql' ||
          !sameFeatures(refusal.hostFeatures, nativeFeatures) ||
          !sameFeatures(refusal.nativeRequiredFeatures, nativeFeatures.filter(feature => feature !== 'first-party-selection-v1')) ||
          bad.version !== '1.3.0' || bad.schemaVersion !== '1.1.0' || bad.state !== 'INCOMPATIBLE' || bad.reason !== 'selection-feature-required' ||
          fallback.version !== '1.0.1' || fallback.schemaVersion !== '1.0.1' || fallback.reason !== 'selected-with-refusals') {
          throw new Error('Native refusal profile changed action-only fallback or refusal identity');
        }
        const priorHost = JSON.parse(read('profiles/core-desktop-workspace-native-disclosure-refused-extension-host.json'));
        const assertDisclosureRefusal = profile => {
          const bad = profile.providers.find(row => row.origin === 'PER_USER');
          const fallback = profile.providers.find(row => row.provider === 'workspace' && row.selection === 'SELECTED');
          if (!sameFeatures(profile.hostFeatures, nativeFeatures.slice(0, 2)) ||
            !sameFeatures(profile.nativeRequiredFeatures, nativeFeatures) ||
            profile.design !== '../desktop-workspace-repair-schema-extension-host.graphql' ||
            profile.management !== 'extended' || profile.providers.length !== 3 ||
            bad.version !== '1.3.0' || bad.schemaVersion !== '1.1.0' || bad.state !== 'INCOMPATIBLE' ||
            bad.selection !== 'NOT_SELECTED' || bad.reason !== 'unsupported-feature' ||
            fallback.version !== '1.0.1' || fallback.schemaVersion !== '1.0.1' || fallback.state !== 'ACTIVE' ||
            fallback.origin !== 'BUNDLED' || fallback.reason !== 'selected-with-refusals') {
            throw new Error('Prior-host disclosure refusal or action-only fallback changed');
          }
        };
        assertDisclosureRefusal(priorHost);
        const requireRejection = (subject, check, label) => {
          let rejected = false;
          try { check(subject); } catch { rejected = true; }
          if (!rejected) throw new Error(`Control did not reject ${label}`);
        };
        const missingDisclosure = JSON.parse(read('profiles/core-desktop-workspace-native-extension-host.json'));
        missingDisclosure.nativeRequiredFeatures = nativeFeatures.slice(0, 2);
        requireRejection(missingDisclosure, assertNativeFeatures, 'missing native disclosure requirement');
        const loadedOnPrior = structuredClone(priorHost);
        Object.assign(loadedOnPrior.providers.find(row => row.origin === 'PER_USER'),
          { state: 'ACTIVE', selection: 'SELECTED', reason: null });
        requireRejection(loadedOnPrior, assertDisclosureRefusal, 'native update active on prior disclosure host');
        console.log('Native SDL/examples/composition/four profiles and retained actions valid; removed-root, wrong-input/output, foreign-type, shared-authority, remote-consent, missing-disclosure-feature and prior-host-load controls rejected. Runtime/native G/N/V remains pending.');
        JS

  design:long-applications-check:
    desc: Check long indexed metadata declarations and constructive finite fixture lengths with failing controls; no native source/action pass
    cmds:
      - |
        node --input-type=module <<'JS'
        import { strict as assert } from 'node:assert';
        import { readFileSync } from 'node:fs';
        const subject = JSON.parse(readFileSync('docs/design/long-application-metadata.json', 'utf8'));
        const population = JSON.parse(readFileSync('docs/design/application-population.json', 'utf8'));
        const verify = value => {
          const { source: s, limits: l, qualification: q } = value;
          assert.equal(s.queryScope, 'NSMetadataQueryIndexedLocalComputerScope');
          assert.equal(s.predicate, 'kMDItemContentTypeTree = com.apple.application-bundle');
          assert.deepEqual(s.attributes, ['kMDItemPath', 'kMDItemContentTypeTree', 'kMDItemCFBundleIdentifier', 'kMDItemDisplayName']);
          assert.equal(s.itemOrigin, 'ACTUAL_QUERY_RESULT');
          assert.equal(s.typeEvidence, 'EXACT_NATIVE_APPLICATION_BUNDLE_TREE_MEMBER');
          assert.equal(s.identity, 'BEFORE_AFTER_DIRECTORY_DEVICE_INODE');
          assert.equal(s.indexToInodeBinding, 'UNESTABLISHED');
          assert.equal(s.metadataSource, 'INDEXED_ITEM');
          assert.equal(s.installationState, 'UNKNOWN');
          assert.equal(s.bundleFlags, 'NULL');
          assert(!s.wholePathFallback && !s.crossCopyMetadata && !s.extraAccessOrConsent);
          assert.equal(l.handoffBytesIncludingNul, 1024);
          assert.equal(l.knownPlistSuffixBytes, Buffer.byteLength('/Contents/Info.plist'));
          assert.equal(s.ordinaryReaderBoundary, 'UNRESOLVED_LOCALIZED_RESOURCE_PATHS');
          assert.equal(q.ordinaryReaderControlEstablished, false);
          assert.equal(l.rawIndexedTypeValues, 8 * population.limits.rawURLObservations);
          assert.equal(l.rawIndexedTypeValues, population.limits.indexedTypeValues);
          assert.equal(q.name, 'L1500');
          assert.deepEqual(q.boundaryBundleBytes, [1003, 1004, 1023, 1024, 1500]);
          assert.equal(q.shortSameIdentifierCompetitors, 2);
          assert.equal(q.explicitShortParentReindexAttempts, 1);
          assert.deepEqual(q.indexObservationCheckpointsSeconds, [10, 30, 60]);
          assert(q.requireActualLongIndexedTuple && q.requireIndependentManifestAndObservers &&
            q.requireNameAndIdentifierForSubject && q.requireUnchangedSelectedLaunchAndNamedOpenRefusal);
          assert(!q.registeredLongPrecondition && !q.diskOrClientProvenancePasses);
          assert.equal(q.missingTupleOutcome, 'UNMET_NATIVE_SUPPORT');
          assert.equal(q.nativeVerdict, 'PENDING');
          const fixtures = q.boundaryBundleBytes.map(bytes => {
            const root = `${q.fixtureRoot}/b${bytes}`;
            let remaining = bytes - Buffer.byteLength(root) - 1 - Buffer.byteLength(q.leaf);
            const components = [];
            while (remaining > l.maximumFixtureComponentBytes + 1) {
              const n = remaining === l.maximumFixtureComponentBytes + 2 ? l.maximumFixtureComponentBytes - 1 : l.maximumFixtureComponentBytes;
              components.push('a'.repeat(n)); remaining -= n + 1;
            }
            assert(remaining >= 2);
            components.push('a'.repeat(remaining - 1));
            assert(components.every(part => part.length > 0 && part.length <= 200));
            const path = `${root}/${components.join('/')}/${q.leaf}`;
            assert.equal(Buffer.byteLength(path), bytes);
            const visits = path.split('/').filter(Boolean).length;
            assert(visits <= l.maximumFixtureComponentVisits);
            return { bytes, visits, knownPlistIndexedRequired: bytes + l.knownPlistSuffixBytes >= l.handoffBytesIncludingNul,
              handoffRefused: bytes >= l.handoffBytesIncludingNul };
          });
          return fixtures;
        };
        const controls = [
          ['source', 'attributes', ['kMDItemPath']], ['source', 'itemOrigin', 'CLIENT_FOUND_FILE'],
          ['source', 'typeEvidence', 'FILENAME_SUFFIX'], ['source', 'indexToInodeBinding', 'CURRENT_PLIST_PROVED'],
          ['source', 'installationState', 'INSTALLED'], ['source', 'bundleFlags', 'FALSE'],
          ['source', 'wholePathFallback', true], ['source', 'crossCopyMetadata', true],
          ['source', 'extraAccessOrConsent', true], ['limits', 'knownPlistSuffixBytes', 0],
          ['source', 'ordinaryReaderBoundary', 'KNOWN_PLIST_IS_SUFFICIENT'],
          ['qualification', 'ordinaryReaderControlEstablished', true],
          ['limits', 'rawIndexedTypeValues', 256], ['qualification', 'registeredLongPrecondition', true],
          ['qualification', 'requireActualLongIndexedTuple', false], ['qualification', 'diskOrClientProvenancePasses', true],
          ['qualification', 'missingTupleOutcome', 'PASS'], ['qualification', 'nativeVerdict', 'PASSED']
        ];
        for (const [group, field, bad] of controls) {
          const changed = structuredClone(subject); changed[group][field] = bad;
          assert.throws(() => verify(changed), `Control accepted ${group}.${field}`);
        }
        console.log(JSON.stringify(verify(subject)));
        console.log('Broken projection/identity/provenance/access/action/fixture declarations rejected; localized resource boundary UNRESOLVED, native G11/N8/V13 PENDING.');
        JS

  design:settings-check:
    desc: Check logical two-sweep Settings call/copy certificates and finite qualification declarations with broken controls; no native readiness/usefulness pass
    cmds:
      - |
        node --input-type=module <<'JS'
        import { strict as assert } from 'node:assert';
        import { readFileSync } from 'node:fs';
        const subject = JSON.parse(readFileSync('docs/design/settings-readiness.json', 'utf8'));
        const verify = value => {
          const { limits: l, recipe: r, contract: c, nativeQualification: q } = value;
          for (const n of [...Object.values(l), ...Object.values(r)]) assert(Number.isSafeInteger(n) && n > 0);
          assert.equal(l.sweeps, 2);
          assert(l.anchorsPerPane <= l.anchorsPerSweep && l.recordKeys <= 16);
          assert.equal(l.minimumGapMs, 100);
          assert.equal(l.jobWaitMs, 3000);
          assert(l.minimumGapMs < l.jobWaitMs);
          assert.equal(c.paneForm, 'ALL_PANE_PROPERTIES_PALL');
          assert.equal(c.anchorAssociation, 'CONTAINER_PANE_ID');
          assert.equal(c.comparison, 'FULL_ID_NAME_ANCHOR_MAP');
          assert.equal(c.lazyCompleteness, 'UNKNOWN');
          assert.equal(c.positiveStatus, 'PARTIAL');
          assert.equal(c.emptyPanes, 'UNKNOWN_NULL_ITEMS');
          assert.equal(c.emptyAnchors, 'NULL');
          assert.equal(c.overflow, 'FAILED_NULL_ITEMS');
          assert.equal(c.diagnosticOverflow, 'CONTINUE_WITH_BOUNDED_GUIDANCE');
          assert.equal(c.coverageIndependentOfDiagnosticDetails, true);
          assert.equal(c.publishSaturationReasonSummary, true);
          assert.equal(c.saturationSummaryRendering, 'ONCE_AT_FREEZE');
          assert.equal(c.incompleteFirstSweepDeadline, 'FAILED_NULL_ITEMS');
          assert.equal(c.confirmationDeadline, 'PARTIAL_UNCONTRADICTED_FIRST_MAP');
          assert.equal(c.lazyRevealNoSuchObject, 'FAILED_UNESTABLISHED_SELECTION');
          assert.equal(r.diagnosticBytes, 64 * 2048);
          assert.equal(r.coverageSummaryBytes, 4 * 32);
          assert.equal(c.readLoadsPane, false);
          assert.equal(c.automaticFallback, false);
          assert.equal(q.coldRepetitions, 3);
          assert.equal(q.maximumVisitPasses, 2);
          assert.deepEqual(q.postVisitCheckpointsSeconds, [1, 3, 10]);
          assert(q.coldBeforeAnyVisit && q.independentScalarInventory && q.requireEveryExposedChoiceColdAndWarm);
          assert(q.coldRevealInSeparateIncarnation && q.coldRevealSelectionFromPriorIncarnation);
          assert.equal(q.nativeVerdict, 'PENDING');
          const events = l.sweeps * (l.panesPerSweep + 1);
          const calls = r.fixedAttempts + r.attemptsPerEvent * events +
            r.attemptsPerPaneRecord * l.sweeps * l.panesPerSweep + r.attemptsPerAnchor * l.sweeps * l.anchorsPerSweep;
          const copies = l.sweeps * (l.panesPerSweep * (r.idBytes + r.labelBytes + r.paneRecordBytes) +
            l.anchorsPerSweep * (r.anchorBytes + r.anchorRecordBytes)) +
            l.sweeps * l.panesPerSweep * r.idBytes + r.diagnosticBytes + r.coverageSummaryBytes + r.scratchBytes;
          assert(calls <= l.nativeAttempts);
          assert(copies <= l.ownedCopyBytes);
          return { events, calls, copies };
        };
        const controls = [
          ['limits', 'nativeAttempts', 16384], ['limits', 'ownedCopyBytes', 6094975],
          ['limits', 'sweeps', 3], ['contract', 'comparison', 'ID_SET_ONLY'],
          ['contract', 'anchorAssociation', 'POSITIONAL_ZIP'], ['contract', 'lazyCompleteness', 'COMPLETE'],
          ['contract', 'emptyAnchors', 'EMPTY_LIST'], ['contract', 'overflow', 'PARTIAL_PREFIX'],
          ['contract', 'diagnosticOverflow', 'FAILED_NULL_ITEMS'],
          ['contract', 'coverageIndependentOfDiagnosticDetails', false], ['recipe', 'coverageSummaryBytes', 0],
          ['contract', 'publishSaturationReasonSummary', false],
          ['contract', 'saturationSummaryRendering', 'PER_OBSERVATION'],
          ['contract', 'incompleteFirstSweepDeadline', 'PARTIAL_PREFIX'],
          ['contract', 'confirmationDeadline', 'FAILED_NULL_ITEMS'],
          ['contract', 'lazyRevealNoSuchObject', 'SELECTION_UNAVAILABLE'],
          ['nativeQualification', 'coldRevealInSeparateIncarnation', false],
          ['nativeQualification', 'coldRevealSelectionFromPriorIncarnation', false],
          ['contract', 'readLoadsPane', true], ['nativeQualification', 'coldBeforeAnyVisit', false],
          ['nativeQualification', 'requireEveryExposedChoiceColdAndWarm', false]
        ];
        for (const [group, field, bad] of controls) {
          const changed = structuredClone(subject);
          changed[group][field] = bad;
          assert.throws(() => verify(changed), `Control accepted ${group}.${field}`);
        }
        console.log(JSON.stringify(verify(subject)));
        console.log('Broken Settings budget/association/health/empty/loading/cold-usefulness declarations rejected; design only, native G/N/V pending.');
        JS

