version: '3'

tasks:
  default:
    desc: Build and test
    cmds:
      - task: build
      - task: test

  build:
    desc: Build all targets
    cmds:
      - swift build

  test:
    desc: Run the public-seam suite over real loopback HTTP
    cmds:
      - swift test

  app:
    desc: Assemble and sign .build/app/Koine.app (Developer ID; KOINE_SIGNING_IDENTITY overrides)
    cmds:
      - scripts/build-app.sh

  app:verify:
    desc: Verify the bundle's signature, hardened runtime and designated requirement
    cmds:
      - scripts/verify-app.sh

  app:vm-verify:
    desc: Verify the signed bundle in a clean TestAnyware macOS VM (install, login launch, grant, revoke, quit)
    cmds:
      - scripts/vm-verify.sh
