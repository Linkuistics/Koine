"UTC instant with exactly six fractional second digits, captured from the process start time."
scalar DesktopProcessStart

input DesktopProcessIdentity {
  pid: Int!
  startedAt: DesktopProcessStart!
}

extend type Query {
  "desktop:read. An absent process is ordinary null."
  desktopApplication(process: DesktopProcessIdentity!): DesktopApplication
  "desktop:read. A stale or wrong-kind reference raises unavailable."
  desktopApplicationByReference(ref: Reference!): DesktopApplication
  "desktop:read. A stale or wrong-kind reference raises unavailable."
  desktopWindow(ref: Reference!): DesktopWindow
}

extend type Mutation {
  "desktop:control. Focuses exactly this window or reports why it did not; never a substitute."
  desktopFocusWindow(ref: Reference!): DesktopFocusReceipt
}

"All fields require desktop:read."
type DesktopApplication {
  ref: Reference!
  name: String!
  bundleIdentifier: String
  windows: [DesktopWindow!]!
}

"All fields require desktop:read."
type DesktopWindow {
  ref: Reference!
  title: String!
  observation: DesktopObservation!
}

"Control-authorized output; it does not expose read-protected window state."
type DesktopFocusReceipt {
  "The submitted target, under the mutation's control authority."
  ref: Reference!
}

enum DesktopObservation { CURRENT REMEMBERED }
