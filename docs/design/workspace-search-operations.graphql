# Designed examples, not served operations. Requires workspace:read only.
# Check status, coverage AND errors, particularly at aliased nullable matches.
# Discovery admission/traversal/application identity need repair and review.
# Typed BLOCKED awaits its separate review; all runtime acceptance pending.
# Result-count truncation and partial traversal are independent.

fragment SearchCoverage on WorkspaceSearchRootCoverage {
  rootIndex
  requestedPath
  resolvedPath
  state
  examinedEntries
  completedDirectories
  searched { path extent }
  skipped {
    path extent count reason affectsCoverage guidance
    permission {
      kind permissionClass permissionOwner permissionReason permissionTarget
      osPermission consentState
    }
  }
}

query FindInstalledApplications($query: String!, $roots: [String!], $limit: Int = 50) {
  apps: workspaceSearchApplications(query: $query, roots: $roots, limit: $limit) {
    status
    choices: matches { name applicationPath bundleIdentifier installationState rootIndices }
    coverage { ...SearchCoverage }
    dependency { reason guidance }
    resultsTruncated
  }
}

query FindFiles($query: String!, $roots: [String!], $limit: Int = 50) {
  files: workspaceSearchFiles(query: $query, roots: $roots, limit: $limit) {
    status
    choices: matches {
      name path kind contentType openDisposition rootIndices
      defaultHandlerState
      defaultApplication { bundleIdentifier applicationPath }
      defaultHandlerGuidance
    }
    coverage { ...SearchCoverage }
    dependency { reason guidance }
    resultsTruncated
  }
}

# BLOCKED is inspectable without matches and produces no search execution error.
# FAILED also has no matches error when that field is not selected.
query InspectSearchCoverage($roots: [String!]) {
  apps: workspaceSearchApplications(query: "", roots: $roots) {
    status coverage { ...SearchCoverage } dependency { reason guidance } resultsTruncated
  }
  files: workspaceSearchFiles(query: "", roots: $roots) {
    status coverage { ...SearchCoverage } dependency { reason guidance } resultsTruncated
  }
}

# Within each root, BLOCKED gives two null aliases and no search errors. FAILED
# gives failed at [apps, first]/[apps, second] or [files, first]/[files, second].
# Root aliases are independent snapshots; nested aliases reuse their frozen result.
# Publication capability errors can suppress any field, including coverage/status.
query InspectAliasedMatches($roots: [String!]) {
  apps: workspaceSearchApplications(query: "", roots: $roots) {
    status
    first: matches { name applicationPath }
    second: matches { name applicationPath }
    coverage { ...SearchCoverage }
    dependency { reason guidance }
    resultsTruncated
  }
  files: workspaceSearchFiles(query: "", roots: $roots) {
    status
    first: matches { name path }
    second: matches { name path }
    coverage { ...SearchCoverage }
    dependency { reason guidance }
    resultsTruncated
  }
}

# After the user chooses, copy the app's identifier AND installation path into
# WorkspaceApplicationInput, or the file path into the existing open/reveal
# operations in workspace-operations.graphql. Controls are separately required.
# Copy path/known identifier to the client's clipboard, and update client MRU
# there. Launch only INSTALLED, never UNREGISTERED or UNKNOWN; both can be
# revealed/path-copied, and any known identifier can be copied. Do not infer NO_DEFAULT_HANDLER from
# null metadata. Never retry an action by dropping its installation constraint.

# Searched SUBTREE requires COMPLETE; OBSERVED_DESCENDANTS only asserts counts.
# CHILD_GROUP/DESCENDANT_GROUP count observed anchors, not all children or
# omitted descendant names. FRONTIER_LIMIT/DEPTH_LIMIT anchor names can match;
# UNREPRESENTABLE_NAME/overlong-path VALUE_LIMIT anchors cannot be returned.
# REMAINDER describes unfinished work with or without progress, not the whole
# root, and has count null. Anchor: resolved root, else representable requested
# root. No-progress stops have UNKNOWN coverage and no searched record.
# DIAGNOSTIC_LIMIT is total diagnostic room (count/bytes identified by guidance);
# VALUE_LIMIT is an individual path bound. Inspect completedDirectories as EOF.
