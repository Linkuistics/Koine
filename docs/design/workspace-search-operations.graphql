# Native discovery proposals: introspect the actually served schema before use.
fragment DiscoveryCoverage on WorkspaceDiscoveryCoverage {
  source declaredDomain availability observations category examined
  diagnostics {
    source reason subject affectsCoverage guidance
    permission { permission target event consent }
  }
}
query NativeStartingLocations($requests: [WorkspaceLocationRequest!]) {
  locations: workspaceSpecialLocations(requests: $requests) {
    status
    items { kind domain accountIdentifier location contentsAvailability sources }
    sources { ...DiscoveryCoverage }
    resultsTruncated
  }
}
query NativeApplications {
  apps: workspaceApplications {
    status
    items { name applicationPath bundleIdentifier installationState sources }
    sources { ...DiscoveryCoverage }
    resultsTruncated
  }
}
query NativeSettings {
  settings: workspaceSettings {
    status
    items { paneId name availability anchors { name availability } sources }
    sources { ...DiscoveryCoverage }
    resultsTruncated
  }
}
# No items selection: FAILED can be inspected without generated items errors.
query InspectNativeSources {
  apps: workspaceApplications { status sources { ...DiscoveryCoverage } resultsTruncated }
  settings: workspaceSettings { status sources { ...DiscoveryCoverage } resultsTruncated }
}
# Nested aliases read ONE frozen root result. Root aliases own separate observations.
# Absent independent execution errors: FAILED => failed at [apps, first] and
# [apps, second]; BLOCKED/UNAVAILABLE/UNKNOWN => ordinary null at both, no
# generated error. Publication/lifecycle errors can suppress any selected field.
query InspectAliasedNativeItems {
  apps: workspaceApplications {
    status
    first: items { applicationPath installationState }
    second: items { applicationPath installationState }
    sources { ...DiscoveryCoverage }
  }
  settings: workspaceSettings {
    status
    first: items { paneId anchors { name } }
    second: items { paneId anchors { name } }
    sources { ...DiscoveryCoverage }
  }
}
# Explicit client choice, workspace:control only; no pane data or read grant.
mutation PrepareSettingsInBackground {
  workspacePrepareSettings {
    status
    receipt { launchRequested readiness process { pid startedAt } }
    dependency { reason guidance }
    diagnostics { source reason guidance }
  }
}
# Use only if the client explicitly chooses setup; no read/action automatically calls it.
mutation RequestSettingsAutomation($event: WorkspaceSettingsEvent!) {
  workspaceRequestSettingsAutomation(event: $event) { event outcome requestMade guidance }
}
# Explicit selected pane or anchor; both controls, no implicit read grant.
mutation RevealChosenSetting($selection: WorkspaceSettingSelection!) {
  workspaceRevealSetting(selection: $selection) {
    status
    receipt { paneId anchorName revealAcknowledged activationRequested process { pid startedAt } }
    dependency { reason guidance }
    diagnostics { source reason guidance permission { permission target event consent } }
  }
}
# Filter/rank on the client. An INSTALLED app's selected identifier AND location
# feed the existing workspaceLaunchApplication, under both controls. UNKNOWN/
# UNREGISTERED identified apps stay reveal/copy choices. Reads never register apps.
# Keep locations lossless: the existing 1024-byte handoff refusal still applies.
# Settings keys are opaque exact selectors, never custom URLs or script text.
# All Query roots and reachable fields require workspace:read, independently of controls.
