l="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.775" y1="200" x2="640.792" y2="200" style="stroke:#181818;stroke-width:1;"/><text x="382.775" y="194.09" fill="#000" font-size="17" textLength="115.29" font-family="Helvetica">admitted action</text><polygon points="988.607,244,998.607,248,988.607,252,992.607,248" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="646.792" y1="248" x2="994.607" y2="248" style="stroke:#181818;stroke-width:1;"/><text x="653.792" y="225.09" fill="#000" font-size="17" textLength="273.121" font-family="Helvetica">resolve installed app / path / handler</text><text x="653.792" y="242.09" fill="#000" font-size="17" textLength="219.257" font-family="Helvetica">no launch or consent request</text><path d="M13,260 L77.839,260 L77.839,269 L67.839,279 L13,279 L13,260" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="13" y="260" width="1028.607" height="349" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="28" y="274.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="92.839" y="275.09" fill="#000" font-size="17" textLength="333.459" font-weight="700" font-family="Helvetica">[missing prerequisite before submission]</text><polygon points="59,327,49,331,59,335,55,331" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="331" x2="645.792" y2="331" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="308.09" fill="#000" font-size="17" textLength="243.752" font-family="Helvetica">DEPENDENCY_UNAVAILABLE</text><text x="65" y="325.09" fill="#000" font-size="17" textLength="214.077" font-family="Helvetica">reason + guidance; no value</text><line x1="13" y1="340" x2="1041.607" y2="340" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="355.09" fill="#000" font-size="17" textLength="56.686" font-weight="700" font-family="Helvetica">[ready]</text><polygon points="988.607,398,998.607,402,988.607,406,992.607,402" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="646.792" y1="402" x2="994.607" y2="402" style="stroke:#181818;stroke-width:1;"/><text x="653.792" y="379.09" fill="#000" font-size="17" textLength="290.121" font-family="Helvetica">submit launch/open; request activation</text><text x="653.792" y="396.09" fill="#000" font-size="17" textLength="329.815" font-family="Helvetica">reuse running copy unless path-constrained</text><path d="M32,414 L96.839,414 L96.839,423 L86.839,433 L32,433 L32,414" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="414" width="984.607" height="181" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="428.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="111.839" y="429.09" fill="#000" font-size="17" textLength="351.347" font-weight="700" font-family="Helvetica">[native acknowledgment within wait bound]</text><polygon points="657.792,464,647.792,468,657.792,472,653.792,468" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="651.792" y1="468" x2="999.607" y2="468" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="663.792" y="462.09" fill="#000" font-size="17" textLength="155" font-family="Helvetica">accepted application</text><polygon points="59,512,49,516,59,520,55,516" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="516" x2="645.792" y2="516" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="493.09" fill="#000" font-size="17" textLength="162.064" font-family="Helvetica">AVAILABLE + receipt</text><text x="65" y="510.09" fill="#000" font-size="17" textLength="301.435" font-family="Helvetica">optional observed PID / kernel start only</text><line x1="32" y1="525" x2="1016.607" y2="525" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="37" y="540.09" fill="#000" font-size="17" textLength="355.24" font-weight="700" font-family="Helvetica">[native error, 3 s wait expiry or cancellation]</text><polygon points="59,583,49,587,59,591,55,587" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="587" x2="645.792" y2="587" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="564.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">failed; effect may have begun</text><text x="65" y="581.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">no replay or alternate handler</text><path d="M32,627 L103.43,627 L103.43,636 L93.43,646 L32,646 L32,627" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="627" width="542.67" height="93" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="641.09" fill="#000" font-size="17" textLength="26.43" font-weight="700" font-family="Helvetica">opt</text><text x="118.43" y="642.09" fill="#000" font-size="17" textLength="440.24" font-weight="700" font-family="Helvetica">[receipt includes process and client has desktop:read]</text><polygon points="363.775,677,373.775,681,363.775,685,367.775,681" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="681" x2="369.775" y2="681" style="stroke:#181818;stroke-width:1;"/><text x="55" y="675.09" fill="#000" font-size="17" textLength="303.775" font-family="Helvetica">desktopApplication(process: PID + start)</text><polygon points="59,708,49,712,59,716,55,712" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="712" x2="374.775" y2="712" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="706.09" fill="#000" font-size="17" textLength="291.034" font-family="Helvetica">desktop state / absent / classified error</text><path d="M10.332,739 L10.332,868 L1037.332,868 L1037.332,749 L1027.332,739 L10.332,739" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1027.332,739 L1027.332,749 L1037.332,749 L1027.332,739" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="276.948" y="757.09" fill="#000" font-size="17" textLength="392.154" font-family="Helvetica">Installed identity is not a held process or file identity.</text><text x="276.948" y="774.09" fill="#000" font-size="17" textLength="485.712" font-family="Helvetica">Window behavior belongs to the app; later exit remains possible.</text><text x="276.948" y="791.09" fill="#000" font-size="17" textLength="459.291" font-family="Helvetica">Acknowledgment alone does not pass activation acceptance.</text><text x="276.948" y="808.09" fill="#000" font-size="17" textLength="482.848" font-family="Helvetica">Core request deadline may answer first; late results are ignored.</text><text x="276.948" y="825.09" fill="#000" font-size="17" textLength="442.232" font-family="Helvetica">Publication errors can suppress the selected result branch.</text><text x="276.948" y="842.09" fill="#000" font-size="17" textLength="455.472" font-family="Helvetica">Reveal is a separate operation with Finder acknowledgment.</text><text x="276.948" y="859.09" fill="#000" font-size="17" textLength="368.505" font-family="Helvetica">Neither control grant implies read or OS consent.</text><?plantuml-src XPN1QYD748RlynJ5xcN3sZ8XXmGP0efiiGP7CRjibe1XgPcfqJHgTK-wUwJLdl8GUS8yIVxg6Osba923iQMkhlxhgx_ASMjSnu5tL7ArtGJVkthfhG_qUlN3Qh5Q5d6AgANXtgQLTsdDEw5tOlUIJCN_7lF1V1NwzlkpmzXoxG_6RQXX6wLeJItKU9zA_wL89bcXJpviOyULaENULUsDxyJHNt_yYSpHR9pKLyHL9LrYXo0SriXN83-4c8vTegKrujB5Lwz-vgerJgZoGLuHHrhYZukGwU7BYpkkVlb0DyHTb--jEPcz5CCRTFrZJZGVnMeKOhFaWvJqyVtZwMF7gIqqzkLE5wInPjCcahs48mM0G6t9UFViB5uXhdScHdoUK-bJ2_Kk1