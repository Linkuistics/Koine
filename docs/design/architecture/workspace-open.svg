26.269" y="65.09" fill="#000" font-size="17" textLength="43.463" font-family="Helvetica">Client</text><rect x="317.75" y="45" width="116.05" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="324.75" y="65.09" fill="#000" font-size="17" textLength="102.05" font-family="Helvetica">Machine core</text><rect x="773.488" y="45" width="99.025" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="780.488" y="65.09" fill="#000" font-size="17" textLength="85.025" font-family="Helvetica">Workspace</text><rect x="1120.21" y="45" width="113.211" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1127.21" y="65.09" fill="#000" font-size="17" textLength="99.211" font-family="Helvetica">macOS / app</text><polygon points="363.775,104,373.775,108,363.775,112,367.775,108" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="108" x2="369.775" y2="108" style="stroke:#181818;stroke-width:1;"/><text x="55" y="102.09" fill="#000" font-size="17" textLength="299.608" font-family="Helvetica">launch app / open web URL / open path</text><line x1="375.775" y1="156" x2="417.775" y2="156" style="stroke:#181818;stroke-width:1;"/><line x1="417.775" y1="156" x2="417.775" y2="169" style="stroke:#181818;stroke-width:1;"/><line x1="376.775" y1="169" x2="417.775" y2="169" style="stroke:#181818;stroke-width:1;"/><polygon points="386.775,165,376.775,169,386.775,173,382.775,169" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="382.775" y="133.09" fill="#000" font-size="17" textLength="190.876" font-family="Helvetica">preflight every root action</text><text x="382.775" y="150.09" fill="#000" font-size="17" textLength="257.017" font-family="Helvetica">live admission: both control grants</text><polygon points="811,196,821,200,811,204,815,200" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.775" y1="200" x2="817" y2="200" style="stroke:#181818;stroke-width:1;"/><text x="382.775" y="194.09" fill="#000" font-size="17" textLength="115.29" font-family="Helvetica">admitted action</text><polygon points="1164.815,244,1174.815,248,1164.815,252,1168.815,248" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="823" y1="248" x2="1170.815" y2="248" style="stroke:#181818;stroke-width:1;"/><text x="830" y="225.09" fill="#000" font-size="17" textLength="225.839" font-family="Helvetica">inspect admitted prerequisites</text><text x="830" y="242.09" fill="#000" font-size="17" textLength="253.232" font-family="Helvetica">only established prompt-free calls</text><path d="M712.518,261 L712.518,356 L1286.518,356 L1286.518,271 L1276.518,261 L712.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1276.518,261 L1276.518,271 L1286.518,271 L1276.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="718.518" y="279.09" fill="#000" font-size="17" textLength="548.042" font-family="Helvetica">First-use metadata route measured prompt-free on three protected roots.</text><text x="718.518" y="296.09" fill="#000" font-size="17" textLength="480.042" font-family="Helvetica">Long-location metadata/classification route remains unresolved.</text><text x="718.518" y="313.09" fill="#000" font-size="17" textLength="497.034" font-family="Helvetica">Size/uncertainty-to-failed correction is designed, not implemented.</text><text x="718.518" y="330.09" fill="#000" font-size="17" textLength="527.307" font-family="Helvetica">Document file-URL handler lookup prompts: protected default opening</text><text x="718.518" y="347.09" fill="#000" font-size="17" textLength="553.778" font-family="Helvetica">remains pending a human decision; do not attempt it as a readiness read.</text><path d="M13,365 L77.839,365 L77.839,374 L67.839,384 L13,384 L13,365" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="13" y="365" width="1204.815" height="420" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="28" y="379.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="92.839" y="380.09" fill="#000" font-size="17" textLength="333.459" font-weight="700" font-family="Helvetica">[missing prerequisite before submission]</text><polygon points="59,432,49,436,59,440,55,436" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="436" x2="822" y2="436" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="413.09" fill="#000" font-size="17" textLength="243.752" font-family="Helvetica">DEPENDENCY_UNAVAILABLE</text><text x="65" y="430.09" fill="#000" font-size="17" textLength="214.077" font-family="Helvetica">reason + guidance; no value</text><line x1="13" y1="445" x2="1217.815" y2="445" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="460.09" fill="#000" font-size="17" textLength="419.389" font-weight="700" font-family="Helvetica">[uncertain inspection / size / unresolved link bound]</text><polygon points="59,503,49,507,59,511,55,507" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="507" x2="822" y2="507" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="484.09" fill="#000" font-size="17" textLength="205.079" font-family="Helvetica">failed, not inferred absence</text><text x="65" y="501.09" fill="#000" font-size="17" textLength="329.798" font-family="Helvetica">designed correction; long route still required</text><line x1="13" y1="516" x2="1217.815" y2="516" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="531.09" fill="#000" font-size="17" textLength="56.686" font-weight="700" font-family="Helvetica">[ready]</text><polygon points="1164.815,574,1174.815,578,1164.815,582,1168.815,578" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="823" y1="578" x2="1170.815" y2="578" style="stroke:#181818;stroke-width:1;"/><text x="830" y="555.09" fill="#000" font-size="17" textLength="290.121" font-family="Helvetica">submit launch/open; request activation</text><text x="830" y="572.09" fill="#000" font-size="17" textLength="329.815" font-family="Helvetica">reuse running copy unless path-constrained</text><path d="M32,590 L96.839,590 L96.839,599 L86.839,609 L32,609 L32,590" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="590" width="1160.815" height="181" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="604.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="111.839" y="605.09" fill="#000" font-size="17" textLength="351.347" font-weight="700" font-family="Helvetica">[native acknowledgment within wait bound]</text><polygon points="834,640,824,644,834,648,830,644" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="828" y1="644" x2="1175.815" y2="644" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="840" y="638.09" fill="#000" font-size="17" textLength="155" font-family="Helvetica">accepted application</text><polygon points="59,688,49,692,59,696,55,692" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="692" x2="822" y2="692" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="669.09" fill="#000" font-size="17" textLength="162.064" font-family="Helvetica">AVAILABLE + receipt</text><text x="65" y="686.09" fill="#000" font-size="17" textLength="301.435" font-family="Helvetica">optional observed PID / kernel start only</text><line x1="32" y1="701" x2="1192.815" y2="701" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="37" y="716.09" fill="#000" font-size="17" textLength="355.24" font-weight="700" font-family="Helvetica">[native error, 3 s wait expiry or cancellation]</text><polygon points="59,759,49,763,59,767,55,763" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="763" x2="822" y2="763" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="740.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">failed; effect may have begun</text><text x="65" y="757.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">no replay or alternate handler</text><path d="M32,803 L103.43,803 L103.43,812 L93.43,822 L32,822 L32,803" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="803" width="542.67" height="93" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="817.09" fill="#000" font-size="17" textLength="26.43" font-weight="700" font-family="Helvetica">opt</text><text x="118.43" y="818.09" fill="#000" font-size="17" textLength="440.24" font-weight="700" font-family="Helvetica">[receipt includes process and client has desktop:read]</text><polygon points="363.775,853,373.775,857,363.775,861,367.775,857" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="857" x2="369.775" y2="857" style="stroke:#181818;stroke-width:1;"/><text x="55" y="851.09" fill="#000" font-size="17" textLength="303.775" font-family="Helvetica">desktopApplication(process: PID + start)</text><polygon points="59,884,49,888,59,892,55,888" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="888" x2="374.775" y2="888" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="882.09" fill="#000" font-size="17" textLength="291.034" font-family="Helvetica">desktop state / absent / classified error</text><path d="M10.332,915 L10.332,1044 L1214.332,1044 L1214.332,925 L1204.332,915 L10.332,915" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1204.332,915 L1204.332,925 L1214.332,925 L1204.332,915" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="365.052" y="933.09" fill="#000" font-size="17" textLength="392.154" font-family="Helvetica">Installed identity is not a held process or file identity.</text><text x="365.052" y="950.09" fill="#000" font-size="17" textLength="485.712" font-family="Helvetica">Window behavior belongs to the app; later exit remains possible.</text><text x="365.052" y="967.09" fill="#000" font-size="17" textLength="459.291" font-family="Helvetica">Acknowledgment alone does not pass activation acceptance.</text><text x="365.052" y="984.09" fill="#000" font-size="17" textLength="482.848" font-family="Helvetica">Core request deadline may answer first; late results are ignored.</text><text x="365.052" y="1001.09" fill="#000" font-size="17" textLength="442.232" font-family="Helvetica">Publication errors can suppress the selected result branch.</text><text x="365.052" y="1018.09" fill="#000" font-size="17" textLength="455.472" font-family="Helvetica">Reveal is a separate operation with Finder acknowledgment.</text><text x="365.052" y="1035.09" fill="#000" font-size="17" textLength="368.505" font-family="Helvetica">Neither control grant implies read or OS consent.</text><?plantuml-src XLRRYXj747sVhoYSbmIl948U4hGGK7PNP66Z61l711P2QQP6qwZLtUdkqLf-oaVa2_CbETKpkXc7F0XcfkjwwjHffQrnWIFlQCtrTXDzxvexRtsahvO_B1VBkogTB1ffkRTvwLrUyKxePx5xoQRcBzkyCv-4llt-uZ1rtFWNupRKiarITQOHQhtFQ_-noYPReGy-RbFWMiXox-fkveCu-kUlln4vcOsJveQuhYLaTZ32OODu5UAZ41FOPRgpHbo--lJg5wuxuuHg7-KLSQ8xF5oPd19VE-wu_lKTpOX3A7uhpcOlrP239Z-MGFEnMBM2RIdvHTRq_ktJyJLmxYgrFVk4AAqrcowJx2KUA088z9QDTy_E8WjnipCfuNrEQvyxLEzoz9Os4RMbKxXJwVFYaRCqOvpg32ViXjhdP5mAKkUpCIg9ycTlaicIdfrtza2ICg-jILqvzxkG9sqK8CZMfihvBEHHzZdvpGZDqiIK9tqIsadcXZEZi