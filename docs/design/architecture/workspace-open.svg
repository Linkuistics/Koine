<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1068px;height:894px;background:#F8FAFC;" width="1068px" height="894px" viewBox="0 0 1068 894" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1068" height="894" fill="#F8FAFC" style="stroke:none;"/><g class="title" data-source-line="6"><text x="339.786" y="25.78" fill="#000" font-size="14" textLength="386.641" font-weight="700" font-family="Helvetica">Workspace launch/open — designed, acceptance pending</text></g><rect x="13" y="260" width="1028.607" height="349" fill="none" style="stroke:#000;stroke-width:1.5;"/><rect x="32" y="414" width="984.607" height="181" fill="none" style="stroke:#000;stroke-width:1.5;"/><rect x="32" y="627" width="542.67" height="93" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Client</title><rect x="44.5" y="77" width="8" height="806" fill="#000" fill-opacity="0"/><line x1="48" y1="77" x2="48" y2="883" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Machine core</title><rect x="372.275" y="77" width="8" height="806" fill="#000" fill-opacity="0"/><line x1="375.775" y1="77" x2="375.775" y2="883" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Workspace</title><rect x="643.292" y="77" width="8" height="806" fill="#000" fill-opacity="0"/><line x1="646.792" y1="77" x2="646.792" y2="883" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>macOS . app</title><rect x="997.107" y="77" width="8" height="806" fill="#000" fill-opacity="0"/><line x1="1000.607" y1="77" x2="1000.607" y2="883" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="19.269" y="45" width="57.463" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="