.5"/><text x="26.269" y="65.09" fill="#000" font-size="17" textLength="43.463" font-family="Helvetica">Client</text><rect x="317.75" y="45" width="116.05" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="324.75" y="65.09" fill="#000" font-size="17" textLength="102.05" font-family="Helvetica">Machine core</text><rect x="779.626" y="45" width="99.025" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="786.626" y="65.09" fill="#000" font-size="17" textLength="85.025" font-family="Helvetica">Workspace</text><rect x="1126.348" y="45" width="113.211" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1133.348" y="65.09" fill="#000" font-size="17" textLength="99.211" font-family="Helvetica">macOS / app</text><polygon points="363.775,104,373.775,108,363.775,112,367.775,108" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="108" x2="369.775" y2="108" style="stroke:#181818;stroke-width:1;"/><text x="55" y="102.09" fill="#000" font-size="17" textLength="299.608" font-family="Helvetica">launch app / open web URL / open path</text><line x1="375.775" y1="156" x2="417.775" y2="156" style="stroke:#181818;stroke-width:1;"/><line x1="417.775" y1="156" x2="417.775" y2="169" style="stroke:#181818;stroke-width:1;"/><line x1="376.775" y1="169" x2="417.775" y2="169" style="stroke:#181818;stroke-width:1;"/><polygon points="386.775,165,376.775,169,386.775,173,382.775,169" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="382.775" y="133.09" fill="#000" font-size="17" textLength="190.876" font-family="Helvetica">preflight every root action</text><text x="382.775" y="150.09" fill="#000" font-size="17" textLength="257.017" font-family="Helvetica">live admission: both control grants</text><polygon points="817.139,196,827.139,200,817.139,204,821.139,200" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.775" y1="200" x2="823.139" y2="200" style="stroke:#181818;stroke-width:1;"/><text x="382.775" y="194.09" fill="#000" font-size="17" textLength="115.29" font-family="Helvetica">admitted action</text><polygon points="1170.953,244,1180.953,248,1170.953,252,1174.953,248" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="829.139" y1="248" x2="1176.953" y2="248" style="stroke:#181818;stroke-width:1;"/><text x="836.139" y="225.09" fill="#000" font-size="17" textLength="225.839" font-family="Helvetica">inspect admitted prerequisites</text><text x="836.139" y="242.09" fill="#000" font-size="17" textLength="253.232" font-family="Helvetica">only established prompt-free calls</text><path d="M712.518,261 L712.518,390 L1299.518,390 L1299.518,271 L1289.518,261 L712.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1289.518,261 L1289.518,271 L1299.518,271 L1289.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="718.518" y="279.09" fill="#000" font-size="17" textLength="548.042" font-family="Helvetica">First-use metadata route measured prompt-free on three protected roots.</text><text x="718.518" y="296.09" fill="#000" font-size="17" textLength="566.055" font-family="Helvetica">Designed 1.0.1 (v1): Koine resolves the location component by component;</text><text x="718.518" y="313.09" fill="#000" font-size="17" textLength="566.047" font-family="Helvetica">only that resolution establishes absence. A spelling needing PATH_MAX or</text><text x="718.518" y="330.09" fill="#000" font-size="17" textLength="496.121" font-family="Helvetica">more is failed before any request; within it the route is unchanged.</text><text x="718.518" y="347.09" fill="#000" font-size="17" textLength="550.931" font-family="Helvetica">Selected app URL is registered spelling of the constrained native identity.</text><text x="718.518" y="364.09" fill="#000" font-size="17" textLength="527.307" font-family="Helvetica">Document file-URL handler lookup prompts: protected default opening</text><text x="718.518" y="381.09" fill="#000" font-size="17" textLength="553.778" font-family="Helvetica">remains pending a human decision; do not attempt it as a readiness read.</text><path d="M13,399 L77.839,399 L77.839,408 L67.839,418 L13,418 L13,399" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="13" y="399" width="1210.953" height="420" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="28" y="413.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="92.839" y="414.09" fill="#000" font-size="17" textLength="333.459" font-weight="700" font-family="Helvetica">[missing prerequisite before submission]</text><polygon points="59,466,49,470,59,474,55,470" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="470" x2="828.139" y2="470" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="447.09" fill="#000" font-size="17" textLength="243.752" font-family="Helvetica">DEPENDENCY_UNAVAILABLE</text><text x="65" y="464.09" fill="#000" font-size="17" textLength="214.077" font-family="Helvetica">reason + guidance; no value</text><line x1="13" y1="479" x2="1223.953" y2="479" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="494.09" fill="#000" font-size="17" textLength="404.215" font-weight="700" font-family="Helvetica">[uncertain inspection / link budget / hand-off limit]</text><polygon points="59,537,49,541,59,545,55,541" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="541" x2="828.139" y2="541" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="518.09" fill="#000" font-size="17" textLength="205.079" font-family="Helvetica">failed, not inferred absence</text><text x="65" y="535.09" fill="#000" font-size="17" textLength="271.195" font-family="Helvetica">includes the v1 hand-off limit refusal</text><line x1="13" y1="550" x2="1223.953" y2="550" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="565.09" fill="#000" font-size="17" textLength="56.686" font-weight="700" font-family="Helvetica">[ready]</text><polygon points="1170.953,608,1180.953,612,1170.953,616,1174.953,612" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="829.139" y1="612" x2="1176.953" y2="612" style="stroke:#181818;stroke-width:1;"/><text x="836.139" y="589.09" fill="#000" font-size="17" textLength="290.121" font-family="Helvetica">submit launch/open; request activation</text><text x="836.139" y="606.09" fill="#000" font-size="17" textLength="329.815" font-family="Helvetica">reuse running copy unless path-constrained</text><path d="M32,624 L96.839,624 L96.839,633 L86.839,643 L32,643 L32,624" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="624" width="1166.953" height="181" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="638.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="111.839" y="639.09" fill="#000" font-size="17" textLength="351.347" font-weight="700" font-family="Helvetica">[native acknowledgment within wait bound]</text><polygon points="840.139,674,830.139,678,840.139,682,836.139,678" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="834.139" y1="678" x2="1181.953" y2="678" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="846.139" y="672.09" fill="#000" font-size="17" textLength="155" font-family="Helvetica">accepted application</text><polygon points="59,722,49,726,59,730,55,726" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="726" x2="828.139" y2="726" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="703.09" fill="#000" font-size="17" textLength="162.064" font-family="Helvetica">AVAILABLE + receipt</text><text x="65" y="720.09" fill="#000" font-size="17" textLength="301.435" font-family="Helvetica">optional observed PID / kernel start only</text><line x1="32" y1="735" x2="1198.953" y2="735" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="37" y="750.09" fill="#000" font-size="17" textLength="355.24" font-weight="700" font-family="Helvetica">[native error, 3 s wait expiry or cancellation]</text><polygon points="59,793,49,797,59,801,55,797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="797" x2="828.139" y2="797" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="774.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">failed; effect may have begun</text><text x="65" y="791.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">no replay or alternate handler</text><path d="M32,837 L103.43,837 L103.43,846 L93.43,856 L32,856 L32,837" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="837" width="542.67" height="93" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="851.09" fill="#000" font-size="17" textLength="26.43" font-weight="700" font-family="Helvetica">opt</text><text x="118.43" y="852.09" fill="#000" font-size="17" textLength="440.24" font-weight="700" font-family="Helvetica">[receipt includes process and client has desktop:read]</text><polygon points="363.775,887,373.775,891,363.775,895,367.775,891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="891" x2="369.775" y2="891" style="stroke:#181818;stroke-width:1;"/><text x="55" y="885.09" fill="#000" font-size="17" textLength="303.775" font-family="Helvetica">desktopApplication(process: PID + start)</text><polygon points="59,918,49,922,59,926,55,922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="922" x2="374.775" y2="922" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="916.09" fill="#000" font-size="17" textLength="291.034" font-family="Helvetica">desktop state / absent / classified error</text><path d="M10.332,949 L10.332,1078 L1220.332,1078 L1220.332,959 L1210.332,949 L10.332,949" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1210.332,949 L1210.332,959 L1220.332,959 L1210.332,949" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="368.121" y="967.09" fill="#000" font-size="17" textLength="392.154" font-family="Helvetica">Installed identity is not a held process or file identity.</text><text x="368.121" y="984.09" fill="#000" font-size="17" textLength="485.712" font-family="Helvetica">Window behavior belongs to the app; later exit remains possible.</text><text x="368.121" y="1001.09" fill="#000" font-size="17" textLength="459.291" font-family="Helvetica">Acknowledgment alone does not pass activation acceptance.</text><text x="368.121" y="1018.09" fill="#000" font-size="17" textLength="482.848" font-family="Helvetica">Core request deadline may answer first; late results are ignored.</text><text x="368.121" y="1035.09" fill="#000" font-size="17" textLength="442.232" font-family="Helvetica">Publication errors can suppress the selected result branch.</text><text x="368.121" y="1052.09" fill="#000" font-size="17" textLength="455.472" font-family="Helvetica">Reveal is a separate operation with Finder acknowledgment.</text><text x="368.121" y="1069.09" fill="#000" font-size="17" textLength="368.505" font-family="Helvetica">Neither control grant implies read or OS consent.</text><?plantuml-src XLRRRjms47tNLmpIbmJnhclqeSKkK63h2s