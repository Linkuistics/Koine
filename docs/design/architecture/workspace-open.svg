<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1339px;height:1121px;background:#F8FAFC;" width="1339px" height="1121px" viewBox="0 0 1339 1121" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1339" height="1121" fill="#F8FAFC" style="stroke:none;"/><g class="title" data-source-line="6"><text x="475.287" y="25.78" fill="#000" font-size="14" textLength="386.641" font-weight="700" font-family="Helvetica">Workspace launch/open — designed, acceptance pending</text></g><rect x="13" y="416" width="1222.774" height="420" fill="none" style="stroke:#000;stroke-width:1.5;"/><rect x="32" y="641" width="1178.774" height="181" fill="none" style="stroke:#000;stroke-width:1.5;"/><rect x="32" y="854" width="542.67" height="93" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Client</title><rect x="44.5" y="77" width="8" height="1033" fill="#000" fill-opacity="0"/><line x1="48" y1="77" x2="48" y2="1110" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Machine core</title><rect x="372.275" y="77" width="8" height="1033" fill="#000" fill-opacity="0"/><line x1="375.775" y1="77" x2="375.775" y2="1110" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Workspace</title><rect x="837.459" y="77" width="8" height="1033" fill="#000" fill-opacity="0"/><line x1="840.959" y1="77" x2="840.959" y2="1110" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>macOS . app</title><rect x="1191.274" y="77" width="8" height="1033" fill="#000" fill-opacity="0"/><line x1="1194.774" y1="77" x2="1194.774" y2="1110" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="19.269" y="45" width="57.463" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="26.269" y="65.09" fill="#000" font-size="17" textLength="43.463" font-family="Helvetica">Client</text><rect x="317.75" y="45" width="116.05" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="324.75" y="65.09" fill="#000" font-size="17" textLength="102.05" font-family="Helvetica">Machine core</text><rect x="791.446" y="45" width="99.025" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="798.446" y="65.09" fill="#000" font-size="17" textLength="85.025" font-family="Helvetica">Workspace</text><rect x="1138.168" y="45" width="113.211" height="31" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1145.168" y="65.09" fill="#000" font-size="17" textLength="99.211" font-family="Helvetica">macOS / app</text><polygon points="363.775,104,373.775,108,363.775,112,367.775,108" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="108" x2="369.775" y2="108" style="stroke:#181818;stroke-width:1;"/><text x="55" y="102.09" fill="#000" font-size="17" textLength="299.608" font-family="Helvetica">launch app / open web URL / open path</text><line x1="375.775" y1="156" x2="417.775" y2="156" style="stroke:#181818;stroke-width:1;"/><line x1="417.775" y1="156" x2="417.775" y2="169" style="stroke:#181818;stroke-width:1;"/><line x1="376.775" y1="169" x2="417.775" y2="169" style="stroke:#181818;stroke-width:1;"/><polygon points="386.775,165,376.775,169,386.775,173,382.775,169" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="382.775" y="133.09" fill="#000" font-size="17" textLength="190.876" font-family="Helvetica">preflight every root action</text><text x="382.775" y="150.09" fill="#000" font-size="17" textLength="257.017" font-family="Helvetica">live admission: both control grants</text><polygon points="828.959,196,838.959,200,828.959,204,832.959,200" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.775" y1="200" x2="834.959" y2="200" style="stroke:#181818;stroke-width:1;"/><text x="382.775" y="194.09" fill="#000" font-size="17" textLength="115.29" font-family="Helvetica">admitted action</text><polygon points="1182.774,244,1192.774,248,1182.774,252,1186.774,248" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="840.959" y1="248" x2="1188.774" y2="248" style="stroke:#181818;stroke-width:1;"/><text x="847.959" y="225.09" fill="#000" font-size="17" textLength="225.839" font-family="Helvetica">inspect admitted prerequisites</text><text x="847.959" y="242.09" fill="#000" font-size="17" textLength="253.232" font-family="Helvetica">only established prompt-free calls</text><path d="M712.518,261 L712.518,407 L1322.518,407 L1322.518,271 L1312.518,261 L712.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1312.518,261 L1312.518,271 L1322.518,271 L1312.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="718.518" y="279.09" fill="#000" font-size="17" textLength="548.042" font-family="Helvetica">First-use metadata route measured prompt-free on three protected roots.</text><text x="718.518" y="296.09" fill="#000" font-size="17" textLength="507.477" font-family="Helvetica">Designed 1.0.1 (v1): Koine resolves the target, then the application,</text><text x="718.518" y="313.09" fill="#000" font-size="17" textLength="589.696" font-family="Helvetica">component by component; only that resolution establishes absence. A spelling</text><text x="718.518" y="330.09" fill="#000" font-size="17" textLength="566.943" font-family="Helvetica">of PATH_MAX (1,024) bytes or more, NUL not counted, is failed before any</text><text x="718.518" y="347.09" fill="#000" font-size="17" textLength="305.245" font-family="Helvetica">request; within it the route is unchanged.</text><text x="718.518" y="364.09" fill="#000" font-size="17" textLength="550.931" font-family="Helvetica">Selected app URL is registered spelling of the constrained native identity.</text><text x="718.518" y="381.09" fill="#000" font-size="17" textLength="527.307" font-family="Helvetica">Document file-URL handler lookup prompts: protected default opening</text><text x="718.518" y="398.09" fill="#000" font-size="17" textLength="553.778" font-family="Helvetica">remains pending a human decision; do not attempt it as a readiness read.</text><path d="M13,416 L77.839,416 L77.839,425 L67.839,435 L13,435 L13,416" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="13" y="416" width="1222.774" height="420" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="28" y="430.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="92.839" y="431.09" fill="#000" font-size="17" textLength="333.459" font-weight="700" font-family="Helvetica">[missing prerequisite before submission]</text><polygon points="59,483,49,487,59,491,55,487" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="487" x2="839.959" y2="487" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="464.09" fill="#000" font-size="17" textLength="243.752" font-family="Helvetica">DEPENDENCY_UNAVAILABLE</text><text x="65" y="481.09" fill="#000" font-size="17" textLength="214.077" font-family="Helvetica">reason + guidance; no value</text><line x1="13" y1="496" x2="1235.774" y2="496" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="511.09" fill="#000" font-size="17" textLength="404.215" font-weight="700" font-family="Helvetica">[uncertain inspection / link budget / hand-off limit]</text><polygon points="59,554,49,558,59,562,55,558" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="558" x2="839.959" y2="558" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="535.09" fill="#000" font-size="17" textLength="205.079" font-family="Helvetica">failed, not inferred absence</text><text x="65" y="552.09" fill="#000" font-size="17" textLength="271.195" font-family="Helvetica">includes the v1 hand-off limit refusal</text><line x1="13" y1="567" x2="1235.774" y2="567" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="582.09" fill="#000" font-size="17" textLength="56.686" font-weight="700" font-family="Helvetica">[ready]</text><polygon points="1182.774,625,1192.774,629,1182.774,633,1186.774,629" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="840.959" y1="629" x2="1188.774" y2="629" style="stroke:#181818;stroke-width:1;"/><text x="847.959" y="606.09" fill="#000" font-size="17" textLength="290.121" font-family="Helvetica">submit launch/open; request activation</text><text x="847.959" y="623.09" fill="#000" font-size="17" textLength="329.815" font-family="Helvetica">reuse running copy unless path-constrained</text><path d="M32,641 L96.839,641 L96.839,650 L86.839,660 L32,660 L32,641" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="641" width="1178.774" height="181" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="655.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="111.839" y="656.09" fill="#000" font-size="17" textLength="351.347" font-weight="700" font-family="Helvetica">[native acknowledgment within wait bound]</text><polygon points="851.959,691,841.959,695,851.959,699,847.959,695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="845.959" y1="695" x2="1193.774" y2="695" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="857.959" y="689.09" fill="#000" font-size="17" textLength="155" font-family="Helvetica">accepted application</text><polygon points="59,739,49,743,59,747,55,743" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="743" x2="839.959" y2="743" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="720.09" fill="#000" font-size="17" textLength="162.064" font-family="Helvetica">AVAILABLE + receipt</text><text x="65" y="737.09" fill="#000" font-size="17" textLength="301.435" font-family="Helvetica">optional observed PID / kernel start only</text><line x1="32" y1="752" x2="1210.774" y2="752" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="37" y="767.09" fill="#000" font-size="17" textLength="355.24" font-weight="700" font-family="Helvetica">[native error, 3 s wait expiry or cancellation]</text><polygon points="59,810,49,814,59,818,55,814" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="814" x2="839.959" y2="814" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="791.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">failed; effect may have begun</text><text x="65" y="808.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">no replay or alternate handler</text><path d="M32,854 L103.43,854 L103.43,863 L93.43,873 L32,873 L32,854" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="854" width="542.67" height="93" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="868.09" fill="#000" font-size="17" textLength="26.43" font-weight="700" font-family="Helvetica">opt</text><text x="118.43" y="869.09" fill="#000" font-size="17" textLength="440.24" font-weight="700" font-family="Helvetica">[receipt includes process and client has desktop:read]</text><polygon points="363.775,904,373.775,908,363.775,912,367.775,908" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="908" x2="369.775" y2="908" style="stroke:#181818;stroke-width:1;"/><text x="55" y="902.09" fill="#000" font-size="17" textLength="303.775" font-family="Helvetica">desktopApplication(process: PID + start)</text><polygon points="59,935,49,939,59,943,55,939" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="939" x2="374.775" y2="939" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="933.09" fill="#000" font-size="17" textLength="291.034" font-family="Helvetica">desktop state / absent / classified error</text><path d="M10.332,966 L10.332,1095 L1232.332,1095 L1232.332,976 L1222.332,966 L10.332,966" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1222.332,966 L1222.332,976 L1232.332,976 L1222.332,966" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="374.031" y="984.09" fill="#000" font-size="17" textLength="392.154" font-family="Helvetica">Installed identity is not a held process or file identity.</text><text x="374.031" y="1001.09" fill="#000" font-size="17" textLength="485.712" font-family="Helvetica">Window behavior belongs to the app; later exit remains possible.</text><text x="374.031" y="1018.09" fill="#000" font-size="17" textLength="459.291" font-family="Helvetica">Acknowledgment alone does not pass activation acceptance.</text><text x="374.031" y="1035.09" fill="#000" font-size="17" textLength="482.848" font-family="Helvetica">Core request deadline may answer first; late results are ignored.</text><text x="374.031" y="1052.09" fill="#000" font-size="17" textLength="442.232" font-family="Helvetica">Publication errors can suppress the selected result branch.</text><text x="374.031" y="1069.09" fill="#000" font-size="17" textLength="455.472" font-family="Helvetica">Reveal is a separate operation with Finder acknowledgment.</text><text x="374.031" y="1086.09" fill="#000" font-size