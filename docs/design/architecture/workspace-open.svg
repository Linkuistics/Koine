oke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.775" y1="200" x2="817" y2="200" style="stroke:#181818;stroke-width:1;"/><text x="382.775" y="194.09" fill="#000" font-size="17" textLength="115.29" font-family="Helvetica">admitted action</text><polygon points="1164.815,244,1174.815,248,1164.815,252,1168.815,248" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="823" y1="248" x2="1170.815" y2="248" style="stroke:#181818;stroke-width:1;"/><text x="830" y="225.09" fill="#000" font-size="17" textLength="225.839" font-family="Helvetica">inspect admitted prerequisites</text><text x="830" y="242.09" fill="#000" font-size="17" textLength="253.232" font-family="Helvetica">only established prompt-free calls</text><path d="M712.518,261 L712.518,322 L1286.518,322 L1286.518,271 L1276.518,261 L712.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1276.518,261 L1276.518,271 L1286.518,271 L1276.518,261" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="718.518" y="279.09" fill="#000" font-size="17" textLength="548.042" font-family="Helvetica">First-use metadata route measured prompt-free on three protected roots.</text><text x="718.518" y="296.09" fill="#000" font-size="17" textLength="527.307" font-family="Helvetica">Document file-URL handler lookup prompts: protected default opening</text><text x="718.518" y="313.09" fill="#000" font-size="17" textLength="553.778" font-family="Helvetica">remains pending a human decision; do not attempt it as a readiness read.</text><path d="M13,331 L77.839,331 L77.839,340 L67.839,350 L13,350 L13,331" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="13" y="331" width="1204.815" height="349" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="28" y="345.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="92.839" y="346.09" fill="#000" font-size="17" textLength="333.459" font-weight="700" font-family="Helvetica">[missing prerequisite before submission]</text><polygon points="59,398,49,402,59,406,55,402" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="402" x2="822" y2="402" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="379.09" fill="#000" font-size="17" textLength="243.752" font-family="Helvetica">DEPENDENCY_UNAVAILABLE</text><text x="65" y="396.09" fill="#000" font-size="17" textLength="214.077" font-family="Helvetica">reason + guidance; no value</text><line x1="13" y1="411" x2="1217.815" y2="411" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="426.09" fill="#000" font-size="17" textLength="56.686" font-weight="700" font-family="Helvetica">[ready]</text><polygon points="1164.815,469,1174.815,473,1164.815,477,1168.815,473" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="823" y1="473" x2="1170.815" y2="473" style="stroke:#181818;stroke-width:1;"/><text x="830" y="450.09" fill="#000" font-size="17" textLength="290.121" font-family="Helvetica">submit launch/open; request activation</text><text x="830" y="467.09" fill="#000" font-size="17" textLength="329.815" font-family="Helvetica">reuse running copy unless path-constrained</text><path d="M32,485 L96.839,485 L96.839,494 L86.839,504 L32,504 L32,485" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="485" width="1160.815" height="181" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="499.09" fill="#000" font-size="17" textLength="19.839" font-weight="700" font-family="Helvetica">alt</text><text x="111.839" y="500.09" fill="#000" font-size="17" textLength="351.347" font-weight="700" font-family="Helvetica">[native acknowledgment within wait bound]</text><polygon points="834,535,824,539,834,543,830,539" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="828" y1="539" x2="1175.815" y2="539" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="840" y="533.09" fill="#000" font-size="17" textLength="155" font-family="Helvetica">accepted application</text><polygon points="59,583,49,587,59,591,55,587" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="587" x2="822" y2="587" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="564.09" fill="#000" font-size="17" textLength="162.064" font-family="Helvetica">AVAILABLE + receipt</text><text x="65" y="581.09" fill="#000" font-size="17" textLength="301.435" font-family="Helvetica">optional observed PID / kernel start only</text><line x1="32" y1="596" x2="1192.815" y2="596" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="37" y="611.09" fill="#000" font-size="17" textLength="355.24" font-weight="700" font-family="Helvetica">[native error, 3 s wait expiry or cancellation]</text><polygon points="59,654,49,658,59,662,55,658" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="658" x2="822" y2="658" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="635.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">failed; effect may have begun</text><text x="65" y="652.09" fill="#000" font-size="17" textLength="222.087" font-family="Helvetica">no replay or alternate handler</text><path d="M32,698 L103.43,698 L103.43,707 L93.43,717 L32,717 L32,698" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="32" y="698" width="542.67" height="93" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="47" y="712.09" fill="#000" font-size="17" textLength="26.43" font-weight="700" font-family="Helvetica">opt</text><text x="118.43" y="713.09" fill="#000" font-size="17" textLength="440.24" font-weight="700" font-family="Helvetica">[receipt includes process and client has desktop:read]</text><polygon points="363.775,748,373.775,752,363.775,756,367.775,752" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48" y1="752" x2="369.775" y2="752" style="stroke:#181818;stroke-width:1;"/><text x="55" y="746.09" fill="#000" font-size="17" textLength="303.775" font-family="Helvetica">desktopApplication(process: PID + start)</text><polygon points="59,779,49,783,59,787,55,783" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="783" x2="374.775" y2="783" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="777.09" fill="#000" font-size="17" textLength="291.034" font-family="Helvetica">desktop state / absent / classified error</text><path d="M10.332,810 L10.332,939 L1214.332,939 L1214.332,820 L1204.332,810 L10.332,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1204.332,810 L1204.332,820 L1214.332,820 L1204.332,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="365.052" y="828.09" fill="#000" font-size="17" textLength="392.154" font-family="Helvetica">Installed identity is not a held process or file identity.</text><text x="365.052" y="845.09" fill="#000" font-size="17" textLength="485.712" font-family="Helvetica">Window behavior belongs to the app; later exit remains possible.</text><text x="365.052" y="862.09" fill="#000" font-size="17" textLength="459.291" font-family="Helvetica">Acknowledgment alone does not pass activation acceptance.</text><text x="365.052" y="879.09" fill="#000" font-size="17" textLength="482.848" font-family="Helvetica">Core request deadline may answer first; late results are ignored.</text><text x="365.052" y="896.09" fill="#000" font-size="17" textLength="442.232" font-family="Helvetica">Publication errors can suppress the selected result branch.</text><t