<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1143px;height:660px;background:#F8FAFC;" width="1143px" height="660px" viewBox="0 0 1143 660" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1143" height="660" fill="#F8FAFC" style="stroke:none;"/><g class="title" data-source-line="5"><text x="337.136" y="20.78" fill="#000" font-size="14" textLength="462.171" font-weight="700" font-family="Helvetica">Agreed bearer grant lifecycle — approval, persistence and revocation</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="6"><ellipse cx="630.6" cy="51" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Pending" id="ent0002" data-source-line="6"><rect x="263.41" y="145.5" width="82.389" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="263.41" y1="172.5" x2="345.799" y2="172.5" style="stroke:#181818;stroke-width:0.5;"/><text x="273.41" y="163.59" fill="#000" font-size="17" textLength="62.389" font-family="Helvetica">Pending</text></g><g class="entity" data-qualified-name="Active" id="ent0004" data-source-line="7"><rect x="628.46" y="319.5" width="66.293" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="628.46" y1="346.5" x2="694.753" y2="346.5" style="stroke:#181818;stroke-width:0.5;"/><text x="638.46" y="337.59" fill="#000" font-size="17" textLength="46.293" font-family="Helvetica">Active</text></g><g class="entity" data-qualified-name="Denied" id="ent0006" data-source-line="8"><rect x="47.67" y="422" width="73.872" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="47.67" y1="449" x2="121.542" y2="449" style="stroke:#181818;stroke-width:0.5;"/><text x="57.67" y="440.09" fill="#000" font-size="17" textLength="53.872" font-family="Helvetica">Denied</text></g><g class="entity" data-qualified-name="Expired" id="ent0008" data-source-line="9"><rect x="171.78" y="422" width="77.641" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="171.78" y1="449" x2="249.421" y2="449" style="stroke:#181818;stroke-width:0.5;"/><text x="181.78" y="440.09" fill="#000" font-size="17" textLength="57.641" font-family="Helvetica">Expired</text></g><g class="entity" data-qualified-name="Revoked" id="ent0011" data-source-line="11"><rect x="441.06" y="507.5" width="87.095" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="441.06" y1="534.5" x2="528.155" y2="534.5" style="stroke:#181818;stroke-width:0.5;"/><text x="451.06" y="525.59" fill="#000" font-size="17" textLength="67.095" font-family="Helvetica">Revoked</text></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="12"><ellipse cx="210.6" cy="635" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="210.6" cy="635" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="16"><path d="M380.73,140 L380.73,166.5 L345.91,170.5 L380.73,174.5 L380.73,201 A0,0 0 0 0 380.73,201 L698.475,201 A0,0 0 0 0 698.475,201 L698.475,150 L688.475,140 L380.73,140 A0,0 0 0 0 380.73,140" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M688.475,140 L688.475,150 L698.475,150 L688.475,140" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="386.73" y="158.09" fill="#000" font-size="17" textLength="294.802" font-family="Helvetica">Requester may poll only its own status.</text><text x="386.73" y="175.09" fill="#000" font-size="17" textLength="296.745" font-family="Helvetica">Possessing a pending credential grants</text><text x="386.73" y="192.09" fill="#000" font-size="17" textLength="283.488" font-family="Helvetica">no provider or management authority.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="21"><path d="M263.63,297 L263.63,392 A0,0 0 0 0 263.63,392 L593.585,392 A0,0 0 0 0 593.585,392 L593.585,348.5 L627.97,344.5 L593.585,340.5 L593.585,307 L583.585,297 L263.63,297 A0,0 0 0 0 263.63,297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M583.585,297 L583.585,307 L593.585,307 L583.585,297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="269.63" y="315.09" fill="#000" font-size="17" textLength="291.059" font-family="Helvetica">Agreed: transferable bearer credential.</text><text x="269.63" y="332.09" fill="#000" font-size="17" textLength="286.319" font-family="Helvetica">Check the live grant on every request.</text><text x="269.63" y="349.09" fill="#000" font-size="17" textLength="308.955" font-family="Helvetica">Restart preserves it; no automatic expiry.</text><text x="269.63" y="366.09" fill="#000" font-size="17" textLength="266.463" font-family="Helvetica">Client stores the secret in Keychain</text><text x="269.63" y="383.09" fill="#000" font-size="17" textLength="136.075" font-family="Helvetica">or a protected file.</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="28"><path d="M563,502 L563,528.5 L528.61,532.5 L563,536.5 L563,563 A0,0 0 0 0 563,563 L924.216,563 A0,0 0 0 0 924.216,563 L924.216,512 L914.216,502 L563,502 A0,0 0 0 0 563,502" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M914.216,502 L914.216,512 L924.216,512 L914.216,502" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="569" y="520.09" fill="#000" font-size="17" textLength="337.344" font-family="Helvetica">An already admitted native action may finish.</text><text x="569" y="537.09" fill="#000" font-size="17" textLength="311.811" font-family="Helvetica">No later action may start under this grant.</text><text x="569" y="554.09" fill="#000" font-size="17" textLength="340.216" font-family="Helvetica">Revocation does not undo completed effects.</text></g><!--link *start* to Pending--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="6" data-link-type="dependency"><path d="M621.2,54.56 C586.42,64.15 461.97,99.45 363.6,140 C357.89,142.36 356.475,142.882 350.675,145.642" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Pending"/><polygon points="346.16,147.79,356.006,147.535,350.675,145.642,352.568,140.311,346.16,147.79" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="494.6" y="105.09" fill="#000" font-size="17" textLength="307.577" font-family="Helvetica">client submits credential digest + request</text></g><!--link Pending to Active--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="7" data-link-type="dependency"><path d="M346.05,193.49 C351.86,196.2 357.83,198.79 363.6,201 C410.94,219.09 429.78,205.57 473.6,231 C493.18,242.36 490.16,255.42 509.6,267 C549.84,290.96 569.83,273.98 610.6,297 C620.93,302.83 627.281,307.66 635.621,315.61" style="stroke:#181818;stroke-width:1;" fill="none" id="Pending-to-Active"/><polygon points="639.24,319.06,635.485,309.955,635.621,315.61,629.966,315.745,639.24,319.06" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="547.447" y="245.09" fill="#000" font-size="17" textLength="252.302" font-family="Helvetica">local console or existing manager</text><text x="510.6" y="262.09" fill="#000" font-size="17" textLength="325.997" font-family="Helvetica">approves capability subset; durable commit</text></g><!--link Pending to Denied--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="8" data-link-type="dependency"><path d="M263.1,175.09 C198.02,181.67 76.67,198.13 50.6,231 C6,287.26 43.923,374.057 67.693,417.337" style="stroke:#181818;stroke-width:1;" fill="none" id="Pending-to-Denied"/><polygon points="70.1,421.72,69.274,411.906,67.693,417.337,62.261,415.757,70.1,421.72" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="51.6" y="253.59" fill="#000" font-size="17" textLength="129.484" font-family="Helvetica">authorized denial</text></g><!--link Pending to Expired--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" id="lnk9" data-source-line="9" data-link-type="dependency"><path d="M263.02,184.61 C241.19,193.86 216.38,208.65 203.6,231 C168.67,292.12 187.487,375.028 200.627,417.018" style="stroke:#181818;stroke-width:1;" fill="none" id="Pending-to-Expired"/><polygon points="202.12,421.79,203.25,412.006,200.627,417.018,195.615,414.395,202.12,421.79" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="204.6" y="253.59" fill="#000" font-size="17" textLength="260.852" font-family="Helvetica">pending request exceeds 24 hours</text></g><!--link *start* to Active--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-source-line="10" data-link-type="dependency"><path d="M640.63,52.77 C674.84,55.6 786.21,66.55 810.6,91 C855.55,136.05 833.9,167.72 840.6,231 C842.29,246.91 849.42,253.65 840.6,267 C808.21,316.08 742.105,333.041 699.905,339.351" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Active"/><polygon points="694.96,340.09,704.453,342.715,699.905,339.351,703.27,334.803,694.96,340.09" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="858.14" y="166.59" fill="#000" font-size="17" textLength="252.302" font-family="Helvetica">local console or existing manager</text><text x="841.14" y="183.59" fill="#000" font-size="17" textLength="286.302" font-family="Helvetica">creates manual grant; one-time secret</text></g><!--link Active to Revoked--><g class="link" data-entity-1="ent0004" data-entity-2="ent0011" id="lnk12" data-source-line="11" data-link-type="dependency"><path d="M638.46,369.82 C604.54,405.46 545.117,467.908 511.197,503.558" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Revoked"/><polygon points="507.75,507.18,516.852,503.417,511.197,503.558,511.056,497.903,507.75,507.18" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="599.359" y="443.09" fill="#000" font-size="17" textLength="260.794" font-family="Helvetica">authorized revoke; durable commit</text><text x="584.7" y="460.09" fill="#000" font-size="17" textLength="290.112" font-family="Helvetica">blocks subsequent dispatch admission</text></g><!--link Revoked to *end*--><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" id="lnk14" data-source-line="12" data-link-type="dependency"><path d="M440.58,549.65 C375.23,573.62 261.134,615.468 225.604,628.498" style="stroke:#181818;stroke-width:1;" fill="none" id="Revoked-to-*end*"/><polygon points="220.91,630.22,230.737,630.877,225.604,628.498,227.982,623.366,220.91,630.22" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Denied to *end*--><g class="link" data-entity-1="ent0006" data-entity-2="ent0013" id="lnk15" data-source-line="13" data-link-type="dependency"><path d="M101.08,472.32 C129.49,514.27 183.646,594.2 201.976,621.26" style="stroke:#181818;stroke-width:1;" fill="none" id="Denied-to-*end*"/><polygon points="204.78,625.4,203.044,615.705,201.976,621.26,196.421,620.192,204.78,625.4" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Expired to *end*--><g class="link" data-entity-1="ent0008" data-entity-2="ent0013" id="lnk16" data-source-line="14" data-link-type="dependency"><path d="M210.6,472.32 C210.6,513.48 210.6,590.2 210.6,618.81" st