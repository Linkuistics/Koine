828" fill="#526B86" style="stroke:#526B86;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1907.097" y="790.86" fill="#25364B" font-size="18" textLength="201.085" font-family="Helvetica">re-resolve the remainder;</text><text x="1925.088" y="808.86" fill="#25364B" font-size="18" textLength="165.103" font-family="Helvetica">focus, or unavailable</text><polygon points="1149.387,856,1139.387,860,1149.387,864,1145.387,860" fill="#526B86" style="stroke:#526B86;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1143.387" y1="860" x2="1899.097" y2="860" style="stroke:#526B86;stroke-width:1.2;stroke-dasharray:2,2;"/><text x="1336.662" y="853.86" fill="#25364B" font-size="18" textLength="365.159" font-family="Helvetica">result, or MachineError.unavailable(ref, detail)</text><polygon points="572.001,888,562.001,892,572.001,896,568.001,892" fill="#526B86" style="stroke:#526B86;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="566.001" y1="892" x2="1137.387" y2="892" style="stroke:#526B86;stroke-width:1.2;stroke-dasharray:2,2;"/><text x="786.167" y="885.86" fill="#25364B" font-size="18" textLength="127.055" font-family="Helvetica">result / rejection</text><polygon points="258.103,920,248.103,924,258.103,928,254.103,924" fill="#526B86" style="stroke:#526B86;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="252.103" y1="924" x2="560.001" y2="924" style="stroke:#526B86;stroke-width:1.2;stroke-dasharray:2,2;"/><text x="340.524" y="917.86" fill="#25364B" font-size="18" textLength="127.055" font-family="Helvetica">result / rejection</text><path d="M173.819,943 L173.819,1031 A6,6 0 0 0 179.819,1037 L1966.819,1037 A6,6 0 0 0 1972.819,1031 L1972.819,947 L1962.819,937 L179.819,937 A6,6 0 0 0 173.819,943" style="stroke:#B8C7D7;stroke-width:0.5;" fill="#F1F5F9"/><path d="M1962.819,937 L1962.819,944 A3,3 0 0 0 1965.819,947 L1972.819,947 L1962.819,937" style="stroke:#B8C7D7;stroke-width:0.5;" fill="#F1F5F9"/><text x="622.365" y="955.86" fill="#33475E" font-size="18" textLength="893.47" font-family="Helvetica">AGREED: a reference is a URI string, machine://&lt;provider>/&lt;remainder>; the engine routes by the authority and</text><text x="622.365" y="973.86" fill="#33475E" font-size="18" textLength="884.452" font-family="Helvetica">never interprets the remainder, which the provider re-resolves on every use holding no queried state for callers;</text><text x="622.365" y="991.86" fill="#33475E" font-size="18" textLength="851.889" font-family="Helvetica">the desktop remainder carries pid, window number and title because Modaliser's re-find needs the title as a</text><text x="622.365" y="1009.86" fill="#33475E" font-size="18" textLength="869.449" font-family="Helvetica">fallback. A root is a reference with an empty remainder. Nothing is cached by the engine, refreshed, retried or</text><text x="622.365" y="1027.86" fill="#33475E" font-size="18" textLength="207.07" font-family="Helvetica">made atomic across calls.</text><?plantuml-src fLVRRkCs47tNLn3fmyQ0xMpkMMUxXNDncs8lmIRxrFI1baOMQvbKIIgEkmZGh-c7zKjwI4gsP3ijsZvPvWpdSZYSENp5U1pV2vlJW7qg-AybCKqfQP8n6MOphSf9XbzYHJdEHSpk5mNTnLeKberLAHEk5rqs5pOeyOacIjW77cT24ejvdflebVDnHIRM0tQfP2ecfUPMACcucHg_BnNQs5x1jLsm8YydGh9KQI-Q2vcekM4g3HwA0c64xPfYfHFuuzRBSk89wJwxtsunLlAHj0qUXRIaUUpjG63f2JOKuwlqGrPOKCeo0ECITJ-2J2imJNa8fucM9YCIaW19YsH2NSPbuWKa9muPQ5fdH_d5XCpKge8LMZrYcmQYcOWpPqNbZvM_fHzdIfCjjJG8pqXUc0mXpZDba9UbcG7mMY-Q9-dsf8BonFJNpW3kX7EXaSkvTnGxGz8jl38DEApcZvGRLieuut82s86f09oKfXJRQg-QpPmlUgBOPvYgkCJXENHmIajhAq3gd27hjVAT4W3NL2XjXPp0BN_a8kVZ74ccZHDW6JTieYJreyXCXSIPynaRytWwqQv2BrMEKlfcT3OQZYuR6WcblCpj28V_aS-8_K1mRL5RstNkn6_4zi-s2oiV1yU79qSN3HMJSKJemazvRgWXgKBJ4fdl7pG45-hfbYU9szDQloCK7v3xGCRm2GrpCK7baYlZfiDAYtsD61jgd64Lsl71oSNPIRruZ_AQIbXY-_q3BBuNARr7NLwu-wIhBHTdbwTNfqtfEgRNrwEZqH0QjxXd8XO5btPJwMpqUdIsfjJqy-PiU7Lvs5RO17L3N1y8KegjqYsJgsozwCMGl7YRhsqeBrURtfyRu7zKTXEZqVxeUFHcNMiBpcsDHb27XqUdnzTHXbk2wwJiM3r5aNKz-p-tRBRRQj5i-Ftdw-khJXHn1mZxOf1kiOARxRHwn