"""
The koine-desktop/1 schema as composed from the core and the bundled desktop provider 1.0.2, pointer
and media, on an extension host. `task conformance` holds this tree's headless host to it. It is
`desktop-window-layout-schema-extension-host.graphql` (the desktop 1.0.1 composition, which stays as
it is) with the pointer position, the pointer nudge and the media keys added. The desktop part is
`desktop-pointer-media-schema.graphql`, verbatim, and it is never reworded. Root fields are declared
in composition order, the core's own and then desktop's, because the schema digest is taken over a
canonical text that keeps declared order.
"""
schema { query: Query mutation: Mutation }

"Opaque koine:// URI string. Pass it unchanged; only its provider interprets the remainder."
scalar Reference

"UTC instant with exactly six fractional second digits, captured from the process start time."
scalar DesktopProcessStart

input DesktopProcessIdentity {
  pid: Int!
  startedAt: DesktopProcessStart!
}

"A point in screen coordinates. The origin is the top-left corner of the primary display. The x value grows to the right, and the y value grows downward. A display to the left of the primary display or above it has negative coordinates."
input DesktopPointInput {
  x: Float!
  y: Float!
}

"A rectangle in screen coordinates: the position of its top-left corner, its width and its height. The width and the height are greater than zero."
input DesktopRectInput {
  x: Float!
  y: Float!
  width: Float!
  height: Float!
}

type Query {
  "Authenticated caller metadata. No provider capability required."
  koine: Koine!
  "Proof of the submitted secret, or its resulting active grant; own request only."
  koineGrantRequest: KoineGrantRequest
  "koine:manage. Never returns bearer credentials."
  koineManagement: KoineManagement
  "desktop:read. An absent process is ordinary null."
  desktopApplication(process: DesktopProcessIdentity!): DesktopApplication
  "desktop:read. A stale or wrong-kind reference raises unavailable."
  desktopApplicationByReference(ref: Reference!): DesktopApplication
  "desktop:read. A stale or wrong-kind reference raises unavailable."
  desktopWindow(ref: Reference!): DesktopWindow
  "desktop:read. Lists the windows of every application with a Dock icon, not only the captured application. Each application's current window list leaves out its windows on other Spaces. Rows with a known order come first, front to back. The other rows follow in no promised order. A desktop:read grant from an earlier Koine version has this reach too."
  desktopWindows: [DesktopWindowStacking!]!
  "desktop:read. Lists every active display, left to right by the x value of its frame, then top to bottom. A desktop:read grant from an earlier Koine version has this reach too."
  desktopDisplays: [DesktopDisplay!]!
  "desktop:read. Says whether this window is on top at this screen point. The answer is UNKNOWN when Koine cannot link the window to the window server's list. A stale or wrong-kind reference raises unavailable."
  desktopWindowOnTop(ref: Reference!, point: DesktopPointInput!): DesktopOnTop
  "desktop:read. Where the pointer is now, in screen coordinates. Null when Koine cannot establish the position, as can happen during a display change. Koine never invents a position. This read needs no Accessibility consent. A desktop:read grant from an earlier Koine version has this reach too."
  desktopPointer: DesktopPointer
}

type Mutation {
  "Anonymous enrollment only; cannot be mixed with other root actions."
  koineRequestGrant(input: KoineRequestGrantInput!): KoineGrantRequestReceipt
  "koine:manage. Approves only a subset of the immutable requested capabilities."
  koineApproveGrantRequest(requestId: ID!, capabilities: [String!]!): KoineGrant
  "koine:manage. Denies a pending request."
  koineDenyGrantRequest(requestId: ID!): KoineGrantRequest
  "koine:manage. Credential is returned once after durable creation."
  koineCreateGrant(input: KoineCreateGrantInput!): KoineCreatedGrant
  "koine:manage. Idempotent for an already revoked grant; never grants authority."
  koineRevokeGrant(grantId: ID!): KoineGrant
  "desktop:control. Focuses exactly this window or reports why it did not; never a substitute."
  desktopFocusWindow(ref: Reference!): DesktopFocusReceipt
  "desktop:control. Moves and resizes exactly this window to this frame, and never a substitute. It does not raise the window or activate its application. During the writes, it turns off the application's enhanced accessibility setting, and then it turns the setting on again. It writes again, up to seven more times in about 350 ms, until the size is within 20 points of the request. A stale or wrong-kind reference raises unavailable. A desktop:control grant from an earlier Koine version can do this too."
  desktopSetWindowFrame(ref: Reference!, frame: DesktopRectInput!): DesktopFrameReceipt
  "desktop:control. Focuses this display: it raises the front listed window there, activates its application and moves the pointer to the display's centre. With no window there, it only moves the pointer. It never clicks, and it never moves the pointer while a pointer button is held. A stale or wrong-kind reference raises unavailable. A desktop:control grant from an earlier Koine version can do this too."
  desktopFocusDisplay(ref: Reference!): DesktopDisplayFocusReceipt
  "desktop:control. Nudges the pointer: it moves the pointer one point to the right and back, with two mouse-moved events, so that a pointer that macOS hid becomes visible again. The pointer ends where it started. It never clicks, and it posts nothing while a pointer button is held. A desktop:control grant from an earlier Koine version can do this too."
  desktopNudgePointer: DesktopPointerNudgeReceipt
  "desktop:control. Posts one media key, down and then up, as the matching key of an Apple keyboard sends it. macOS sends PLAY_PAUSE, NEXT and PREVIOUS to the Now Playing app, which is often not the front app. With no Now Playing app, macOS can open Music for PLAY_PAUSE and bring it to the front, and NEXT and PREVIOUS do nothing. VOLUME_UP, VOLUME_DOWN and MUTE change the output volume of the Mac. No media key is a keystroke, and no media key types into the front app. A desktop:control grant from an earlier Koine version can do this too."
  desktopPostMediaKey(key: DesktopMediaKey!): DesktopMediaKeyReceipt
}

"All fields require desktop:read."
type DesktopApplication {
  ref: Reference!
  name: String!
  bundleIdentifier: String
  windows: [DesktopWindow!]!
}

"All fields require desktop:read."
type DesktopWindow {
  ref: Reference!
  title: String!
  observation: DesktopObservation!
  "The application that owns this window."
  application: DesktopApplication!
  "The position and size of the window in screen coordinates, as Accessibility reports them. Null when Koine cannot read them. Koine never invents a frame."
  frame: DesktopRect
}

"Control-authorized output; it does not expose read-protected window state."
type DesktopFocusReceipt {
  "The submitted target, under the mutation's control authority."
  ref: Reference!
}

enum DesktopObservation { CURRENT REMEMBERED }

"All fields require desktop:read. One row of the window list: a window with its order and visibility, both from one reading of the window server's list."
type DesktopWindowStacking {
  window: DesktopWindow!
  "The place of the window among the listed windows with a known order. The front window is 0. Null when the window is not on screen or Koine cannot establish its order."
  order: Int
  "Whether the window server shows the window on the current Space. A window on screen can still be covered by other windows."
  visibility: DesktopWindowVisibility!
}

"ON_SCREEN: the window server shows the window. OFF_SCREEN: the window is minimised, or its application is hidden. UNKNOWN: Koine cannot link the window to the window server's list. Never treat UNKNOWN as ON_SCREEN."
enum DesktopWindowVisibility { ON_SCREEN OFF_SCREEN UNKNOWN }

"ON_TOP: the bounds of the window in the window server's list contain the point, and no opaque window covers it there. NOT_ON_TOP: those bounds do not contain the point, another window covers it there, or the window is off screen. UNKNOWN: Koine cannot link the window to the window server's list. When the frame of the window is known, the bounds differ from it by 2 points at most."
enum DesktopOnTop { ON_TOP NOT_ON_TOP UNKNOWN }

"All fields require desktop:read. A rectangle in screen coordinates: the position of its top-left corner, its width and its height."
type DesktopRect {
  x: Float!
  y: Float!
  width: Float!
  height: Float!
}

"All fields require desktop:read."
type DesktopDisplay {
  "Names this display while it is active. Pass it unchanged."
  ref: Reference!
  "The whole display, in screen coordinates."
  frame: DesktopRect!
  "The display without the menu bar and the Dock, in screen coordinates. Null when Koine cannot establish it, as can happen during a display change. Koine never invents a visible frame."
  visibleFrame: DesktopRect
  "True for the primary display, whose top-left corner is the origin of screen coordinates."
  primary: Boolean!
}

"Control-authorized output; it does not expose read-protected window state. It says that the writes completed. It does not say that the window took the frame, because an application can limit its own size. Read the frame under desktop:read."
type DesktopFrameReceipt {
  "The submitted target, under the mutation's control authority."
  ref: Reference!
}

"Control-authorized output. It names no window."
type DesktopDisplayFocusReceipt {
  "The submitted display, under the mutation's control authority."
  ref: Reference!
  "What display focus did with the windows on the display."
  outcome: DesktopDisplayFocusOutcome!
  "True when the pointer moved to the centre of the display. False when a pointer button was held at the start or just before the move."
  pointerMoved: Boolean!
}

"WINDOW_FOCUSED: the front window took focus. NO_WINDOW: no listed window is on the display, so Koine raised nothing. FRONT_WINDOW_UNKNOWN: Koine cannot establish the front window there, so it raised nothing. POINTER_BUTTON_HELD: a pointer button was held at the start, so Koine did nothing. The pointerMoved field says whether the pointer moved."
enum DesktopDisplayFocusOutcome { WINDOW_FOCUSED NO_WINDOW FRONT_WINDOW_UNKNOWN POINTER_BUTTON_HELD }

"All fields require desktop:read."
type DesktopPointer {
  "The position of the pointer, in screen coordinates. Each value can have a fraction."
  location: DesktopPoint!
}

"All fields require desktop:read. A point in screen coordinates."
type DesktopPoint {
  x: Float!
  y: Float!
}

"Control-authorized output. It carries no pointer position: read the position under desktop:read."
type DesktopPointerNudgeReceipt {
  "What the nudge did."
  outcome: DesktopPointerNudgeOutcome!
}

"NUDGED: Koine posted both mouse-moved events. POINTER_BUTTON_HELD: a pointer button was held, so Koine posted nothing."
enum DesktopPointerNudgeOutcome { NUDGED POINTER_BUTTON_HELD }

"PLAY_PAUSE: play or pause. NEXT: the next track. PREVIOUS: the previous track, or the start of the current one, as the player decides. These three go to the Now Playing app. VOLUME_UP and VOLUME_DOWN: one step of the output volume. MUTE: switches the mute of the output on or off."
enum DesktopMediaKey { PLAY_PAUSE NEXT PREVIOUS VOLUME_UP VOLUME_DOWN MUTE }

"Control-authorized output. It says that Koine posted the key, down and then up. It does not say which app received the key or what changed, because macOS gives no public way to ask which app holds Now Playing."
type DesktopMediaKeyReceipt {
  "The submitted key, under the mutation's control authority."
  key: DesktopMediaKey!
}

type Koine {
  contractVersion: String!
  instanceId: String!
  "Equality token for the served schema; compare, do not interpret."
  schemaDigest: String!
  "Caller only; null only for the non-exportable in-process console principal."
  ownGrant: KoineGrant
  "Names available to request. Listing them supplies no authority."
  availableCapabilities: [String!]!
}

input KoineRequestGrantInput {
  clientLabel: String!
  "Canonical lower-case SHA-256 hex digest of a 32-byte random bearer secret."
  credentialDigest: String!
  capabilities: [String!]!
}

input KoineCreateGrantInput {
  clientLabel: String!
  capabilities: [String!]!
}

type KoineGrantRequestReceipt {
  requestId: ID!
  comparisonCode: String!
}

type KoineGrantRequest {
  requestId: ID!
  clientLabel: String!
  comparisonCode: String!
  requestedCapabilities: [String!]!
  state: KoineGrantRequestState!
  "Present only after approval; scoped to this request."
  grant: KoineGrant
}

enum KoineGrantRequestState { PENDING APPROVED DENIED EXPIRED }

type KoineGrant {
  grantId: ID!
  clientLabel: String!
  capabilities: [String!]!
  state: KoineGrantState!
}

enum KoineGrantState { ACTIVE REVOKED }

type KoineCreatedGrant {
  grant: KoineGrant!
  "One-time 32-byte random bearer secret encoded as unpadded base64url."
  credential: String!
}

"All fields require koine:manage."
type KoineManagement {
  requests: [KoineGrantRequest!]!
  grants: [KoineGrant!]!
  providers: [KoineProviderStatus!]!
  "Read on each request. Reading never asks the user for consent."
  osPermissions: [KoineOSPermission!]!
  "What a person must be told about each capability's reach wherever it is granted or reviewed, one entry per capability that has a disclosure and whether or not its provider is active. Show it beside the capability in grant creation, request approval and the grant list. Serving it supplies no authority."
  capabilityDisclosures: [KoineCapabilityDisclosure!]!
}

type KoineProviderStatus {
  provider: String!
  version: String!
  schemaVersion: String!
  state: KoineProviderState!
  diagnostic: String
  "Opaque identity of origin plus canonical installed bundle location, unique within this startup. Null only for a synthetic row. Not a resource reference."
  candidateId: String
  "Where the bundle is physically installed. Null for a synthetic row; never inferred from composition position."
  origin: KoineProviderOrigin
  "Whether this candidate is the frozen choice for its provider identity. Synthetic rows are UNAVAILABLE."
  selection: KoineProviderSelection
  "The frozen choice for the same provider identity, or null if there is none. A selected row points to itself, even after a later failure."
  selectedCandidateId: String
  "Stable, open diagnostic code for a refusal or selection explanation. Null for a healthy selected row with nothing competing or missing."
  reason: String
}

enum KoineProviderState { ACTIVE INCOMPATIBLE REJECTED FAILED }

enum KoineProviderOrigin { BUNDLED PER_USER }

enum KoineProviderSelection { SELECTED NOT_SELECTED UNAVAILABLE }

type KoineOSPermission {
  permission: String!
  owner: String!
  granted: Boolean!
}

type KoineCapabilityDisclosure {
  "The capability name, as listed in availableCapabilities and held by grants."
  capability: String!
  "Plain text stating the capability's reach, including any other capability it needs."
  disclosure: String!
}
