# Native discovery design; not served or native-accepted yet.
# All Query roots and reachable fields: workspace:read.
# Prepare: workspace:control; reveal and every result field:
# workspace:control AND desktop:control. Objects never cross these sets:
# permissions attach to field coordinates, not their root context.
# Shared enums have no resolver fields. No control implies read.

"""Inspect sources, uncertainty and independent GraphQL errors together."""
enum WorkspaceDiscoveryStatus { AVAILABLE PARTIAL UNKNOWN BLOCKED UNAVAILABLE FAILED }
enum WorkspaceDiscoveryAvailability { AVAILABLE BLOCKED UNAVAILABLE UNKNOWN }
enum WorkspaceDiscoveryCompleteness { COMPLETE PARTIAL UNKNOWN }
enum WorkspaceDiscoverySource { FOUNDATION_LOCATIONS INDEXED_APPS RUNNING_APPS REGISTRATION SETTINGS_RUNTIME }
enum WorkspaceDiscoveryReason {
  NO_NATIVE_VALUE PROMPT_RISK TARGET_NOT_RUNNING TARGET_CHANGED SOURCE_UNAVAILABLE
  SETUP_UNSUPPORTED INSPECTION_FAILED CHANGED_DURING_DISCOVERY UNREPRESENTABLE_VALUE
  METADATA_UNKNOWN ENTRY_LIMIT CALL_LIMIT VALUE_LIMIT DIAGNOSTIC_LIMIT TIME_LIMIT CAPACITY_LIMIT
}
enum WorkspaceDiscoveryConsent { UNKNOWN }
enum WorkspaceDiscoveryPermission { AUTOMATION PROMPT_RISK }
enum WorkspaceSettingsEvent { READ REVEAL }
type WorkspaceDiscoveryPermissionHint {
  permission: WorkspaceDiscoveryPermission!
  """Fixed target com.apple.systempreferences for Automation; established target or declared source otherwise."""
  target: String!
  event: WorkspaceSettingsEvent
  consent: WorkspaceDiscoveryConsent!
}
type WorkspaceDiscoveryDiagnostic {
  source: WorkspaceDiscoverySource!
  reason: WorkspaceDiscoveryReason!
  """Only an independently identified location/pane; never parsed from error text."""
  subject: String
  affectsCoverage: Boolean!
  guidance: String!
  permission: WorkspaceDiscoveryPermissionHint
}
type WorkspaceDiscoveryCoverage {
  source: WorkspaceDiscoverySource!
  declaredDomain: String!
  availability: WorkspaceDiscoveryAvailability!
  """Completeness of checked finite observations, not atomicity or internal health."""
  observations: WorkspaceDiscoveryCompleteness!
  """UNKNOWN for app/settings inventory and filesystem contents of starting values."""
  category: WorkspaceDiscoveryCompleteness!
  examined: Int!
  diagnostics: [WorkspaceDiscoveryDiagnostic!]!
}
enum WorkspaceLocationKind { HOME DESKTOP DOCUMENTS DOWNLOADS MOVIES MUSIC PICTURES APPLICATIONS }
enum WorkspaceLocationDomain { USER LOCAL SYSTEM }
input WorkspaceLocationRequest { kind: WorkspaceLocationKind! domain: WorkspaceLocationDomain! }
type WorkspaceSpecialLocation {
  kind: WorkspaceLocationKind!
  domain: WorkspaceLocationDomain!
  """UID of Koine's account, not the client's account."""
  accountIdentifier: String!
  """OS-known absolute local value; no existence, access, listing or consent guarantee."""
  location: String!
  contentsAvailability: WorkspaceDiscoveryAvailability!
  sources: [WorkspaceDiscoverySource!]!
}
enum WorkspaceApplicationInstallationState { INSTALLED UNREGISTERED UNKNOWN }
enum WorkspaceApplicationActivationPolicy { REGULAR ACCESSORY PROHIBITED UNKNOWN }
enum WorkspaceApplicationMetadataSource { BUNDLE_RESOURCE INDEXED_ITEM }
type WorkspaceApplicationChoice {
  """Checked bundle-directory identity; first finalized resolved spelling. No query-long identity pin or later actionability guarantee."""
  applicationPath: String!
  name: String
  bundleIdentifier: String
  """Source of checked type and optional name/identifier. INDEXED_ITEM is an actual returned fixed-query tuple, not current plist or index-to-inode proof; its installationState stays UNKNOWN."""
  metadataSource: WorkspaceApplicationMetadataSource!
  """INSTALLED uses the existing constrained action's ordered registered-list plus preferred-only identity procedure. Negative facts need separate checked evidence; later actions revalidate."""
  installationState: WorkspaceApplicationInstallationState!
  """Explicit Boolean LSUIElement declaration from admitted Bundle metadata; missing/malformed/unavailable or INDEXED_ITEM stays null, never inferred false."""
  uiElement: Boolean
  """Explicit Boolean LSBackgroundOnly declaration; no universal user-facing-app classification."""
  backgroundOnly: Boolean
  """Unique observed policies from running objects associated with this copy identity. Empty means none observed; UNKNOWN means unmapped native value. No prediction for a stopped app."""
  runningActivationPolicies: [WorkspaceApplicationActivationPolicy!]!
  sources: [WorkspaceDiscoverySource!]!
}
type WorkspaceSettingsAnchor {
  """Exact native anchor selector within its pane; never normalized or used as script text."""
  name: String!
  availability: WorkspaceDiscoveryAvailability!
}
type WorkspaceSettingsPane {
  paneId: String!
  name: String
  """UNKNOWN when the runtime supplies no explicit hardware/account availability fact."""
  availability: WorkspaceDiscoveryAvailability!
  """Positive exact keys only; no lazy-completeness promise. Empty/refused/failed/unestablished observations remain null under the current source, never [] from response stability."""
  anchors: [WorkspaceSettingsAnchor!]
  sources: [WorkspaceDiscoverySource!]!
}
type WorkspaceSpecialLocationsResult {
  status: WorkspaceDiscoveryStatus!
  """Frozen list for AVAILABLE/PARTIAL; otherwise null. FAILED raises failed at each selected items alias; BLOCKED/UNAVAILABLE/UNKNOWN give ordinary null."""
  items: [WorkspaceSpecialLocation!]
  sources: [WorkspaceDiscoveryCoverage!]!
  resultsTruncated: Boolean!
}
type WorkspaceApplicationsResult {
  status: WorkspaceDiscoveryStatus!
  items: [WorkspaceApplicationChoice!]
  sources: [WorkspaceDiscoveryCoverage!]!
  resultsTruncated: Boolean!
}
type WorkspaceSettingsResult {
  status: WorkspaceDiscoveryStatus!
  items: [WorkspaceSettingsPane!]
  sources: [WorkspaceDiscoveryCoverage!]!
  resultsTruncated: Boolean!
}
input WorkspaceSettingSelection { paneId: String! anchorName: String }
enum WorkspaceSettingsActionStatus { AVAILABLE BLOCKED DEPENDENCY_UNAVAILABLE }
enum WorkspaceSettingsDependencyReason { TARGET_UNAVAILABLE TARGET_NOT_RUNNING SELECTION_UNAVAILABLE }
type WorkspaceSettingsPreparationDependency { reason: WorkspaceSettingsDependencyReason! guidance: String! }
type WorkspaceSettingsRevealDependency { reason: WorkspaceSettingsDependencyReason! guidance: String! }
enum WorkspaceSettingsReadiness { RUNNING }
type WorkspaceSettingsPreparationProcess { pid: Int! startedAt: String! }
type WorkspaceSettingsRevealProcess { pid: Int! startedAt: String! }
type WorkspaceSettingsPreparationDiagnostic {
  source: WorkspaceDiscoverySource!
  reason: WorkspaceDiscoveryReason!
  subject: String
  affectsCoverage: Boolean!
  guidance: String!
}
type WorkspaceSettingsRevealPermissionHint {
  permission: WorkspaceDiscoveryPermission!
  target: String!
  event: WorkspaceSettingsEvent
  consent: WorkspaceDiscoveryConsent!
}
type WorkspaceSettingsRevealDiagnostic {
  source: WorkspaceDiscoverySource!
  reason: WorkspaceDiscoveryReason!
  subject: String
  affectsCoverage: Boolean!
  guidance: String!
  permission: WorkspaceSettingsRevealPermissionHint
}
type WorkspaceSettingsPreparationReceipt {
  launchRequested: Boolean!
  """Process is validated and running; this is not catalogue or Automation readiness."""
  readiness: WorkspaceSettingsReadiness!
  process: WorkspaceSettingsPreparationProcess
}
type WorkspaceSettingsPreparationResult {
  status: WorkspaceSettingsActionStatus!
  receipt: WorkspaceSettingsPreparationReceipt
  dependency: WorkspaceSettingsPreparationDependency
  diagnostics: [WorkspaceSettingsPreparationDiagnostic!]!
}
type WorkspaceSettingsRevealReceipt {
  paneId: String!
  anchorName: String
  revealAcknowledged: Boolean!
  activationRequested: Boolean!
  process: WorkspaceSettingsRevealProcess
}
type WorkspaceSettingsRevealResult {
  status: WorkspaceSettingsActionStatus!
  receipt: WorkspaceSettingsRevealReceipt
  dependency: WorkspaceSettingsRevealDependency
  diagnostics: [WorkspaceSettingsRevealDiagnostic!]!
}
extend type Query {
  """Value-only Foundation lookup; null/omitted defaults to ten named pairs. Explicit nonempty unique requests <=10; HOME/Desktop/Documents/Downloads/Movies/Music/Pictures USER only; APPLICATIONS USER/LOCAL/SYSTEM. Never lists or inspects contents. All reachable fields require workspace:read."""
  workspaceSpecialLocations(requests: [WorkspaceLocationRequest!]): WorkspaceSpecialLocationsResult
  """Fixed indexed-local app category plus running and per-identifier registration supplements. Complete bounded population staging; shared population count/call/copy/deadline overflow yields FAILED/null items, never a native-order prefix. Clients filter/rank with nullable bundle declarations and observed running policies; no helper/agent suppression. No arbitrary roots/query, raw walk, all-disk completeness, implicit launch/setup or default-handler lookup. Checked same-identity observations merge; equal identifiers never merge copies. All reachable fields require workspace:read."""
  workspaceApplications: WorkspaceApplicationsResult
  """All positive runtime pane/anchor observations of a validated already-running System Settings target: two ID-associated core/getd pALL/anchor sweeps, 100 ms minimum gap within three seconds, exact no-prompt preflight/send. Lazy completeness stays UNKNOWN even for equal maps; positive choices PARTIAL, empty panes UNKNOWN/null, empty anchors null. Global owned-limit/deadline overflow FAILED/null, never a prefix. No launch/loading/activation/reveal/setup. All exposed choices and ordinary witnesses remain native qualification obligations. All reachable fields require workspace:read."""
  workspaceSettings: WorkspaceSettingsResult
}
extend type Mutation {
  """workspace:control throughout; no catalogue data. One background launch if stopped (activates=false); none if already running. Three-second/core wait; ambiguous late effects never replay. Does not request consent or reveal."""
  workspacePrepareSettings: WorkspaceSettingsPreparationResult
  """workspace:control AND desktop:control throughout. Exact paneId/optional anchorName 1...512 UTF8 bytes, no NUL/control characters/normalization. Re-resolve then no-prompt misc/mvis and fixed-bundle openApplication(activates=true). No implicit preparation/setup/URL construction; exit during submission can relaunch the target. Callback incarnation is revalidated. Acknowledgment is no visible-destination guarantee. Three-second/core wait; never replay ambiguous effects."""
  workspaceRevealSetting(selection: WorkspaceSettingSelection!): WorkspaceSettingsRevealResult
}
