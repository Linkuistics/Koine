# Designed additive workspace search contribution; not served behavior.
# Every root and every reachable output field requires workspace:read only.
# Compose after workspace-schema.graphql; no foreign provider type is imported.
# Resolution/policy/spelling/name design requires review before classification design/review and whole-resource review/planning; serviceability construction is specified.
# Their load-bearing review is required before implementation planning.
# Native-size groups, worker ownership and policy witnesses await native acceptance.
# Pre-open bootstrap/target-alias metadata needs a decision and returned witness design.
# No new calls or systematic home loss are selected; refused registration targets prevent negatives.
# Typed BLOCKED transport is reviewed; runtime/binary acceptance remains pending.
# Native/default coverage and the protected-home baseline remain unaccepted.
# Delegated requirements choices select reported native-result meaning and empirical evidence;
# opaque internals remain unproved; allocation design is finalized; instruments/subjects, review and native acceptance remain pending.

"""Requires workspace:read throughout. AVAILABLE has matches only; DEPENDENCY_UNAVAILABLE has dependency only; BLOCKED/FAILED withhold matches. With no progress, native/identity inspection failure or work/resource refusal precedes prompt risk, which precedes pure absence/exclusion. CHANGED_DURING_SEARCH contributes failure; uncertain anchor resolution is INSPECTION_FAILED unless absence/exclusion is established. BLOCKED returns null matches/dependency without a search-generated error, including matches aliases; consent is UNKNOWN, never observed absent. FAILED raises failed at each selected matches alias. Error-free coverage-only selections retain the same status/diagnostics. All branch invariants are subject to execution errors at or above selected fields, including lifecycle and publication; inspect errors and every root's coverage."""
enum WorkspaceSearchStatus {
  AVAILABLE
  BLOCKED
  DEPENDENCY_UNAVAILABLE
  FAILED
}

"""Coverage of the declared visible-name domain, never an atomic filesystem snapshot. Intrinsic hidden/package/symlink-descendant exclusions remain explicit."""
enum WorkspaceSearchCoverageState {
  COMPLETE
  PARTIAL
  UNKNOWN
}

"""SUBTREE covers every eligible name only when the root is COMPLETE. OBSERVED_DESCENDANTS asserts only counted entry/EOF observations somewhere beneath the root, never a complete listing or identifiable subset. One searched record after progress, zero before."""
enum WorkspaceSearchScopeExtent {
  SUBTREE
  OBSERVED_DESCENDANTS
}

"""ENTRY is one uncertain/omitted entry; SUBTREE is a named wholly skipped descendant scope. CHILD_GROUP counts encountered invalid/overlong-name child anchors of the actual representable parent: UNREPRESENTABLE_NAME or known native/public path-size VALUE_LIMIT omit anchors and descendants only when candidate-location unrepresentability is established; native descent-only refusal does not itself omit a representable name. DESCENDANT_GROUP counts intrinsic anchors or DEPTH_LIMIT/FRONTIER_LIMIT directory anchors under the root; bound-driven anchor names remain matchable, descendants are omitted. Neither group means all children/descendants. REMAINDER is unfinished work with or without progress, including unopened roots/tails/queued or held-stream work/metadata; established observations and diagnosed depth/frontier omissions are excluded. It never claims the whole root was skipped or a known-size domain. Its anchor is the resolved root if established within bounds, otherwise the representable requested root. No-progress stops have UNKNOWN coverage and no searched record."""
enum WorkspaceSearchSkippedExtent {
  ENTRY
  SUBTREE
  CHILD_GROUP
  DESCENDANT_GROUP
  REMAINDER
}

"""Only HIDDEN, PACKAGE_CONTENTS, SYMLINK_DESCENDANTS, SPECIAL_FILE and OPTIONAL_ROOT_ABSENT are intrinsic exclusions; all others affect coverage. Intrinsic anchors and affecting DEPTH_LIMIT/FRONTIER_LIMIT anchors aggregate separately per root/reason; depth and frontier each have one reserved record. CHILD_GROUP is limited to UNREPRESENTABLE_NAME/known native/public path-size VALUE_LIMIT at the actual representable parent. Other exceptions identify an exact entry/subtree or root remainder. Breadth-first queue overflow diagnoses omitted descent and continues sibling-name examination."""
enum WorkspaceSearchSkipReason {
  HIDDEN
  PACKAGE_CONTENTS
  SYMLINK_DESCENDANTS
  SPECIAL_FILE
  PROMPT_RISK
  CLOUD_SCOPE
  UNSUPPORTED_SCOPE
  UNSUPPORTED_VOLUME
  MOUNT_BOUNDARY
  ROOT_NOT_FOUND
  OPTIONAL_ROOT_ABSENT
  ROOT_NOT_DIRECTORY
  ACCESS_DENIED
  """Native/identity uncertainty or resource inspection failure. Pre-turn admission/policy anchor-account refusal yields every root UNKNOWN, zero counts, no searched scopes and requested-path REMAINDER; no policy witness is discarded."""
  INSPECTION_FAILED
  """Observed identity/mount change refuses inspection. With no root progress this contributes FAILED, including alongside PROMPT_RISK; after progress it affects AVAILABLE coverage."""
  CHANGED_DURING_SEARCH
  UNREPRESENTABLE_NAME
  """Encountered ordinary directory anchors at depth 32: each anchor increments one affecting root DESCENDANT_GROUP, including an empty directory whose EOF is unobserved; names remain matchable, only descendants are omitted."""
  DEPTH_LIMIT
  """One reserved affecting root DESCENDANT_GROUP counts encountered ordinary directory anchors below depth 32 whose descent task cannot fit the 512-task/384 KiB traversal account. Names remain matchable; only descendants are omitted, even if physically empty. Continue the parent listing, never evict/retry a task. Depth precedes frontier; one anchor cannot enter both groups."""
  FRONTIER_LIMIT
  ENTRY_LIMIT
  """Coverage record-count or total-byte partition exhausted: root REMAINDER preserves earlier diagnostics. Fixed guidance identifies which account; record count wins if both fail."""
  DIAGNOSTIC_LIMIT
  """Known public/native path-size refusal, never total diagnostic room or uncertain lookup. An established unrepresentable candidate location can use actual-parent CHILD_GROUP before finalization; the native buffer limit alone is not name-omission evidence. Native fsgetpath uses 8192 bytes including NUL; directory text needing 8192 bytes cannot fit, while joined ordinary file locations can use the unchanged public 8192-byte value bound. A root size refusal uses requested-path REMAINDER and null resolvedPath. ENOSPC alone is size evidence, not movement. A failed shared prefix/parent check stops one root; independent final-target failure beneath an established unchanged parent is exact SUBTREE and checked-link failure is per-candidate ENTRY. Use CHANGED_DURING_SEARCH only with independent change evidence, otherwise INSPECTION_FAILED. Native descent refusal alone does not omit a representable directory/package name; queued ordinary descent ENOSPC under unchanged parent/association uses VALUE_LIMIT SUBTREE at the listed location, null count and descent-only guidance, preserving the name with no inferred result truncation. Depth-32/package no-descent cases make no child canonical call. No retroactive name-omitting group."""
  VALUE_LIMIT
  """Wait expired: REMAINDER even before progress or while the first listing blocks. No-progress coverage is UNKNOWN with no searched record."""
  TIME_LIMIT
  """Atomic worker/descriptor admission refused: all requested-root REMAINDERs, UNKNOWN/no searched records. At soft limit 256 a fifth maximum-root job is worker-refused; descriptors can bind below 200. If refreshed search allowance falls below summed surviving job reservations, latch refusal until cohort cleanup/fresh admission, preserving progress/frozen results even if the limit rises. Guidance distinguishes busy admission from inspections disabled by lower-limit/resource refusal; an indefinitely blocked cohort requires process restart. Native resource failure is INSPECTION_FAILED."""
  CAPACITY_LIMIT
}

enum WorkspaceSearchPermissionKind { PERMISSION }
enum WorkspaceSearchPermissionClass { OS_PERMISSION }
enum WorkspaceSearchPermissionOwner { KOINE }
enum WorkspaceSearchPermissionReason { PROMPT_RISK }
enum WorkspaceSearchConsentState { UNKNOWN }

"""Requires workspace:read. Known traversal prompt risk, not observed denial or proof of absent consent. No new consent identifier or setup is approved."""
type WorkspaceSearchPermission {
  kind: WorkspaceSearchPermissionKind!
  permissionClass: WorkspaceSearchPermissionClass!
  permissionOwner: WorkspaceSearchPermissionOwner!
  permissionReason: WorkspaceSearchPermissionReason!
  """Canonical blocked scope derived from canonical-home components without opening excluded directories, or requested absolute scope when unresolved."""
  permissionTarget: String!
  """Null in this design. Never Accessibility or an invented Files and Folders consent identifier."""
  osPermission: String
  consentState: WorkspaceSearchConsentState!
}

"""Requires workspace:read. Root observation summary. SUBTREE only for COMPLETE eligible-domain coverage; OBSERVED_DESCENDANTS conveys counts without a traversal history."""
type WorkspaceSearchScope {
  path: String!
  extent: WorkspaceSearchScopeExtent!
}

"""Requires workspace:read. A bounded exclusion or unknown remainder, including synthetic policy scopes that assert no existence."""
type WorkspaceSearchSkippedScope {
  """Exact entry/subtree, representable group parent, intrinsic group root, or root remainder anchor; never a fabricated undecodable child."""
  path: String!
  extent: WorkspaceSearchSkippedExtent!
  """Positive observed anchor count exactly for CHILD_GROUP/DESCENDANT_GROUP; null otherwise. Does not count omitted descendants or predict an unread tail."""
  count: Int
  reason: WorkspaceSearchSkipReason!
  affectsCoverage: Boolean!
  """Non-null exactly for PROMPT_RISK absent execution errors at or above this field; native access denial with unknown consent cause is not this object."""
  permission: WorkspaceSearchPermission
  """Human explanation and recovery. Do not execute guidance as a command or trigger a read to acquire consent."""
  guidance: String!
}

"""Requires workspace:read. Exactly one per effective root, in input order, including missing, duplicate and never-scheduled roots. Positively absent optional home Applications/Cryptex defaults: COMPLETE, zero entries, no searched scopes, OPTIONAL_ROOT_ABSENT with affectsCoverage false; no progress. Explicit missing roots remain UNKNOWN/ROOT_NOT_FOUND."""
type WorkspaceSearchRootCoverage {
  rootIndex: Int!
  requestedPath: String!
  """Filesystem-reported root path from the same directory-path operation as admitted anchors/frames/bundles; firmlink aliases can share this spelling; cached vnode names can vary. Same-identity byte differences alone are not movement or failure. Preliminary link resolution is not returned canonicalization. Null does not mean absent."""
  resolvedPath: String
  state: WorkspaceSearchCoverageState!
  examinedEntries: Int!
  """Listings that reached EOF, including empty directories; not proof of unchanged/fully classified contents."""
  completedDirectories: Int!
  searched: [WorkspaceSearchScope!]!
  skipped: [WorkspaceSearchSkippedScope!]!
}

enum WorkspaceSearchDependencyReason { NO_SEARCHABLE_ROOT }

"""Requires workspace:read. Every root is absent, not a directory or unsupported/excluded by the declared domain. Exact reasons remain in coverage; never an index-health inference."""
type WorkspaceSearchDependency {
  reason: WorkspaceSearchDependencyReason!
  guidance: String!
}

"""INSTALLED is a checked present application with a nonblank reported identifier registered at its native file identity. UNREGISTERED means the checked native service observation reported no registration for that identity: only the exact verified not-found branch or fully checked nonempty no-error array, without a conflicting preferred observation, can establish it. An undetected internal failure or stale service state can produce a false negative; this is reported observation, not internal-health proof. Nil identifier and malformed/errorful/incomplete/blocked/conflicting results remain UNKNOWN with affecting coverage; observed resource errors refuse negatives. UNREGISTERED/UNKNOWN remain reveal/copy candidates and cannot form a launch choice. Known incorrect witnesses and all-UNKNOWN configured launch coverage still fail acceptance. Allocation design is finalized; instrument/subject construction is specified; execution, review and native/binary acceptance remain pending."""
enum WorkspaceSearchInstallationState {
  INSTALLED
  UNREGISTERED
  UNKNOWN
}

"""Requires workspace:read. A location observation, using the checked canonical target spelling, not a process incarnation or resource reference. Pass both known identifier and path to the existing constrained launch input; actions revalidate. The search ceiling does not establish actionability: actions resolve the location themselves and, in v1, refuse with failed any extant location whose spelling is PATH_MAX (1,024) bytes or more, not counting its NUL, without dropping or rewriting it. Never drop the selected path."""
type WorkspaceApplicationMatch {
  applicationPath: String!
  """Observed final filename including extension, of the canonical bundle target, never a link alias name; no localized display-name or icon lookup."""
  name: String!
  bundleIdentifier: String
  installationState: WorkspaceSearchInstallationState!
  """Ascending roots that observed this matching native bundle identity. Checked-link/direct routes merge into one canonical target choice; equal identifiers do not merge distinct copies. Under stable reported spelling/identity, fixed rank preserves all observed membership for final choices; cached variants retain the first finalized spelling while retained, with no discarded-identity history; no membership is inferred from unexamined roots. Changing filesystems retain the spec's observation limits."""
  rootIndices: [Int!]!
}

enum WorkspaceSearchFileKind {
  FILE
  DIRECTORY
  PACKAGE
  APPLICATION
  ALIAS
  SYMLINK
  UNKNOWN
}

"""ELIGIBLE is only the current metadata payload check, not handler availability or future readability. REFUSED items can be revealed/copied. UNKNOWN never proves executable content."""
enum WorkspaceSearchOpenDisposition {
  ELIGIBLE
  REFUSED
  UNKNOWN
}

enum WorkspaceSearchDefaultHandlerState { UNKNOWN }

"""Requires workspace:read. A known installed app selector shape, not an input object or authority grant. Search does not populate defaultApplication in this design."""
type WorkspaceSearchApplicationSelector {
  bundleIdentifier: String!
  applicationPath: String!
}

"""Requires workspace:read. A selectable location, not a pinned file identity. Symlinks/aliases are names only; descendant symlinks are never traversed."""
type WorkspaceFileMatch {
  """Canonical parent directory path plus the lossless observed entry name; final symlink/alias targets are not resolved. Firmlink-alias roots deduplicate equal returned locations. Values through 8192 bytes do not establish open/reveal support: in v1 an action refuses an extant location whose spelling is PATH_MAX (1,024) bytes or more, not counting its NUL, with failed, never as absence. The location stays returned and copyable; no shorter search ceiling applies."""
  path: String!
  name: String!
  kind: WorkspaceSearchFileKind!
  """Native type identifier when obtained prompt-free; no contents are read. Null is unknown, not proof of no type."""
  contentType: String
  openDisposition: WorkspaceSearchOpenDisposition!
  """Always UNKNOWN: no document default-handler lookup or type-only fallback occurs in search."""
  defaultHandlerState: WorkspaceSearchDefaultHandlerState!
  """Always null in this design, never evidence of NO_DEFAULT_HANDLER."""
  defaultApplication: WorkspaceSearchApplicationSelector
  defaultHandlerGuidance: String!
  rootIndices: [Int!]!
}

"""Requires workspace:read throughout. Coverage survives a search-generated FAILED matches error; other execution errors can suppress fields through normal propagation. Absent execution errors at or above selected fields, BLOCKED is typed policy data with null matches/dependency, false resultsTruncated and no search-generated error; all roots have no progress, with UNKNOWN coverage except absent optional defaults' COMPLETE empty domain. No error-free result has both matches and dependency. Status never overrides field/lifecycle/publication errors."""
type WorkspaceApplicationSearchResult {
  status: WorkspaceSearchStatus!
  """Non-null exactly for AVAILABLE absent execution errors at or above this field. BLOCKED and DEPENDENCY_UNAVAILABLE return ordinary null without a search-generated error; FAILED raises failed here, separately at every selected alias. Read the frozen root result without another native inspection. A stopped provider can return unavailable here even beside surviving BLOCKED status. Lifecycle/publication errors retain original paths and normal null propagation. Native absence is not encoded as an empty successful list."""
  matches: [WorkspaceApplicationMatch!]
  coverage: [WorkspaceSearchRootCoverage!]!
  dependency: WorkspaceSearchDependency
  """At least one finalized matching application identity omitted by count/path-value bounds; duplicate discovery routes do not count; fixed 16 KiB match slots prevent metadata-size ranking changes. Independent of per-root traversal coverage."""
  resultsTruncated: Boolean!
}

"""Requires workspace:read throughout. Empty AVAILABLE may be partial; inspect coverage and errors. Absent execution errors at or above selected fields, BLOCKED is error-free typed policy data with null matches/dependency, false resultsTruncated and no progress; UNKNOWN coverage except absent optional defaults' COMPLETE empty domain. FAILED carries no list and errors at selected matches. Status never overrides field/lifecycle/publication errors."""
type WorkspaceFileSearchResult {
  status: WorkspaceSearchStatus!
  """Non-null exactly for AVAILABLE absent execution errors at or above this field. BLOCKED and DEPENDENCY_UNAVAILABLE return ordinary null without a search-generated error; FAILED raises failed here at every selected alias. No nested selection schedules native work. A stopped provider can return unavailable here even beside surviving BLOCKED status. Lifecycle/publication errors retain original paths and normal null propagation."""
  matches: [WorkspaceFileMatch!]
  coverage: [WorkspaceSearchRootCoverage!]!
  dependency: WorkspaceSearchDependency
  resultsTruncated: Boolean!
}

extend type Query {
  """Requires workspace:read only, including every result field. Literal substring of the metadata-resolved canonical bundle filename or stem (also for checked .app links) after removing one terminal .app (ASCII case-insensitive); rank by the better exact/prefix/substring tier. NFC normalization, en_US_POSIX case/diacritic folding, NFC again; canonical equivalents must match. Query at most 256 UTF-8 bytes, no NUL; empty matches all. Default application roots are /Applications, /System/Applications, Koine-home Applications, /System/Library/CoreServices and /System/Cryptexes/App/System/Applications. Ordinary folders are traversed; visible .app links receive checked target metadata only, never target traversal. Fixed presentation-region/Preboot mount admission permits local APFS read-write or read-only without admitting arbitrary Preboot or file-search roots. Stable reported target spelling permits route-independent rank; retained native identities keep their first finalized spelling; native bundle identity merges links/direct paths while distinct installations sharing an identifier stay distinct. Per-root FIFO breadth-first work finishes shallower admitted listings before deeper ones. One current stream/root and a 512-task/384 KiB traversal account have separate reserved depth/frontier groups; both count matchable anchors, not descendants, and frontier rejection continues sibling examination. Atomic process-wide worker/descriptor admission reserves roots + 2 credits/job from min(72, max(0, soft limit minus 128)), with no limit change. Pre-open mount/symlink witnesses and replay/current-prefix size phases require producer repairs and mandatory reviews before long-path classification design/review, then whole-resource review/planning. Serviceability instrument/subject construction is specified; normally launched serviceability acceptance remains pending. Errorless empty/nil metadata cannot establish positive absence. Registration and other native facts have the selected reported-observation meaning; undetected incorrect results remain possible, while malformed/incomplete results and known incorrect witnesses cannot pass. Empirical serviceability evidence leaves opaque internals unproved. Roots/frames/bundles require one filesystem-reported spelling with no fallback. Held-descriptor identity self-comparison does not detect movement; first unassociated observations lack an independent movement detector. Retained application identities keep their first finalized reported spelling; same-identity byte differences alone are neither movement nor failure; actual firmlink/case/Unicode behavior awaits signed-host acceptance. Native witness errors affect dependent roots; witness-account overflow is job-wide. Independent root budgets do not guarantee syscall duration or exhaustive inventory. Supplied roots replace defaults (1...16 literal absolute local paths, at most 4096 bytes each). Positively absent optional home/Cryptex defaults have COMPLETE empty-domain coverage; explicit missing roots do not. Non-null limit is 1...200, default 50. No Spotlight or consent probing. No exhaustive installed-app inventory or MRU. A three-second wait can return partial coverage; the core deadline may answer first. Protected traversal is blocked before descent; pre-policy native link resolution into sensitive Library targets has no measured prompt-free guarantee and requires actual-call acceptance."""
  workspaceSearchApplications(query: String!, roots: [String!], limit: Int = 50): WorkspaceApplicationSearchResult
  """Requires workspace:read only, including every result field. Literal substring of full filename including extension, NFC normalization, en_US_POSIX case/diacritic folding, NFC again; canonical equivalents must match. Same input lengths, root and limit rules as application search; omitted/null roots use Koine's home. Ordinary local startup-volume roots only, with hidden/package/symlink-descendant exclusions and explicit protected/cloud/mount/bound diagnostics. Home cannot be COMPLETE under this policy: PARTIAL with progress, UNKNOWN without progress; Invalid/publicly unrepresentable location groups omit names too; native descent refusal alone does not omit a representable directory name; the root DEPTH_LIMIT/FRONTIER_LIMIT groups omit only descendants; REMAINDER applies with or without progress. Per-root FIFO finishes shallower admitted listings before deeper ones, one stream/root and a bounded 512-task/384 KiB queue. Separate reserved depth/frontier groups count matchable anchors, including empty unlisted directories; queue overflow continues sibling examination. Atomic worker/descriptor admission reserves roots + 2 credits/job below the effective soft limit with 128 non-search descriptors and a 72-credit owned ceiling, without raising limits. Entry/queue/depth/time/resource omissions remain explicit and unaccepted. Pre-open witness and replay/size-phase repairs require mandatory producer reviews before long-path classification design/review, then whole-resource review/planning; serviceability subject construction is specified; listener/store/action acceptance remains pending. FIFO repeats checked prefix walks against the wait and can omit later same-level names. Canonical-parent file paths require one firmlink presentation; all entry kinds use parent/listed locations, including 8192 bytes. Fresh successful directory reports supply descendant prefixes; cached variants may yield distinct file-location strings for one identity. Queued native descent size preserves names with exact VALUE_LIMIT SUBTREE. Worker-only stream/queue cleanup retains all charges and descriptor credits across blocked-call cancellation; current location/identity/policy is rechecked before every listing turn/read and child metadata open. Changed queued prefixes/parents use one root REMAINDER; only target-only change beneath an established unchanged parent uses exact SUBTREE. Actual no-prompt acceptance remains pending. No useful default coverage or reduced baseline is accepted. No content/default-handler lookup, download, clipboard or action. Locations feed existing open/reveal inputs without an identity guarantee; the client owns chooser and MRU. Three-second wait, bounded work/retained values and no continuation cursor; inspect coverage and publication errors."""
  workspaceSearchFiles(query: String!, roots: [String!], limit: Int = 50): WorkspaceFileSearchResult
}
