# Designed additive workspace search contribution; not served behavior.
# Every root and every reachable output field requires workspace:read only.
# Compose after workspace-schema.graphql; no foreign provider type is imported.
# Discovery/coverage and typed BLOCKED transport await load-bearing review.
# Native/default coverage and the protected-home baseline remain unaccepted.

"""Requires workspace:read throughout. AVAILABLE has matches only; DEPENDENCY_UNAVAILABLE has dependency only; BLOCKED/FAILED withhold matches. With no progress, real native/work failure precedes prompt risk, which precedes pure absence/exclusion. BLOCKED returns null matches/dependency without a search execution error, including matches aliases; consent is UNKNOWN, never observed absent. FAILED raises failed at each selected matches alias. Coverage-only selections retain the same status/diagnostics. Inspect publication errors and every root's coverage."""
enum WorkspaceSearchStatus {
  AVAILABLE
  BLOCKED
  DEPENDENCY_UNAVAILABLE
  FAILED
}

"""Coverage of the declared visible-name domain, never an atomic filesystem snapshot. Intrinsic hidden/package/symlink-descendant exclusions remain explicit."""
enum WorkspaceSearchCoverageState {
  COMPLETE
  PARTIAL
  UNKNOWN
}

"""SUBTREE covers every eligible name only when the root is COMPLETE. OBSERVED_DESCENDANTS asserts only counted entry/EOF observations somewhere beneath the root, never a complete listing or identifiable subset. One searched record after progress, zero before."""
enum WorkspaceSearchScopeExtent {
  SUBTREE
  OBSERVED_DESCENDANTS
}

"""ENTRY is one uncertain/omitted entry; SUBTREE is a named wholly skipped descendant scope. CHILD_GROUP counts only encountered child anchors of path; DESCENDANT_GROUP counts encountered intrinsic anchors somewhere under the root. Neither group means all children/descendants. REMAINDER is unfinished work after observed progress, including unvisited tails/tasks/metadata; it never claims the whole root was skipped."""
enum WorkspaceSearchSkippedExtent {
  ENTRY
  SUBTREE
  CHILD_GROUP
  DESCENDANT_GROUP
  REMAINDER
}

"""Only HIDDEN, PACKAGE_CONTENTS, SYMLINK_DESCENDANTS, SPECIAL_FILE and OPTIONAL_ROOT_ABSENT are intrinsic exclusions; all others affect coverage. Intrinsic descendant anchors aggregate per root/reason; exceptional unnamed children group at their actual representable parent."""
enum WorkspaceSearchSkipReason {
  HIDDEN
  PACKAGE_CONTENTS
  SYMLINK_DESCENDANTS
  SPECIAL_FILE
  PROMPT_RISK
  CLOUD_SCOPE
  UNSUPPORTED_SCOPE
  UNSUPPORTED_VOLUME
  MOUNT_BOUNDARY
  ROOT_NOT_FOUND
  OPTIONAL_ROOT_ABSENT
  ROOT_NOT_DIRECTORY
  ACCESS_DENIED
  INSPECTION_FAILED
  CHANGED_DURING_SEARCH
  UNREPRESENTABLE_NAME
  DEPTH_LIMIT
  FRONTIER_LIMIT
  ENTRY_LIMIT
  DIAGNOSTIC_LIMIT
  VALUE_LIMIT
  TIME_LIMIT
  CAPACITY_LIMIT
}

enum WorkspaceSearchPermissionKind { PERMISSION }
enum WorkspaceSearchPermissionClass { OS_PERMISSION }
enum WorkspaceSearchPermissionOwner { KOINE }
enum WorkspaceSearchPermissionReason { PROMPT_RISK }
enum WorkspaceSearchConsentState { UNKNOWN }

"""Requires workspace:read. Known traversal prompt risk, not observed denial or proof of absent consent. No new consent identifier or setup is approved."""
type WorkspaceSearchPermission {
  kind: WorkspaceSearchPermissionKind!
  permissionClass: WorkspaceSearchPermissionClass!
  permissionOwner: WorkspaceSearchPermissionOwner!
  permissionReason: WorkspaceSearchPermissionReason!
  """Canonical blocked scope, or requested absolute scope when unresolved."""
  permissionTarget: String!
  """Null in this design. Never Accessibility or an invented Files and Folders consent identifier."""
  osPermission: String
  consentState: WorkspaceSearchConsentState!
}

"""Requires workspace:read. Root observation summary. SUBTREE only for COMPLETE eligible-domain coverage; OBSERVED_DESCENDANTS conveys counts without a traversal history."""
type WorkspaceSearchScope {
  path: String!
  extent: WorkspaceSearchScopeExtent!
}

"""Requires workspace:read. A bounded exclusion or unknown remainder, including synthetic policy scopes that assert no existence."""
type WorkspaceSearchSkippedScope {
  """Exact entry/subtree, representable group parent, intrinsic group root, or root remainder anchor; never a fabricated undecodable child."""
  path: String!
  extent: WorkspaceSearchSkippedExtent!
  """Positive observed anchor count exactly for CHILD_GROUP/DESCENDANT_GROUP; null otherwise. Does not count omitted descendants or predict an unread tail."""
  count: Int
  reason: WorkspaceSearchSkipReason!
  affectsCoverage: Boolean!
  """Non-null exactly for PROMPT_RISK absent publication errors; native access denial with unknown consent cause is not this object."""
  permission: WorkspaceSearchPermission
  """Human explanation and recovery. Do not execute guidance as a command or trigger a read to acquire consent."""
  guidance: String!
}

"""Requires workspace:read. Exactly one per effective root, in input order, including missing, duplicate and never-scheduled roots. Positively absent optional home Applications/Cryptex defaults: COMPLETE, zero entries, no searched scopes, OPTIONAL_ROOT_ABSENT with affectsCoverage false; no progress. Explicit missing roots remain UNKNOWN/ROOT_NOT_FOUND."""
type WorkspaceSearchRootCoverage {
  rootIndex: Int!
  requestedPath: String!
  """Canonical root if established; null does not mean absent."""
  resolvedPath: String
  state: WorkspaceSearchCoverageState!
  examinedEntries: Int!
  """Listings that reached EOF, including empty directories; not proof of unchanged/fully classified contents."""
  completedDirectories: Int!
  searched: [WorkspaceSearchScope!]!
  skipped: [WorkspaceSearchSkippedScope!]!
}

enum WorkspaceSearchDependencyReason { NO_SEARCHABLE_ROOT }

"""Requires workspace:read. Every root is absent, not a directory or unsupported/excluded by the declared domain. Exact reasons remain in coverage; never an index-health inference."""
type WorkspaceSearchDependency {
  reason: WorkspaceSearchDependencyReason!
  guidance: String!
}

"""INSTALLED is a present application with a nonblank identifier registered at its native file identity. UNREGISTERED positively lacks registration at that identity; UNKNOWN lacks established metadata/registration. Both remain reveal/copy candidates, and neither forms a launch choice."""
enum WorkspaceSearchInstallationState {
  INSTALLED
  UNREGISTERED
  UNKNOWN
}

"""Requires workspace:read. A location observation, including checked .app-link spelling, not a process incarnation or resource reference. Pass both known identifier and path to the existing constrained launch input; actions revalidate."""
type WorkspaceApplicationMatch {
  applicationPath: String!
  """Observed final filename including extension, including a checked .app link name; no localized display-name or icon lookup."""
  name: String!
  bundleIdentifier: String
  installationState: WorkspaceSearchInstallationState!
  """Every effective root in which this exact returned path matched, ascending; duplicate bundle identifiers do not merge installations."""
  rootIndices: [Int!]!
}

enum WorkspaceSearchFileKind {
  FILE
  DIRECTORY
  PACKAGE
  APPLICATION
  ALIAS
  SYMLINK
  UNKNOWN
}

"""ELIGIBLE is only the current metadata payload check, not handler availability or future readability. REFUSED items can be revealed/copied. UNKNOWN never proves executable content."""
enum WorkspaceSearchOpenDisposition {
  ELIGIBLE
  REFUSED
  UNKNOWN
}

enum WorkspaceSearchDefaultHandlerState { UNKNOWN }

"""Requires workspace:read. A known installed app selector shape, not an input object or authority grant. Search does not populate defaultApplication in this design."""
type WorkspaceSearchApplicationSelector {
  bundleIdentifier: String!
  applicationPath: String!
}

"""Requires workspace:read. A selectable location, not a pinned file identity. Symlinks/aliases are names only; descendant symlinks are never traversed."""
type WorkspaceFileMatch {
  path: String!
  name: String!
  kind: WorkspaceSearchFileKind!
  """Native type identifier when obtained prompt-free; no contents are read. Null is unknown, not proof of no type."""
  contentType: String
  openDisposition: WorkspaceSearchOpenDisposition!
  """Always UNKNOWN: no document default-handler lookup or type-only fallback occurs in search."""
  defaultHandlerState: WorkspaceSearchDefaultHandlerState!
  """Always null in this design, never evidence of NO_DEFAULT_HANDLER."""
  defaultApplication: WorkspaceSearchApplicationSelector
  defaultHandlerGuidance: String!
  rootIndices: [Int!]!
}

"""Requires workspace:read throughout. Coverage survives FAILED matches errors unless normal publication denial propagates. BLOCKED is typed policy data, with null matches/dependency, false resultsTruncated and no search execution error; all roots have no progress, with UNKNOWN coverage except absent optional defaults' COMPLETE empty domain. No error-free result has both matches and dependency. Status never overrides a publication error."""
type WorkspaceApplicationSearchResult {
  status: WorkspaceSearchStatus!
  """Non-null exactly for AVAILABLE absent publication errors. BLOCKED and DEPENDENCY_UNAVAILABLE return ordinary null without an error; FAILED raises failed here, separately at every selected alias. Read the frozen root result without another native inspection. Publication denial retains its capability error/path and normal null propagation. Native absence is not encoded as an empty successful list."""
  matches: [WorkspaceApplicationMatch!]
  coverage: [WorkspaceSearchRootCoverage!]!
  dependency: WorkspaceSearchDependency
  """At least one observed matching location omitted by count/path-value bounds; fixed 16 KiB match slots prevent metadata-size ranking changes. Independent of per-root traversal coverage."""
  resultsTruncated: Boolean!
}

"""Requires workspace:read throughout. Empty AVAILABLE may be partial; inspect coverage and errors. BLOCKED is error-free typed policy data with null matches/dependency, false resultsTruncated and no progress; UNKNOWN coverage except absent optional defaults' COMPLETE empty domain. FAILED carries no list and errors at selected matches. Status never overrides a publication error."""
type WorkspaceFileSearchResult {
  status: WorkspaceSearchStatus!
  """Non-null exactly for AVAILABLE absent publication errors. BLOCKED and DEPENDENCY_UNAVAILABLE return ordinary null without an error; FAILED raises failed here at every selected alias. No nested selection schedules native work. Publication denial retains its capability error/path and normal null propagation."""
  matches: [WorkspaceFileMatch!]
  coverage: [WorkspaceSearchRootCoverage!]!
  dependency: WorkspaceSearchDependency
  resultsTruncated: Boolean!
}

extend type Query {
  """Requires workspace:read only, including every result field. Literal substring of filename or stem after removing one terminal .app (ASCII case-insensitive); rank by the better exact/prefix/substring tier. NFC normalization, en_US_POSIX case/diacritic folding, NFC again; canonical equivalents must match. Query at most 256 UTF-8 bytes, no NUL; empty matches all. Default application roots are /Applications, /System/Applications, Koine-home Applications, /System/Library/CoreServices and /System/Cryptexes/App/System/Applications. Ordinary folders are traversed; visible .app links receive checked target metadata only, never target traversal. Added roots/link/stream behavior awaits signed-host acceptance. Cyclic root/directory scheduling and independent root budgets do not guarantee syscall duration or exhaustive inventory. Supplied roots replace defaults (1...16 literal absolute local paths, at most 4096 bytes each). Positively absent optional home/Cryptex defaults have COMPLETE empty-domain coverage; explicit missing roots do not. Non-null limit is 1...200, default 50. No Spotlight or consent probing. No exhaustive installed-app inventory or MRU. A three-second wait can return partial coverage; the core deadline may answer first. Protected traversal is blocked before native access."""
  workspaceSearchApplications(query: String!, roots: [String!], limit: Int = 50): WorkspaceApplicationSearchResult
  """Requires workspace:read only, including every result field. Literal substring of full filename including extension, NFC normalization, en_US_POSIX case/diacritic folding, NFC again; canonical equivalents must match. Same input lengths, root and limit rules as application search; omitted/null roots use Koine's home. Ordinary local startup-volume roots only, with hidden/package/symlink-descendant exclusions and explicit protected/cloud/mount/bound diagnostics. Home cannot be COMPLETE under this policy: PARTIAL with progress, UNKNOWN without progress; Root observation/group/remainder semantics and independent budgets await review and native acceptance; useful default coverage and the baseline remain unaccepted. No content/default-handler lookup, download, clipboard or action. Locations feed existing open/reveal inputs without an identity guarantee; the client owns chooser and MRU. Three-second wait, bounded work/retained values and no continuation cursor; inspect coverage and publication errors."""
  workspaceSearchFiles(query: String!, roots: [String!], limit: Int = 50): WorkspaceFileSearchResult
}
