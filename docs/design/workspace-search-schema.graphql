# Designed additive workspace search contribution; not served behavior.
# Every root and every reachable output field requires workspace:read only.
# Compose after workspace-schema.graphql; no foreign provider type is imported.
# Discovery review reopened traversal order and process-wide descriptor admission.
# Their replacement/load-bearing review is required before implementation planning.
# Canonical-path, worker ownership and policy-witness repairs await native acceptance.
# Typed BLOCKED transport is reviewed; runtime/binary acceptance remains pending.
# Native/default coverage and the protected-home baseline remain unaccepted.

"""Requires workspace:read throughout. AVAILABLE has matches only; DEPENDENCY_UNAVAILABLE has dependency only; BLOCKED/FAILED withhold matches. With no progress, native/identity inspection failure or work/resource refusal precedes prompt risk, which precedes pure absence/exclusion. CHANGED_DURING_SEARCH contributes failure; uncertain anchor resolution is INSPECTION_FAILED unless absence/exclusion is established. BLOCKED returns null matches/dependency without a search-generated error, including matches aliases; consent is UNKNOWN, never observed absent. FAILED raises failed at each selected matches alias. Error-free coverage-only selections retain the same status/diagnostics. All branch invariants are subject to execution errors at or above selected fields, including lifecycle and publication; inspect errors and every root's coverage."""
enum WorkspaceSearchStatus {
  AVAILABLE
  BLOCKED
  DEPENDENCY_UNAVAILABLE
  FAILED
}

"""Coverage of the declared visible-name domain, never an atomic filesystem snapshot. Intrinsic hidden/package/symlink-descendant exclusions remain explicit."""
enum WorkspaceSearchCoverageState {
  COMPLETE
  PARTIAL
  UNKNOWN
}

"""SUBTREE covers every eligible name only when the root is COMPLETE. OBSERVED_DESCENDANTS asserts only counted entry/EOF observations somewhere beneath the root, never a complete listing or identifiable subset. One searched record after progress, zero before."""
enum WorkspaceSearchScopeExtent {
  SUBTREE
  OBSERVED_DESCENDANTS
}

"""ENTRY is one uncertain/omitted entry; SUBTREE is a named wholly skipped descendant scope. CHILD_GROUP counts encountered invalid/overlong-name child anchors of the actual representable parent: UNREPRESENTABLE_NAME or overlong-path VALUE_LIMIT omit anchors and descendants. DESCENDANT_GROUP counts intrinsic anchors or DEPTH_LIMIT directory anchors under the root; depth-bound anchor names remain matchable, descendants are omitted. Neither group means all children/descendants. REMAINDER is unfinished work with or without progress, including unopened roots/tails/held-stream work/metadata; it never claims the whole root was skipped or a known-size domain. Its anchor is the resolved root if established within bounds, otherwise the representable requested root. No-progress stops have UNKNOWN coverage and no searched record."""
enum WorkspaceSearchSkippedExtent {
  ENTRY
  SUBTREE
  CHILD_GROUP
  DESCENDANT_GROUP
  REMAINDER
}

"""Only HIDDEN, PACKAGE_CONTENTS, SYMLINK_DESCENDANTS, SPECIAL_FILE and OPTIONAL_ROOT_ABSENT are intrinsic exclusions; all others affect coverage. Intrinsic anchors and affecting DEPTH_LIMIT anchors aggregate separately per root/reason; depth has one reserved record. CHILD_GROUP is limited to UNREPRESENTABLE_NAME/overlong-path VALUE_LIMIT at the actual representable parent. Other exceptions identify an exact entry/subtree or root remainder. FRONTIER_LIMIT is retained vocabulary, not emitted by the reopened DFS proposal; replacement traversal must reconcile its use."""
enum WorkspaceSearchSkipReason {
  HIDDEN
  PACKAGE_CONTENTS
  SYMLINK_DESCENDANTS
  SPECIAL_FILE
  PROMPT_RISK
  CLOUD_SCOPE
  UNSUPPORTED_SCOPE
  UNSUPPORTED_VOLUME
  MOUNT_BOUNDARY
  ROOT_NOT_FOUND
  OPTIONAL_ROOT_ABSENT
  ROOT_NOT_DIRECTORY
  ACCESS_DENIED
  """Native/identity uncertainty or resource inspection failure. Pre-turn admission/policy anchor-account refusal yields every root UNKNOWN, zero counts, no searched scopes and requested-path REMAINDER; no policy witness is discarded."""
  INSPECTION_FAILED
  """Observed identity/mount change refuses inspection. With no root progress this contributes FAILED, including alongside PROMPT_RISK; after progress it affects AVAILABLE coverage."""
  CHANGED_DURING_SEARCH
  UNREPRESENTABLE_NAME
  """Encountered ordinary directory anchors at depth 32: each anchor increments one affecting root DESCENDANT_GROUP, including an empty directory whose EOF is unobserved; names remain matchable, only descendants are omitted."""
  DEPTH_LIMIT
  """Retained vocabulary; the reopened depth-first proposal has no directory frontier. Its required replacement must specify any emitted frontier reason/group."""
  FRONTIER_LIMIT
  ENTRY_LIMIT
  """Coverage record-count or total-byte partition exhausted: root REMAINDER preserves earlier diagnostics. Fixed guidance identifies which account; record count wins if both fail."""
  DIAGNOSTIC_LIMIT
  """Individual path exceeds its value bound, never total diagnostic room. CHILD_GROUP omits an overlong child and descendants; root REMAINDER stops an overlong resolved root at its representable requested path, resolvedPath null."""
  VALUE_LIMIT
  """Wait expired: REMAINDER even before progress or while the first listing blocks. No-progress coverage is UNKNOWN with no searched record."""
  TIME_LIMIT
  """Process-wide worker admission refused before inspection: requested-root REMAINDER, UNKNOWN coverage and no searched record."""
  CAPACITY_LIMIT
}

enum WorkspaceSearchPermissionKind { PERMISSION }
enum WorkspaceSearchPermissionClass { OS_PERMISSION }
enum WorkspaceSearchPermissionOwner { KOINE }
enum WorkspaceSearchPermissionReason { PROMPT_RISK }
enum WorkspaceSearchConsentState { UNKNOWN }

"""Requires workspace:read. Known traversal prompt risk, not observed denial or proof of absent consent. No new consent identifier or setup is approved."""
type WorkspaceSearchPermission {
  kind: WorkspaceSearchPermissionKind!
  permissionClass: WorkspaceSearchPermissionClass!
  permissionOwner: WorkspaceSearchPermissionOwner!
  permissionReason: WorkspaceSearchPermissionReason!
  """Canonical blocked scope derived from canonical-home components without opening excluded directories, or requested absolute scope when unresolved."""
  permissionTarget: String!
  """Null in this design. Never Accessibility or an invented Files and Folders consent identifier."""
  osPermission: String
  consentState: WorkspaceSearchConsentState!
}

"""Requires workspace:read. Root observation summary. SUBTREE only for COMPLETE eligible-domain coverage; OBSERVED_DESCENDANTS conveys counts without a traversal history."""
type WorkspaceSearchScope {
  path: String!
  extent: WorkspaceSearchScopeExtent!
}

"""Requires workspace:read. A bounded exclusion or unknown remainder, including synthetic policy scopes that assert no existence."""
type WorkspaceSearchSkippedScope {
  """Exact entry/subtree, representable group parent, intrinsic group root, or root remainder anchor; never a fabricated undecodable child."""
  path: String!
  extent: WorkspaceSearchSkippedExtent!
  """Positive observed anchor count exactly for CHILD_GROUP/DESCENDANT_GROUP; null otherwise. Does not count omitted descendants or predict an unread tail."""
  count: Int
  reason: WorkspaceSearchSkipReason!
  affectsCoverage: Boolean!
  """Non-null exactly for PROMPT_RISK absent execution errors at or above this field; native access denial with unknown consent cause is not this object."""
  permission: WorkspaceSearchPermission
  """Human explanation and recovery. Do not execute guidance as a command or trigger a read to acquire consent."""
  guidance: String!
}

"""Requires workspace:read. Exactly one per effective root, in input order, including missing, duplicate and never-scheduled roots. Positively absent optional home Applications/Cryptex defaults: COMPLETE, zero entries, no searched scopes, OPTIONAL_ROOT_ABSENT with affectsCoverage false; no progress. Explicit missing roots remain UNKNOWN/ROOT_NOT_FOUND."""
type WorkspaceSearchRootCoverage {
  rootIndex: Int!
  requestedPath: String!
  """Filesystem-reported root path from the same directory-path operation as admitted anchors/frames/bundles; firmlink aliases share this spelling. Preliminary link resolution is not returned canonicalization. Null does not mean absent."""
  resolvedPath: String
  state: WorkspaceSearchCoverageState!
  examinedEntries: Int!
  """Listings that reached EOF, including empty directories; not proof of unchanged/fully classified contents."""
  completedDirectories: Int!
  searched: [WorkspaceSearchScope!]!
  skipped: [WorkspaceSearchSkippedScope!]!
}

enum WorkspaceSearchDependencyReason { NO_SEARCHABLE_ROOT }

"""Requires workspace:read. Every root is absent, not a directory or unsupported/excluded by the declared domain. Exact reasons remain in coverage; never an index-health inference."""
type WorkspaceSearchDependency {
  reason: WorkspaceSearchDependencyReason!
  guidance: String!
}

"""INSTALLED is a present application with a nonblank identifier registered at its native file identity. UNREGISTERED positively lacks registration at that identity; UNKNOWN lacks established metadata/registration. Both remain reveal/copy candidates, and neither forms a launch choice."""
enum WorkspaceSearchInstallationState {
  INSTALLED
  UNREGISTERED
  UNKNOWN
}

"""Requires workspace:read. A location observation, using the checked canonical target spelling, not a process incarnation or resource reference. Pass both known identifier and path to the existing constrained launch input; actions revalidate."""
type WorkspaceApplicationMatch {
  applicationPath: String!
  """Observed final filename including extension, of the canonical bundle target, never a link alias name; no localized display-name or icon lookup."""
  name: String!
  bundleIdentifier: String
  installationState: WorkspaceSearchInstallationState!
  """Ascending roots that observed this matching native bundle identity. Checked-link/direct routes merge into one canonical target choice; equal identifiers do not merge distinct copies. In unchanged observations, fixed canonical rank preserves all observed membership for final choices; no membership is inferred from unexamined roots. Changing filesystems retain the spec's observation limits."""
  rootIndices: [Int!]!
}

enum WorkspaceSearchFileKind {
  FILE
  DIRECTORY
  PACKAGE
  APPLICATION
  ALIAS
  SYMLINK
  UNKNOWN
}

"""ELIGIBLE is only the current metadata payload check, not handler availability or future readability. REFUSED items can be revealed/copied. UNKNOWN never proves executable content."""
enum WorkspaceSearchOpenDisposition {
  ELIGIBLE
  REFUSED
  UNKNOWN
}

enum WorkspaceSearchDefaultHandlerState { UNKNOWN }

"""Requires workspace:read. A known installed app selector shape, not an input object or authority grant. Search does not populate defaultApplication in this design."""
type WorkspaceSearchApplicationSelector {
  bundleIdentifier: String!
  applicationPath: String!
}

"""Requires workspace:read. A selectable location, not a pinned file identity. Symlinks/aliases are names only; descendant symlinks are never traversed."""
type WorkspaceFileMatch {
  """Canonical parent directory path plus the lossless observed entry name; final symlink/alias targets are not resolved. Firmlink-alias roots deduplicate equal returned locations."""
  path: String!
  name: String!
  kind: WorkspaceSearchFileKind!
  """Native type identifier when obtained prompt-free; no contents are read. Null is unknown, not proof of no type."""
  contentType: String
  openDisposition: WorkspaceSearchOpenDisposition!
  """Always UNKNOWN: no document default-handler lookup or type-only fallback occurs in search."""
  defaultHandlerState: WorkspaceSearchDefaultHandlerState!
  """Always null in this design, never evidence of NO_DEFAULT_HANDLER."""
  defaultApplication: WorkspaceSearchApplicationSelector
  defaultHandlerGuidance: String!
  rootIndices: [Int!]!
}

"""Requires workspace:read throughout. Coverage survives a search-generated FAILED matches error; other execution errors can suppress fields through normal propagation. Absent execution errors at or above selected fields, BLOCKED is typed policy data with null matches/dependency, false resultsTruncated and no search-generated error; all roots have no progress, with UNKNOWN coverage except absent optional defaults' COMPLETE empty domain. No error-free result has both matches and dependency. Status never overrides field/lifecycle/publication errors."""
type WorkspaceApplicationSearchResult {
  status: WorkspaceSearchStatus!
  """Non-null exactly for AVAILABLE absent execution errors at or above this field. BLOCKED and DEPENDENCY_UNAVAILABLE return ordinary null without a search-generated error; FAILED raises failed here, separately at every selected alias. Read the frozen root result without another native inspection. A stopped provider can return unavailable here even beside surviving BLOCKED status. Lifecycle/publication errors retain original paths and normal null propagation. Native absence is not encoded as an empty successful list."""
  matches: [WorkspaceApplicationMatch!]
  coverage: [WorkspaceSearchRootCoverage!]!
  dependency: WorkspaceSearchDependency
  """At least one finalized matching application identity omitted by count/path-value bounds; duplicate discovery routes do not count; fixed 16 KiB match slots prevent metadata-size ranking changes. Independent of per-root traversal coverage."""
  resultsTruncated: Boolean!
}

"""Requires workspace:read throughout. Empty AVAILABLE may be partial; inspect coverage and errors. Absent execution errors at or above selected fields, BLOCKED is error-free typed policy data with null matches/dependency, false resultsTruncated and no progress; UNKNOWN coverage except absent optional defaults' COMPLETE empty domain. FAILED carries no list and errors at selected matches. Status never overrides field/lifecycle/publication errors."""
type WorkspaceFileSearchResult {
  status: WorkspaceSearchStatus!
  """Non-null exactly for AVAILABLE absent execution errors at or above this field. BLOCKED and DEPENDENCY_UNAVAILABLE return ordinary null without a search-generated error; FAILED raises failed here at every selected alias. No nested selection schedules native work. A stopped provider can return unavailable here even beside surviving BLOCKED status. Lifecycle/publication errors retain original paths and normal null propagation."""
  matches: [WorkspaceFileMatch!]
  coverage: [WorkspaceSearchRootCoverage!]!
  dependency: WorkspaceSearchDependency
  resultsTruncated: Boolean!
}

extend type Query {
  """Requires workspace:read only, including every result field. Literal substring of the metadata-resolved canonical bundle filename or stem (also for checked .app links) after removing one terminal .app (ASCII case-insensitive); rank by the better exact/prefix/substring tier. NFC normalization, en_US_POSIX case/diacritic folding, NFC again; canonical equivalents must match. Query at most 256 UTF-8 bytes, no NUL; empty matches all. Default application roots are /Applications, /System/Applications, Koine-home Applications, /System/Library/CoreServices and /System/Cryptexes/App/System/Applications. Ordinary folders are traversed; visible .app links receive checked target metadata only, never target traversal. Fixed presentation-region/Preboot mount admission permits local APFS read-write or read-only without admitting arbitrary Preboot or file-search roots. Canonical target names/paths rank route-independently; native bundle identity merges links/direct paths while distinct installations sharing an identifier stay distinct. Review reopened traversal order and process-wide descriptor admission: the 32-frame DFS shape is not ready to implement. A replacement with shallow-first witnesses and non-search descriptor reserve needs load-bearing review before planning. One reserved depth group counts anchors themselves. Roots/frames/bundles share one filesystem-reported directory-path operation; actual firmlink/case/Unicode behavior awaits signed-host acceptance. Independent root budgets do not guarantee syscall duration or exhaustive inventory. Supplied roots replace defaults (1...16 literal absolute local paths, at most 4096 bytes each). Positively absent optional home/Cryptex defaults have COMPLETE empty-domain coverage; explicit missing roots do not. Non-null limit is 1...200, default 50. No Spotlight or consent probing. No exhaustive installed-app inventory or MRU. A three-second wait can return partial coverage; the core deadline may answer first. Protected traversal is blocked before descent; pre-policy native link resolution into sensitive Library targets has no measured prompt-free guarantee and requires actual-call acceptance."""
  workspaceSearchApplications(query: String!, roots: [String!], limit: Int = 50): WorkspaceApplicationSearchResult
  """Requires workspace:read only, including every result field. Literal substring of full filename including extension, NFC normalization, en_US_POSIX case/diacritic folding, NFC again; canonical equivalents must match. Same input lengths, root and limit rules as application search; omitted/null roots use Koine's home. Ordinary local startup-volume roots only, with hidden/package/symlink-descendant exclusions and explicit protected/cloud/mount/bound diagnostics. Home cannot be COMPLETE under this policy: PARTIAL with progress, UNKNOWN without progress; Invalid/value parent groups omit names too; the root DEPTH_LIMIT group omits only descendants; REMAINDER applies with or without progress. Traversal order and process-wide descriptor admission require a replacement/load-bearing review before planning: the DFS proposal loses shallow names at the per-root entry budget and shares the process table with unrelated Koine work. Entry/time/resource omissions remain explicit and unaccepted. One reserved depth group counts anchors themselves, including empty unlisted directories. Canonical-parent file paths deduplicate firmlink-alias roots. Worker-only frame cleanup retains all charges across blocked-call cancellation; parent location/identity/policy is rechecked before child open, with actual no-prompt acceptance still pending. No useful default coverage or reduced baseline is accepted. No content/default-handler lookup, download, clipboard or action. Locations feed existing open/reveal inputs without an identity guarantee; the client owns chooser and MRU. Three-second wait, bounded work/retained values and no continuation cursor; inspect coverage and publication errors."""
  workspaceSearchFiles(query: String!, roots: [String!], limit: Int = 50): WorkspaceFileSearchResult
}
